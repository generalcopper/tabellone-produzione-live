<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f9f9ff">
  <title>Nuova scheda</title>
  <link rel="icon" href="assets/google.png">
  <link rel="stylesheet" href="newtab.css">
  <script type="module" src="newtab.js"></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="search-icon" viewBox="0 0 24 24"><path d="m21 21-5.1-5.1m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="mic-icon" viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v7a3 3 0 0 0 3 3Zm-7-4v1a7 7 0 0 0 6 6.93V22h2v-3.07A7 7 0 0 0 19 12v-1h-2v1a5 5 0 0 1-10 0v-1Z" fill="currentColor"/></symbol>
    <symbol id="lens-icon" viewBox="0 0 24 24"><path d="M8 4h1l1-2h4l1 2h1m-9 1H5a3 3 0 0 0-3 3v2m0 4v2a3 3 0 0 0 3 3h2m10 0h2a3 3 0 0 0 3-3v-2m0-4V8a3 3 0 0 0-3-3h-2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="11" r="3.5" fill="currentColor"/><circle cx="16.5" cy="20" r="1.5" fill="currentColor"/></symbol>
    <symbol id="ai-icon" viewBox="0 0 24 24"><path d="m15 16 5 5M9 4a7 7 0 1 0 5 12M18 2l1.2 3.8L23 7l-3.8 1.2L18 12l-1.2-3.8L13 7l3.8-1.2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="plus-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="dots-icon" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></symbol>
    <symbol id="pencil-icon" viewBox="0 0 24 24"><path d="m4 16-1 5 5-1L20 8l-4-4Zm13-13 2-2 4 4-2 2Z" fill="currentColor"/></symbol>
    <symbol id="apps-icon" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></g></symbol>
  </svg>
  <header class="topbar">
    <a href="https://mail.google.com/">Gmail</a>
    <a href="https://www.google.com/imghp?hl=it">Immagini</a>
    <a class="icon-button apps-link" href="https://about.google/products/" aria-label="App Google" title="App Google"><svg><use href="#apps-icon"/></svg></a>
    <a class="profile" href="https://myaccount.google.com/" aria-label="Account Google" title="Account Google">L</a>
  </header>
  <main>
    <a class="google-logo" href="https://www.google.com/" aria-label="Google"></a>
    <form id="search-form" class="searchbox" action="https://www.google.com/search" method="get" role="search">
      <svg class="search-symbol" aria-hidden="true"><use href="#search-icon"/></svg>
      <input id="search-input" name="q" type="text" placeholder="Cerca con Google o digita un URL" aria-label="Cerca con Google o digita un URL" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="button" id="voice-button" class="icon-button search-action" aria-label="Ricerca vocale" title="Ricerca vocale"><svg><use href="#mic-icon"/></svg></button>
      <a class="icon-button search-action" href="https://lens.google/" aria-label="Ricerca tramite immagine" title="Ricerca tramite immagine"><svg><use href="#lens-icon"/></svg></a>
      <button type="button" id="ai-button" class="ai-button"><svg aria-hidden="true"><use href="#ai-icon"/></svg><span>AI Mode</span></button>
    </form>
    <nav id="shortcuts" class="shortcuts" aria-label="Scorciatoie"></nav>
  </main>
  <button class="customize" id="customize-button" type="button"><svg aria-hidden="true"><use href="#pencil-icon"/></svg>Personalizza</button>
  <div id="shortcut-menu" class="shortcut-menu" role="menu" popover="auto" aria-label="Opzioni scorciatoia">
    <button id="menu-edit" type="button" role="menuitem">Modifica scorciatoia</button>
    <button id="menu-remove" type="button" role="menuitem">Rimuovi</button>
  </div>
  <dialog id="shortcut-dialog" aria-labelledby="dialog-title">
    <form id="shortcut-form">
      <h1 id="dialog-title">Aggiungi scorciatoia</h1>
      <label for="shortcut-name">Nome</label>
      <input id="shortcut-name" type="text" maxlength="120" required autocomplete="off">
      <label for="shortcut-url">URL</label>
      <input id="shortcut-url" type="text" inputmode="url" maxlength="8192" required autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="url-error">
      <p id="url-error" class="field-error" aria-live="polite"></p>
      <div class="dialog-actions">
        <button type="button" id="dialog-remove" class="text-button remove-button" hidden>Rimuovi</button>
        <span class="spacer"></span>
        <button type="button" id="dialog-cancel" class="text-button">Annulla</button>
        <button type="submit" id="dialog-save" class="primary-button">Fine</button>
      </div>
    </form>
  </dialog>
  <dialog id="customize-dialog" aria-labelledby="customize-title">
    <h1 id="customize-title">Scorciatoie</h1>
    <button type="button" id="customize-add" class="setting-button">Aggiungi scorciatoia</button>
    <button type="button" id="export-button" class="setting-button">Esporta scorciatoie</button>
    <button type="button" id="import-button" class="setting-button">Importa scorciatoie</button>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
    <button type="button" id="restore-button" class="setting-button">Ripristina scorciatoie predefinite</button>
    <div class="dialog-actions"><span class="spacer"></span><button type="button" class="primary-button" id="customize-close">Fine</button></div>
  </dialog>
  <dialog id="voice-dialog" aria-labelledby="voice-title">
    <h1 id="voice-title">Pronuncia la ricerca</h1>
    <svg class="voice-symbol" aria-hidden="true"><use href="#mic-icon"/></svg>
    <div class="dialog-actions"><span class="spacer"></span><button type="button" class="text-button" id="voice-close">Chiudi</button></div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden><span id="toast-message"></span><button id="undo-button" type="button" hidden>Annulla</button></div>
</body>
</html>
