<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Thermal PDF Print</title>

  <!-- PDF.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"></script>
  <!-- jsPDF (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>

  <style>
    :root{
      --bg:#0b1220;
      --card:#0f1a30;
      --text:#e8eefc;
      --muted:#a7b2ce;

      /* viene impostato automaticamente dal PDF */
      --paper-w-mm: 100;
      --paper-h-mm: 150;
      --paper-margin-mm: 0;
    }

    html, body { height: 100%; }
    body{
      margin:0;
      background: linear-gradient(180deg, var(--bg), #050a14);
      color:var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .topbar{
      position: sticky;
      top: 0;
      z-index: 10;
      padding-top: env(safe-area-inset-top);
      background: rgba(11,18,32,.90);
      backdrop-filter: blur(10px);
    }
    .backBtn{
      position: absolute;
      top: calc(10px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      border: none;
      border-radius: 18px;
      padding: 14px 30px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: .02em;
      background: #1c6fe6;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 16px 30px rgba(28,111,230,.28);
      transition: transform .12s ease, box-shadow .16s ease, filter .16s ease;
    }
    .backBtn:hover{ filter: brightness(1.05); }
    .backBtn:active{
      transform: translateX(-50%) translateY(2px);
      box-shadow: 0 10px 20px rgba(28,111,230,.24);
    }
    .backBtn:focus-visible{
      outline: 3px solid rgba(28,111,230,.35);
      outline-offset: 2px;
    }
    .bar{
      display:flex;
      gap:14px;
      align-items:center;
      justify-content: space-between;
      padding: 70px 16px 14px;
      flex-wrap: wrap;
    }
    .title{
      font-weight: 900;
      letter-spacing: .2px;
      display:flex;
      align-items:center;
      gap:10px;
      white-space: nowrap;
      font-size: 18px;
    }
    .pill{
      font-size: 12px;
      color: var(--muted);
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 999px;
      white-space: nowrap;
    }

    .wrap{
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    }

    .card{
      background: rgba(15,26,48,.85);
      border: none;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    /* BOTTONI GIGANTI */
    .controls{
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap: wrap;
    }
    .btn{
      appearance:none;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.08);
      color: var(--text);
      border-radius: 18px;
      padding: 18px 22px;
      font-weight: 900;
      font-size: 18px;
      cursor: pointer;
      display:inline-flex;
      gap:10px;
      align-items:center;
      transition: transform .06s ease, background .15s ease, border-color .15s ease, opacity .15s ease;
      user-select:none;
    }
    .btn:hover{ background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.26); }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{
      background: rgba(77,163,255,.20);
      border-color: rgba(77,163,255,.55);
    }
    .btn:disabled{
      opacity: .45;
      cursor: not-allowed;
      transform:none;
    }

    .fileRow{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    /* input file nascosto (usiamo label come bottone) */
    #fileInput{ position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }
    .fileBtn{ display:inline-flex; }

    .status{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
    }
    .spinner{
      width: 30px;
      height: 30px;
      position: relative;
      opacity: 0;
      transform: scale(.9);
      transition: opacity .16s ease, transform .16s ease;
    }
    .spinner::before{
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,.12);
      border-top-color: #1c6fe6;
      animation: spin .8s linear infinite;
    }
    .spinner.is-active{
      opacity: 1;
      transform: scale(1);
    }
    @keyframes spin{
      to{ transform: rotate(360deg); }
    }

    .pages{
      margin-top: 14px;
      display:grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    @media (max-width: 1000px){ .pages{ grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 760px){ .pages{ grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 520px){ .pages{ grid-template-columns: 1fr; } }

    .thumb{
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      overflow:hidden;
      position: relative;
      aspect-ratio: 2/3;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .thumb img{
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
    }
    .badge{
      position:absolute;
      top:10px;
      left:10px;
      font-size: 12px;
      font-weight: 900;
      color: #0b1220;
      background: rgba(232,238,252,.92);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(11,18,32,.18);
    }

    /* Print styles */
    @media print{
      body{ background:#fff !important; color:#000; }
      .topbar, .wrap, .previewWrap { display:none !important; }
      .print-area{ display:block !important; }
      @page{
        size: calc(var(--paper-w-mm) * 1mm) calc(var(--paper-h-mm) * 1mm);
        margin: calc(var(--paper-margin-mm) * 1mm);
      }
      .print-page{
        width: calc(var(--paper-w-mm) * 1mm);
        height: calc(var(--paper-h-mm) * 1mm);
        page-break-after: always;
        break-after: page;
        display:flex;
        align-items: stretch;
        justify-content: stretch;
      }
      .print-page img{
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    }
    .print-area{ display:none; }
  </style>
</head>

<body>
  <div class="topbar">
    <button class="backBtn" id="btnBack" type="button">Indietro</button>
    <div class="bar">
      <div class="title">
        Thermal PDF Print
        <span class="pill" id="pillSize">Formato: —</span>
      </div>

      <div class="controls">
        <button id="btnPrint" class="btn primary" disabled>Stampa</button>
        <button id="btnSavePdf" class="btn" disabled>Salva PDF</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="fileRow">
        <div class="controls">
          <input id="fileInput" type="file" accept="application/pdf" />
          <label for="fileInput" class="btn fileBtn">Scegli PDF</label>
          <span class="pill" id="pillFile">Nessun file</span>
        </div>
      </div>

      <div class="status">
        <div id="statusText">Seleziona un PDF: render automatico in massima qualità.</div>
        <div class="spinner" id="statusSpinner" aria-hidden="true"></div>
      </div>
    </div>

    <div class="card previewWrap" style="margin-top:14px;">
      <div class="pages" id="thumbGrid"></div>
    </div>
  </div>

  <!-- Print container (hidden on screen) -->
  <div class="print-area" id="printArea"></div>

  <script>
    // PDF.js global
    const pdfjsLib = window.pdfjsLib;
    if(!pdfjsLib){
      alert('PDF.js non caricato. Verifica connessione internet o che il CDN non sia bloccato.');
      throw new Error('pdfjsLib missing');
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const els = {
      fileInput: document.getElementById('fileInput'),
      btnPrint: document.getElementById('btnPrint'),
      btnSavePdf: document.getElementById('btnSavePdf'),
      pillSize: document.getElementById('pillSize'),
      pillFile: document.getElementById('pillFile'),
      statusText: document.getElementById('statusText'),
      statusSpinner: document.getElementById('statusSpinner'),
      thumbGrid: document.getElementById('thumbGrid'),
      printArea: document.getElementById('printArea'),
    };

    // Max quality (automatico)
    const CFG = {
      dpi: 600,
      marginMm: 0,
      trim: true,
      trimSampleStep: 4,
      trimPad: 12,
      maxRenderPixels: 28_000_000,
      maxRenderDim: 12_000,
    };

    // Formato etichetta fisso (mm)
    // (richiesta: il file salvato deve essere 102×204 mm)
    const FIXED_PAPER_MM = { w: 102, h: 204 };

    let currentPdf = null;
    let currentPdfName = '';
    let pageCount = 0;
    let rendered = []; // {pageNumber, url}
    let paperMm = { w: 100, h: 150 };

    let isBusy = false;

    function setStatus(msg){ els.statusText.textContent = msg; }
    function setSpinner(active){
      if(!els.statusSpinner) return;
      els.statusSpinner.classList.toggle('is-active', !!active);
    }
    function setProgress(pct){
      const active = typeof pct === 'number' ? pct > 0 && pct < 100 : isBusy;
      setSpinner(active || isBusy);
    }

    function setUiBusy(busy){
      isBusy = !!busy;
      setSpinner(isBusy);
      els.btnPrint.disabled = isBusy || !rendered.length;
      els.btnSavePdf.disabled = isBusy || !rendered.length;
      els.fileInput.disabled = isBusy;
    }

    function setPaperMm(wMm, hMm){
      paperMm = { w: wMm, h: hMm };
      document.documentElement.style.setProperty('--paper-w-mm', String(wMm));
      document.documentElement.style.setProperty('--paper-h-mm', String(hMm));
      document.documentElement.style.setProperty('--paper-margin-mm', String(CFG.marginMm));

      const fw = (Math.round(wMm * 10) / 10).toString();
      const fh = (Math.round(hMm * 10) / 10).toString();
      els.pillSize.textContent = `Formato: ${fw}×${fh} mm`;
    }

    async function fileToArrayBuffer(file){
      return new Promise((resolve, reject)=>{
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
      });
    }

    async function loadPdfFromArrayBuffer(buf, name=''){
      setUiBusy(true);
      setStatus('Carico PDF…');
      setProgress(5);

      const loadingTask = pdfjsLib.getDocument({data: buf});
      currentPdf = await loadingTask.promise;
      currentPdfName = name || 'PDF';
      pageCount = currentPdf.numPages;

      // formato stampa/export fisso (mm)
      // NB: indipendente dal formato del PDF caricato
      setPaperMm(FIXED_PAPER_MM.w, FIXED_PAPER_MM.h);

      setProgress(0);
      setStatus(`PDF caricato: ${currentPdfName} · ${pageCount} pagine · render in corso…`);
    }

    function clearAll(){
      rendered.forEach(r => { try{ URL.revokeObjectURL(r.url); }catch(e){} });
      rendered = [];
      els.thumbGrid.innerHTML = '';
      els.printArea.innerHTML = '';
      setProgress(0);
      els.btnPrint.disabled = true;
      els.btnSavePdf.disabled = true;
    }

    // Trim (scan su copia ridotta per velocità)
    function trimCanvas(srcCanvas, sampleStep=4, pad=12){
      const W = srcCanvas.width, H = srcCanvas.height;
      const maxSide = 900;
      const s = Math.min(1, maxSide / Math.max(W, H));

      let scan = srcCanvas;
      let sw = W, sh = H;
      if(s < 1){
        scan = document.createElement('canvas');
        scan.width  = Math.max(1, Math.round(W * s));
        scan.height = Math.max(1, Math.round(H * s));
        const sctx = scan.getContext('2d', {alpha:false});
        sctx.fillStyle = '#fff';
        sctx.fillRect(0,0,scan.width, scan.height);
        sctx.imageSmoothingEnabled = true;
        sctx.imageSmoothingQuality = 'high';
        sctx.drawImage(srcCanvas, 0,0, W,H, 0,0, scan.width, scan.height);
        sw = scan.width; sh = scan.height;
      }

      const ctx = scan.getContext('2d', {willReadFrequently:true});
      const img = ctx.getImageData(0,0,sw,sh);
      const d = img.data;

      let minX=sw, minY=sh, maxX=0, maxY=0;
      let found = false;
      const step = Math.max(1, Math.round(sampleStep));

      for(let y=0; y<sh; y+=step){
        for(let x=0; x<sw; x+=step){
          const i = (y*sw + x)*4;
          const r=d[i], g=d[i+1], b=d[i+2], a=d[i+3];
          if(a === 0) continue;
          if(r > 250 && g > 250 && b > 250) continue;
          found = true;
          if(x<minX) minX=x;
          if(y<minY) minY=y;
          if(x>maxX) maxX=x;
          if(y>maxY) maxY=y;
        }
      }
      if(!found) return srcCanvas;

      const inv = (s < 1) ? (1 / s) : 1;
      let srcMinX = Math.max(0, Math.floor(minX*inv) - pad);
      let srcMinY = Math.max(0, Math.floor(minY*inv) - pad);
      let srcMaxX = Math.min(W-1, Math.ceil(maxX*inv) + pad);
      let srcMaxY = Math.min(H-1, Math.ceil(maxY*inv) + pad);

      const cw = Math.max(1, srcMaxX - srcMinX + 1);
      const ch = Math.max(1, srcMaxY - srcMinY + 1);

      const out = document.createElement('canvas');
      out.width = cw; out.height = ch;
      const octx = out.getContext('2d', {alpha:false});
      octx.fillStyle = '#fff';
      octx.fillRect(0,0,cw,ch);
      octx.drawImage(srcCanvas, srcMinX, srcMinY, cw, ch, 0, 0, cw, ch);
      return out;
    }

    function canvasToPngUrl(canvas){
      return new Promise((resolve, reject)=>{
        canvas.toBlob((blob)=>{
          if(!blob) return reject(new Error('toBlob failed'));
          resolve(URL.createObjectURL(blob));
        }, 'image/png');
      });
    }

    function blobUrlToDataUrl(url){
      return fetch(url).then(res=>res.blob()).then(blob=>{
        return new Promise((resolve, reject)=>{
          const r = new FileReader();
          r.onload = () => resolve(r.result);
          r.onerror = reject;
          r.readAsDataURL(blob);
        });
      });
    }

    function chooseOversample(px){
      if(px <= 2_000_000) return 2.0;
      if(px <= 6_000_000) return 1.6;
      if(px <= 12_000_000) return 1.35;
      return 1.15;
    }

    async function renderAllPagesMaxQuality(){
      if(!currentPdf) return;
      clearAll();
      setUiBusy(true);

      const pages = [...Array(pageCount)].map((_,i)=>i+1);
      setStatus(`Renderizzo ${pages.length} pagina/e… (max quality)`);
      setProgress(0);

      for(let idx=0; idx<pages.length; idx++){
        const pageNumber = pages[idx];
        const page = await currentPdf.getPage(pageNumber);
        const rotation = (page.rotate || 0);

        const vp1 = page.getViewport({scale: 1, rotation});

        // dimensione finale ESATTA (in pixel) del foglio 102×204 mm a CFG.dpi
        const targetW = Math.max(1, Math.round((paperMm.w / 25.4) * CFG.dpi));
        const targetH = Math.max(1, Math.round((paperMm.h / 25.4) * CFG.dpi));

        const basePx = targetW * targetH;
        let oversample = chooseOversample(basePx);
        const wantedPx = basePx * (oversample**2);
        if(wantedPx > CFG.maxRenderPixels){
          oversample = Math.max(1, Math.sqrt(CFG.maxRenderPixels / Math.max(1, basePx)));
        }

        const hiTargetW = Math.min(CFG.maxRenderDim, Math.max(1, Math.round(targetW * oversample)));
        const hiTargetH = Math.min(CFG.maxRenderDim, Math.max(1, Math.round(targetH * oversample)));

        // scale per arrivare alla canvas supersampled
        const scaleX = hiTargetW / vp1.width;
        const scaleY = hiTargetH / vp1.height;
        const scale = (scaleX + scaleY) / 2;
        const viewport = page.getViewport({scale, rotation});

        // raw render (supersampled)
        const raw = document.createElement('canvas');
        raw.width = Math.max(1, Math.ceil(viewport.width));
        raw.height = Math.max(1, Math.ceil(viewport.height));
        const rctx = raw.getContext('2d', {alpha:false});
        rctx.fillStyle = '#fff';
        rctx.fillRect(0,0,raw.width, raw.height);
        rctx.imageSmoothingEnabled = true;
        rctx.imageSmoothingQuality = 'high';

        await page.render({canvasContext: rctx, viewport, intent: 'print'}).promise;

        const trimmed = CFG.trim ? trimCanvas(raw, CFG.trimSampleStep, CFG.trimPad) : raw;

        // final canvas ESATTA (600dpi)
        const finalC = document.createElement('canvas');
        finalC.width = targetW;
        finalC.height = targetH;
        const fctx = finalC.getContext('2d', {alpha:false});
        fctx.fillStyle = '#fff';
        fctx.fillRect(0,0,targetW,targetH);
        fctx.imageSmoothingEnabled = true;
        fctx.imageSmoothingQuality = 'high';

        // Fit centrato nella pagina (senza tagli)
        const sw = trimmed.width, sh = trimmed.height;
        const sScale = Math.min(targetW/sw, targetH/sh);
        const dw = sw * sScale;
        const dh = sh * sScale;
        const dx = (targetW - dw) / 2;
        const dy = (targetH - dh) / 2;
        fctx.drawImage(trimmed, 0,0,sw,sh, dx,dy,dw,dh);

        const url = await canvasToPngUrl(finalC);
        rendered.push({pageNumber, url});

        // thumb
        const div = document.createElement('div');
        div.className = 'thumb';
        div.innerHTML = `<span class="badge">Pag. ${pageNumber}</span><img alt="Pagina ${pageNumber}" />`;
        div.querySelector('img').src = url;
        els.thumbGrid.appendChild(div);

        setProgress(((idx+1)/pages.length)*100);
        setStatus(`Renderizzata pagina ${pageNumber} (${idx+1}/${pages.length})`);
      }

      rebuildPrintArea();
      setProgress(0);
      setStatus(`Pronto: ${rendered.length} pagina/e · puoi stampare o salvare PDF.`);
      setUiBusy(false);
    }

    function rebuildPrintArea(){
      els.printArea.innerHTML = '';
      for(const r of rendered){
        const page = document.createElement('div');
        page.className = 'print-page';
        const img = document.createElement('img');
        img.src = r.url;
        img.alt = `Pagina ${r.pageNumber}`;
        page.appendChild(img);
        els.printArea.appendChild(page);
      }
      els.btnPrint.disabled = !rendered.length;
      els.btnSavePdf.disabled = !rendered.length;
    }

    async function exportRenderedToPdf(){
      if(!rendered.length){
        alert('Prima seleziona un PDF e attendi il render.');
        return;
      }

      const jspdfNS = window.jspdf;
      if(!jspdfNS || !jspdfNS.jsPDF){
        alert('jsPDF non caricato. Verifica connessione internet o che il CDN non sia bloccato.');
        return;
      }

      setUiBusy(true);
      setStatus('Creo PDF…');
      setProgress(0);

      const w = paperMm.w;
      const h = paperMm.h;
      const orientation = (w >= h) ? 'l' : 'p';

      const pdf = new jspdfNS.jsPDF({
        orientation,
        unit: 'mm',
        format: [w, h],
        compress: true,
      });

      const base = (currentPdfName || 'render').replace(/\.pdf$/i,'');
      try{
        pdf.setProperties({
          title: base,
          subject: 'Export termico',
          creator: 'Thermal PDF Print',
        });
      }catch(e){}

      for(let i=0; i<rendered.length; i++){
        const r = rendered[i];
        if(i>0) pdf.addPage([w, h], orientation);
        const dataUrl = await blobUrlToDataUrl(r.url);
        pdf.addImage(dataUrl, 'PNG', CFG.marginMm, CFG.marginMm, w - 2*CFG.marginMm, h - 2*CFG.marginMm, undefined, 'SLOW');
        setProgress(((i+1)/rendered.length)*100);
        setStatus(`Creo PDF… pagina ${i+1}/${rendered.length}`);
      }

      const safeBase = base.replace(/[^a-z0-9\-_]+/ig,'_').replace(/^_+|_+$/g,'') || 'render';
      const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
      const fname = `${safeBase}_${CFG.dpi}dpi_${stamp}.pdf`;

      pdf.save(fname);
      setProgress(0);
      setStatus('PDF salvato.');
      setUiBusy(false);
    }

    // Events
    els.btnPrint.addEventListener('click', ()=>{
      if(!rendered.length){
        alert('Prima seleziona un PDF e attendi il render.');
        return;
      }
      window.print();
    });

    els.btnSavePdf.addEventListener('click', ()=>{
      exportRenderedToPdf().catch(err=>{
        console.error(err);
        alert('Errore salvando PDF: ' + (err && err.message ? err.message : err));
        setStatus('Errore durante il salvataggio PDF.');
        setProgress(0);
        setUiBusy(false);
      });
    });

    els.fileInput.addEventListener('change', async ()=>{
      try{
        const f = els.fileInput.files && els.fileInput.files[0];
        if(!f) return;
        els.pillFile.textContent = f.name;

        clearAll();
        const buf = await fileToArrayBuffer(f);
        await loadPdfFromArrayBuffer(buf, f.name);
        await renderAllPagesMaxQuality();
      }catch(err){
        console.error(err);
        alert('Errore: ' + (err && err.message ? err.message : err));
        setStatus('Errore durante il render.');
        setProgress(0);
        setUiBusy(false);
      }
    });

    document.getElementById('btnBack').addEventListener('click', ()=>{
      if(history.length > 1){
        history.back();
      }else{
        window.location.href = './index.html';
      }
    });

    // init
    setPaperMm(FIXED_PAPER_MM.w, FIXED_PAPER_MM.h);
    setUiBusy(false);
  </script>
</body>
</html>
