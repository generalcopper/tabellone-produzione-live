    function fmtItDate(ts){
      try{
        if(!ts) return "—";
        const d = (ts?.toDate ? ts.toDate() : (ts instanceof Date ? ts : new Date(ts)));
        if(!(d instanceof Date) || Number.isNaN(d.getTime())) return "—";

    function computePagesFromDoc(d){
      try{
        const pc = Number(d?.pagesCount ?? d?.totalPages ?? 0);
        if(Number.isFinite(pc) && pc > 0) return Math.round(pc);
        const pi = Array.isArray(d?.pageIndices) ? d.pageIndices : [];
        const nums = pi.map(x=>Number(x)).filter(n=>Number.isFinite(n)).map(n=>Math.max(0, Math.round(n)));
        if(!nums.length) return 0;
        const max = Math.max(...nums);
        return max + 1;
      }catch(_e){
        return 0;
      }
    }

    function uploadKey(adminUid, sourceFileHash, sourceFileName, docId){
      const u = safeText(adminUid || "");
      const h = safeText(sourceFileHash || "");
      const f = safeText(sourceFileName || "");
      const fallback = safeText(docId || "");
      const k2 = h || f || fallback || "unknown";
      return `${u}__${k2}`;
    }

    function ingestKey(adminUid, sourceFileHash, sourceFileName, docId){
      // stessa logica per match tra upload (docs) e ingest logs
      const u = safeText(adminUid || "");
      const h = safeText(sourceFileHash || "");
      const f = safeText(sourceFileName || "");
      const fallback = safeText(docId || "");
      const k2 = h || f || fallback || "unknown";
      return `${u}__${k2}`;
    }

    function computeSentAny(details, status){
      try{
        if(Array.isArray(details)){
          for(const r of details){
            if(r && r.sent === true) return true;
          }
          return false;
        }
        // fallback soft: se non abbiamo dettagli e status è "ok", assumiamo inviato
        if(String(status||"").toLowerCase() === "ok") return true;
      }catch(_e){}
      return false;
    }

    function mergeUploadFromDoc(docSnap){
      const d = docSnap.data() || {};

// UID/email possono essere salvati in campi diversi o derivati dal path (es: collectionGroup)
let uidFromPath = "";
try{
  const p = String(docSnap?.ref?.path || "");
  if(p){
    const parts = p.split("/").filter(Boolean);

    // Caso tipico: payrollDocs/{uid}/payrolls/{docId}
    if(parts.length >= 4 && parts[0] === "payrollDocs" && parts[2] === "payrolls"){
      uidFromPath = parts[1] || "";
    }

    // Fallback: parent doc id della subcollection "payrolls"
    if(!uidFromPath){
      const idx = parts.lastIndexOf("payrolls");
      if(idx > 0) uidFromPath = parts[idx - 1] || "";
    }
  }
}catch(_e){ uidFromPath = ""; }

const createdAt = d.createdAt || d.updatedAt || docSnap?.createTime || docSnap?.updateTime || null;
const createdAtMs = tsToMs(createdAt);

const nestedOwnerUid = safeText((d.owner && (d.owner.uid || d.owner.userUid || d.owner.id)) || "");
const nestedUserUid  = safeText((d.user  && (d.user.uid  || d.user.userUid  || d.user.id )) || "");
const nestedAdminUid = safeText((d.admin && (d.admin.uid || d.admin.userUid || d.admin.id)) || "");

const ownerUid = safeText(
  d.ownerUid || d.userUid || d.uid || d.userId ||
  nestedOwnerUid || nestedUserUid || uidFromPath || ""
);

// emailLower (normalizzato) utile anche per risalire all'uid da payrollUsage/payrollDirectory
const emailLowerish = safeText(
  d.emailLower || d.adminEmail || d.adminMail || d.email || d.userEmail || d.ownerEmail ||
  (d.owner && (d.owner.emailLower || d.owner.email)) ||
  (d.user && (d.user.emailLower || d.user.email)) ||
  ""
).toLowerCase();

// Source file meta: alcuni doc usano campi diversi (sourceFileHash/fileHash/hash ecc.)
const sourceFileHash = safeText(
  d.sourceFileHash || d.fileHash || d.hash || d.pdfHash || d.sourceHash ||
  (d.file && (d.file.sourceFileHash || d.file.fileHash || d.file.hash)) ||
  ""
);

const sourceFileName = safeText(
  d.sourceFileName || d.fileName || d.originalFileName || d.filename || d.name ||
  (d.fileMeta && (d.fileMeta.name || d.fileMeta.fileName)) ||
  (d.meta && (d.meta.fileName || d.meta.name)) ||
  (d.file && (d.file.sourceFileName || d.file.fileName || d.file.originalFileName || d.file.filename || d.file.name)) ||
  ""
);

// Alcuni vecchi doc usavano "adminUid" come campo, ma in rules il campo canonico è ownerUid.
// Qui preferiamo ownerUid (vero proprietario) e usiamo adminUid solo come fallback.
const rawAdminUid = safeText(d.adminUid || nestedAdminUid || "");

// Se manca ownerUid/adminUid ma abbiamo emailLower, prova a risalire all'uid da payrollUsage/payrollDirectory
const derivedUid = (!ownerUid && !rawAdminUid && !uidFromPath && emailLowerish)
  ? safeText(state.uidByEmail?.get(emailLowerish) || "")
  : "";

const adminUid = ownerUid || derivedUid || rawAdminUid || uidFromPath || (emailLowerish ? ("email:" + emailLowerish) : "");

const adminEmail = safeText(
  d.adminEmail || d.adminMail || d.emailLower || d.email || d.userEmail || d.ownerEmail ||
  (d.owner && (d.owner.emailLower || d.owner.email)) ||
  (d.user && (d.user.emailLower || d.user.email)) ||
  ""
) || emailLowerish || "";
const totalPages = computePagesFromDoc(d);

      if(!adminUid) return; // senza UID non ha senso per audit

      const key = uploadKey(adminUid, sourceFileHash, sourceFileName, docSnap.id);
      const prev = state.uploadMap.get(key);

      if(!prev){
        state.uploadMap.set(key, {
          id: key,
          createdAt,
          createdAtMs,
          createdAtStr: fmtItDate(createdAt),
          adminUid,
          ownerUid,
          rawAdminUid,
          derivedUid,
          adminEmail,
          sourceFileName,
          sourceFileHash,
          totalPages,
          sentAny: false,
          status: "—"
        });
        return;
      }

      // aggiorna (mantieni la data più recente, i dati migliori)
      if(createdAtMs > (prev.createdAtMs || 0)){
        prev.createdAt = createdAt;
        prev.createdAtMs = createdAtMs;
        prev.createdAtStr = fmtItDate(createdAt);
      }
      if(!prev.adminEmail && adminEmail) prev.adminEmail = adminEmail;
      if(!prev.sourceFileName && sourceFileName) prev.sourceFileName = sourceFileName;
      if(!prev.sourceFileHash && sourceFileHash) prev.sourceFileHash = sourceFileHash;
      if(totalPages > (prev.totalPages || 0)) prev.totalPages = totalPages;

      state.uploadMap.set(key, prev);
    }

    
    function seedUploadsFromIngest(){
      // Fallback: se alcuni carichi esistono solo nei payrollIngestLogs (o non abbiamo trovato il doc upload),
      // creiamo comunque una riga in tabella per audit.
      try{
        let added = 0;
        for(const it of state.ingestIndex.values()){
          if(!it || !it.adminUid) continue;
          const key = safeText(it.key || ingestKey(it.adminUid, it.sourceFileHash, it.sourceFileName, ""));
          if(!key) continue;

          const prev = state.uploadMap.get(key);
          if(prev){
            // mantieni data più recente
            if((it.createdAtMs||0) > (prev.createdAtMs||0)){
              prev.createdAt = it.createdAt || prev.createdAt;
              prev.createdAtMs = it.createdAtMs || prev.createdAtMs;
              prev.createdAtStr = fmtItDate(prev.createdAt);
              state.uploadMap.set(key, prev);
            }
            continue;
          }

          state.uploadMap.set(key, {
            id: key,
            createdAt: it.createdAt || null,
            createdAtMs: it.createdAtMs || 0,
            createdAtStr: fmtItDate(it.createdAt || null),

            adminEmail: safeText(it.adminEmail || ""),
            sourceFileName: safeText(it.sourceFileName || ""),
            sourceFileHash: safeText(it.sourceFileHash || ""),
            totalPages: 0,
            sentAny: !!it.sentAny,
            status: safeText(it.status || "ok")
          });
          added++;
        }

        // mini log diagnostico (silenzioso se non serve)
        if(added > 0) console.info("seedUploadsFromIngest: aggiunte", added, "righe (da ingest logs)");
      }catch(_e){}
    }

    function applyIngestStatusToUploads(){
      try{
        for(const [k, up] of state.uploadMap.entries()){
          const ik = ingestKey(up.adminUid, up.sourceFileHash, up.sourceFileName, up.id);
          const ing = state.ingestIndex.get(ik);

            up.sentAny = false;

    function rebuildUploadsArray(){

    function updateMeta(){

      }

    function filteredLogs(){

      return state.logs.filter(item=>{

        if(!q) return true;
        const hay = [
          item.adminUid,
          item.adminEmail || "",
          item.sourceFileName || "",
          item.sourceFileHash || ""
        ].join(" ").toLowerCase();
        return hay.includes(q);
      });

    async function loadAuditCounts(){
      const env = state.env;
      if(!env) return;
      const { fsApi, db } = env;

      const LIMIT = 2000;
      const audit = {
        usageDocs: 0,
        usageOwners: 0,
        usagePremium: 0,
        directoryDocs: 0,
        directoryOwners: 0,
        usersDocs: 0,
        subscriptionsDocs: 0,
        invoicesDocs: 0,
        lastAuditAt: Date.now(),
        limited: false,

        usageList: [],

        probe: {
          usersProbed: 0,
          usersWithAny: 0,
          foundBySubcol: {},
          lastRunAt: 0
        }
      };

      async function scanCollection(name, limitN = LIMIT){
        try{
          const ref = fsApi.collection(db, name);
          const q = fsApi.query(ref, fsApi.limit(limitN));
          const snap = await fsApi.getDocs(q);
          const docs = snap?.docs || [];
          if(docs.length >= limitN) audit.limited = true;
          return docs;
        }catch(err){
          console.warn("audit failed:", name, err);
          return null;
        }
      }

      // payrollUsage (1 doc = 1 utente, di solito)
      const usage = await scanCollection(COL_USAGE, LIMIT);
      if(usage){
        audit.usageDocs = usage.length;
        const owners = new Set();
        let prem = 0;
        for(const s of usage){
if(s?.id) owners.add(String(s.id));
const d = s.data() || {};
const status = String(d.subscriptionStatus || d.status || d.plan || "").toLowerCase();
const premish =
  d.isPremium === true || d.premium === true ||
  status.includes("active") || status.includes("premium") || status.includes("pro");
if(premish) prem++;

const em = String(d.emailLower || d.email || "").trim().toLowerCase();
if(audit.usageList.length < 60){
  audit.usageList.push({ uid: String(s.id || ""), email: em, premium: premish, status });
}
        }
        audit.usageOwners = owners.size;
        audit.usagePremium = prem;

// Costruisci mappa emailLower -> uid (utile se i doc upload hanno solo emailLower e non ownerUid)
try{
  state.uidByEmail = new Map();
  for(const it of audit.usageList){
    const em = String(it?.email || "").trim().toLowerCase();
    const u = String(it?.uid || "").trim();
    if(em && u) state.uidByEmail.set(em, u);
  }
}catch(_e){}
      }

      // payrollDirectory (doc per utente/azienda, spesso)
      const dir = await scanCollection("payrollDirectory", LIMIT);
      if(dir){
        audit.directoryDocs = dir.length;
        const owners = new Set();
        for(const s of dir){
          const d = s.data() || {};
          const ou = String(d.ownerUid || "").trim();
          if(ou) owners.add(ou);
        }
        audit.directoryOwners = owners.size;

// Arricchisci la mappa emailLower -> uid anche da payrollDirectory (docId tipico: "<uid>__<emailLower>")
try{
  for(const s of dir){
    const id = String(s?.id || "").trim();
    if(id && id.includes("__")){
      const parts = id.split("__");
      const u = String(parts[0] || "").trim();
      const em = String(parts.slice(1).join("__") || "").trim().toLowerCase();
      if(u && em) state.uidByEmail.set(em, u);
    }
    const d = s.data() || {};
    const ou = String(d.ownerUid || "").trim();
    const e2 = String(d.emailLower || d.email || "").trim().toLowerCase();
    if(ou && e2) state.uidByEmail.set(e2, ou);
  }
}catch(_e){}
      }

      // altre collezioni utili per capire se ci sono altri utenti nel progetto
      const users = await scanCollection("users", LIMIT);
      if(users) audit.usersDocs = users.length;

      const subs = await scanCollection("subscriptions", LIMIT);
      if(subs) audit.subscriptionsDocs = subs.length;

      const inv = await scanCollection("invoices", LIMIT);
      if(inv) audit.invoicesDocs = inv.length;

      state.audit = audit;
    }

async function probePerUserUploads(){
  const env = state.env;
  if(!env) return;
  const { fsApi, db } = env;

  const au = state.audit || {};
  const list = Array.isArray(au.usageList) ? au.usageList : [];
  if(!list.length) return;

  const subcols = ["payrolls", "uploads", "docs", "files"]; // prova veloce (non invasiva)
  const foundBySubcol = {};
  const results = [];

  let probed = 0;
  let withAny = 0;

  for(const u of list){
    const uid = String(u?.uid || "").trim();
    if(!uid) continue;
    probed++;

    let found = "";
    for(const sc of subcols){
      try{
        const ref = fsApi.collection(db, "payrollDocs", uid, sc);
        const q = fsApi.query(ref, fsApi.limit(1));
        const snap = await fsApi.getDocs(q);
        const docs = snap?.docs || [];
        if(docs.length){
          found = sc;
          break;
        }
      }catch(_e){
        // ignore (permessi o path inesistente)
      }
    }

    if(found){
      withAny++;
      foundBySubcol[found] = (foundBySubcol[found] || 0) + 1;
    }

    results.push({
      uid,
      email: String(u?.email || "").trim().toLowerCase(),
      premium: !!u?.premium,
      foundSubcol: found || "—"
    });
  }

  au.probe = {
    usersProbed: probed,
    usersWithAny: withAny,
    foundBySubcol,
    lastRunAt: Date.now()
  };
  state.audit = au;

  // Log utile per capire "dove" stanno i carichi
  try{
    console.info("Probe per-user uploads (payrollDocs/{uid}/subcol):", results);
    console.table(results);
    console.info("Probe summary:", au.probe);
  }catch(_e){}
}


async function hydrateEmailsForUids(uids){
      const env = state.env;
      if(!env) return;
      const { fsApi, db } = env;
      const unique = Array.from(new Set(uids.filter(Boolean)))
        .filter(uid=>!String(uid||"").startsWith("email:") && !String(uid||"").includes("@"))
        .filter(uid=>!state.emailByUid.has(uid));

      if(!unique.length) return;

      const pool = 6;
      let i = 0;

      async function worker(){
        while(i < unique.length){
          const uid = unique[i++];
          try{
            const ref = fsApi.doc(db, COL_USAGE, uid);
            const snap = await fsApi.getDoc(ref);
            if(snap && snap.exists()){
              const d = snap.data() || {};
              const em = String(d.emailLower || d.email || "").trim().toLowerCase();
              if(em) state.emailByUid.set(uid, em);
            }
          }catch(_e){}
          if(!state.emailByUid.has(uid)) state.emailByUid.set(uid, "");
        }
      }

      const workers = [];
      for(let k=0;k<pool;k++) workers.push(worker());
      await Promise.all(workers);

      // aggiorna uploads
      try{
        for(const [k, up] of state.uploadMap.entries()){
          if(!up.adminEmail){
            const em = state.emailByUid.get(up.adminUid);
            if(em) up.adminEmail = em;
            state.uploadMap.set(k, up);
          }
        }
      }catch(_e){}

      rebuildUploadsArray();
      renderTable();
    }

    async function buildIngestIndex({ reset=false } = {}){
      const env = state.env;
      if(!env) return;
      const { fsApi, db } = env;

      if(reset){
        state.ingestIndex = new Map();
        state.ingestItems = [];
        state.ingestLastSnap = null;
        state.ingestLoaded = 0;
        state.ingestDone = false;
      }
      if(state.ingestDone) return;

      try{
        while(state.ingestLoaded < INGEST_MAX){
          const parts = [ fsApi.collection(db, COL_INGEST), fsApi.orderBy("createdAt","desc") ];
          if(state.ingestLastSnap) parts.push(fsApi.startAfter(state.ingestLastSnap));
          parts.push(fsApi.limit(INGEST_PAGE_SIZE));

          const q = fsApi.query(...parts);
          const snap = await fsApi.getDocs(q);
          const docs = snap?.docs || [];
          if(!docs.length){ state.ingestDone = true; break; }

          for(const docSnap of docs){
            const d = docSnap.data() || {};
            const adminUid = safeText(d.adminUid || d.ownerUid || d.uid || d.userUid || d.userId || "");
            if(!adminUid) continue;

            const sfh = safeText(d.sourceFileHash || d.fileHash || d.hash || "");
            const sfn = safeText(d.sourceFileName || d.fileName || d.originalFileName || d.filename || d.name || "");

            const adminEmail = safeText(d.adminEmail || d.adminMail || d.emailLower || d.email || d.userEmail || d.ownerEmail || "");
            const createdAt = d.createdAt || d.updatedAt || null;
            const createdAtMs = tsToMs(createdAt);

            const key = ingestKey(adminUid, sfh, sfn, docSnap.id);
            if(state.ingestIndex.has(key)) continue; // query è desc: primo è già il più recente

            const entry = {
              key,
              adminUid,
              adminEmail,
              sourceFileHash: sfh,
              sourceFileName: sfn,
              sentAny: computeSentAny(d.details, d.status),
              status: safeText(d.status || "ok"),
              createdAt,
              createdAtMs
            };

            state.ingestIndex.set(key, entry);
            state.ingestItems.push(entry);
}

          state.ingestLoaded += docs.length;
          state.ingestLastSnap = docs[docs.length - 1];
          if(docs.length < INGEST_PAGE_SIZE){ state.ingestDone = true; break; }
        }
      }catch(err){
        // Se non possiamo leggere ingest logs, non bloccare: semplicemente sentAny resterà "No"
        console.warn("buildIngestIndex", err);
        state.ingestDone = true;
      }
    }

    async function loadDocsBatch({ reset=false, exhaustSources=false } = {}){
      const env = state.env;
      if(!env) return;
      const { fsApi, db } = env;

      if(reset){
        state.docsColIdx = 0;       // indice sorgente corrente in DOC_SOURCES
        state.docsLastSnap = null;  // cursore della sorgente corrente
        state.docsHasMore = false;
        state.loadedDocs = 0;
        state.uploadMap = new Map();
        state.logs = [];
        state.loadedCount = 0;
        state.srcStats = { cg_payrolls: 0, col_payrollDocs: 0, col_payrolls: 0 };
      }

      async function runQueryForSource(src){
        const ref = (src.kind === "collectionGroup")
          ? fsApi.collectionGroup(db, src.name)
          : fsApi.collection(db, src.name);

        const parts = [ ref, fsApi.orderBy("createdAt","desc") ];
        if(state.docsLastSnap) parts.push(fsApi.startAfter(state.docsLastSnap));
        parts.push(fsApi.limit(DOC_PAGE_SIZE));
        const q = fsApi.query(...parts);
        return await fsApi.getDocs(q);
      }

      // Legge una "pagina" dalla sorgente corrente; se finita, passa automaticamente alla successiva
      while(true){
        const src = DOC_SOURCES[state.docsColIdx];
        if(!src){
          state.docsHasMore = false;
          return;
        }

        let snap = null;
        try{
          snap = await runQueryForSource(src);
        }catch(err){
          // Se una sorgente non è leggibile (permessi / index / non esiste), passa oltre senza bloccare la pagina
          console.warn("loadDocsBatch source failed:", src, err);
          state.docsColIdx++;
          state.docsLastSnap = null;
          continue;
        }

        const docs = snap?.docs || [];

        // Nessun documento (o sorgente vuota / esaurita): passa alla prossima sorgente
if(!docs.length){
  state.docsColIdx++;
  state.docsLastSnap = null;
  continue;
}

// stats per sorgente
try{
  if(state.srcStats){
    if(src.kind === "collectionGroup" && src.name === "payrolls") state.srcStats.cg_payrolls += docs.length;
    if(src.kind === "collection" && src.name === "payrollDocs") state.srcStats.col_payrollDocs += docs.length;
    if(src.kind === "collection" && src.name === "payrolls") state.srcStats.col_payrolls += docs.length;
  }
}catch(_e){}

docs.forEach(mergeUploadFromDoc);
        state.loadedDocs += docs.length;
        state.docsLastSnap = docs[docs.length - 1];

        // Se abbiamo letto un batch pieno, probabilmente c'è altro nella stessa sorgente
        if(docs.length >= DOC_PAGE_SIZE){
          state.docsHasMore = true;
          return;
        }

        // Batch non pieno: fine sorgente corrente. Se esistono altre sorgenti, passa alla successiva.
const hasNextSource = state.docsColIdx < (DOC_SOURCES.length - 1);
state.docsHasMore = hasNextSource;

if(hasNextSource){
  state.docsColIdx++;
  state.docsLastSnap = null;
  if(exhaustSources) continue; // in reset carichiamo automaticamente tutte le sorgenti
}
return;
      }
    }

    async function loadPage({ reset=false } = {}){
      const env = state.env;
      if(!env) return;

      setLoading(true);
      showNotice("", "");

      try{
        if(reset){
          state.emailByUid = new Map();
          await loadAuditCounts();
          await probePerUserUploads();
          await buildIngestIndex({ reset:true });
          await loadDocsBatch({ reset:true, exhaustSources:true });
        }else{
          await loadDocsBatch({ reset:false });
        }

        seedUploadsFromIngest();
        applyIngestStatusToUploads();
        rebuildUploadsArray();

        // email lookup (solo per uids presenti)
        const uids = state.logs.map(x=>x.adminUid).filter(Boolean);
        await hydrateEmailsForUids(uids);

        if(btnLoadMore) btnLoadMore.disabled = !state.docsHasMore;
        if(btnLoadMore) btnLoadMore.style.display = state.docsHasMore ? "" : "none";

        renderTable();
      }catch(err){
        console.warn("loadPage", err);
        showNotice("bad", "Errore nel caricamento dei carichi. Verifica permessi Firestore.");
        empTbody.innerHTML = `<tr class="empEmptyRow"><td colspan="5">Errore caricamento</td></tr>`;
      }finally{
        setLoading(false);
      }
    }

    function bindUi(){
      if(empSearch){
        empSearch.addEventListener("input", ()=>{
          state.search = empSearch.value || "";
          renderTable();
        }, { passive:true });
      }

      function setFilter(mode){
        state.filter = mode;
        setPressed(filterAll, mode === "all");
        setPressed(filterSent, mode === "sent");
        setPressed(filterNotSent, mode === "notSent");
        renderTable();
      }

      filterAll?.addEventListener("click", ()=> setFilter("all"));
      filterSent?.addEventListener("click", ()=> setFilter("sent"));
      filterNotSent?.addEventListener("click", ()=> setFilter("notSent"));

      btnRefresh?.addEventListener("click", ()=> loadPage({ reset:true }));
      btnLoadMore?.addEventListener("click", ()=> loadPage({ reset:false }));

      btnLogin?.addEventListener("click", async ()=>{
        try{
          const { auth, authApi } = state.env || {};
          if(!auth || !authApi) return;
          const provider = new authApi.GoogleAuthProvider();
          await authApi.signInWithRedirect(auth, provider);
        }catch(_e){
          showNotice("bad", "Accesso non disponibile su questo browser. Prova dalla Home.");
        }
      });
    }

    function renderAccessGate(message, showLogin){
      if(empTbody){
        empTbody.innerHTML = `<tr class="empEmptyRow"><td colspan="5">${htmlEscape(message)}</td></tr>`;
      }
      showNotice("", "");
      if(empPager) empPager.hidden = false;
      if(btnLoadMore) btnLoadMore.style.display = "none";
      if(btnLogin) btnLogin.hidden = !showLogin;
      if(btnLogin) btnLogin.disabled = false;
      updateMeta();
    }

    async function boot(){
      bindUi();
      state.env = await initFirebase();

      // Completa eventuale redirect result
      try{
        await state.env.authApi.getRedirectResult(state.env.auth);
      }catch(_e){}

      state.env.authApi.onAuthStateChanged(state.env.auth, async (user)=>{
        state.user = user || null;

        const allow = getSuperAdminAllowlist();
        const emailLower = String(user?.email || "").trim().toLowerCase();
        const isAuthed = !!(user && !user.isAnonymous);
        const isAllowed = isAuthed && allow.has(emailLower);

        if(!isAuthed){
          renderAccessGate("Accesso richiesto: accedi per vedere i carichi PDF.", true);
          return;
        }
        if(!isAllowed){
          renderAccessGate("Accesso negato: se ti serve questa sezione, usa l’account Super Admin.", false);
          return;
        }

        // OK
        showNotice("", "");
        if(btnLogin) btnLogin.hidden = true;
        if(empPager) empPager.hidden = false;

        await loadPage({ reset:true });
      });
    }

    boot().catch(()=>{
      showNotice("bad", "Errore inizializzazione. Ricarica la pagina.");
      renderAccessGate("Errore inizializzazione", false);
    });
  </script>
</body>
</html>
