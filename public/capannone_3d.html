<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>Capannone 3D — 27×16 m</title>
<style>
  :root{
    --bg:#070a0f; --panel:rgba(16,20,28,.72); --line:rgba(255,255,255,.08);
    --text:#eef2f8; --muted:#7e8a9c; --accent:#3b82f6; --accent2:#22d3ee; --ok:#22c55e; --warn:#f59e0b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);user-select:none;-webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0}
  canvas{display:block}
  /* vignette premium ai bordi */
  #app::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%)}
  .panel{position:fixed;top:12px;left:12px;z-index:10;max-width:calc(100vw - 24px);
    background:none;border:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;
    padding:0;pointer-events:none}
  .panel .info,.panel #cloudStatus{text-shadow:0 1px 4px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.6)}
  .seg{display:flex;gap:6px;margin-bottom:14px;background:rgba(255,255,255,.03);padding:4px;border-radius:14px;border:1px solid var(--line)}
  .seg button{flex:1;padding:9px 0;font-size:11.5px;font-weight:600;color:var(--muted);
    background:transparent;border:none;border-radius:10px;cursor:pointer;transition:.22s cubic-bezier(.4,0,.2,1)}
  .seg button.on{color:#fff;background:linear-gradient(135deg,var(--accent),#2563eb);
    box-shadow:0 3px 12px rgba(59,130,246,.4)}
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .chip{font-size:11px;font-weight:650;padding:6px 12px;border-radius:11px;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);transition:.2s}
  .chip:hover{background:rgba(255,255,255,.09);color:#fff}
  .chip.mounted{color:#cfe0ff}
  .chip.pending{opacity:.55;border-style:dashed}
  .chip.sel{color:#fff;background:linear-gradient(135deg,var(--accent),#2563eb);border-color:transparent;
    box-shadow:0 3px 12px rgba(59,130,246,.45)}
  .info{margin:0;font-size:12.5px;color:#cfe0ff;min-height:0;line-height:1.5;font-weight:550}
  .info b{color:#fff;font-weight:680}
  .collapse{position:absolute;top:18px;right:18px;width:28px;height:28px;border-radius:10px;
    border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);cursor:pointer;
    font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.2s}
  .collapse:hover{background:rgba(255,255,255,.1);color:#fff}
  .panel.min .body{display:none}
  .panel.min{width:auto;padding:14px 16px} .panel.min h1{margin:0;font-size:15px} .panel.min .sub{display:none}
  .hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;font-size:11px;
    color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:8px 17px;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);white-space:nowrap;
    box-shadow:0 8px 30px rgba(0,0,0,.4)}


  /* Rotellina impostazioni kiosk: minuscola, sempre disponibile */
  .kioskGear{position:fixed;top:8px;right:8px;z-index:30;width:22px;height:22px;border-radius:8px;
    border:1px solid rgba(255,255,255,.12);background:rgba(16,20,28,.46);color:rgba(238,242,248,.78);
    display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;cursor:pointer;
    backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
    box-shadow:0 8px 22px rgba(0,0,0,.38);opacity:.58;transition:opacity .16s,transform .12s,background .16s}
  .kioskGear:hover{opacity:1;background:rgba(16,20,28,.76)}
  .kioskGear:active{transform:scale(.94)}
  .kioskSettings{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:flex-end;padding:38px 10px 10px;}
  .kioskSettings.open{display:flex}
  .kioskBox{width:min(360px,calc(100vw - 20px));border-radius:18px;border:1px solid var(--line);background:rgba(16,20,28,.92);
    color:var(--text);box-shadow:0 24px 80px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);padding:16px}
  .kioskBoxHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .kioskBoxTitle{font-size:13px;font-weight:760;letter-spacing:.02em;text-transform:uppercase;color:#fff}
  .kioskClose{width:26px;height:26px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
  .kioskClose:active{transform:scale(.95)}
  .kioskLabel{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin:12px 0 6px}
  .kioskUidBox{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);border-radius:13px;padding:11px 12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;line-height:1.35;word-break:break-all;color:#dce9ff;user-select:text}
  .kioskPath{font-size:11px;line-height:1.45;color:var(--muted);word-break:break-all}
  .kioskActions{display:flex;gap:8px;margin-top:12px}
  .kioskMiniBtn{flex:1;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),#2563eb);color:#fff;font-size:12px;font-weight:700;padding:10px 12px;cursor:pointer}
  .kioskMiniBtn.secondary{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text)}
  .kioskMiniStatus{margin-top:10px;font-size:11px;line-height:1.4;color:var(--muted)}
  @media (max-width:480px){.kioskGear{top:6px;right:6px;width:21px;height:21px}.kioskSettings{padding-top:32px}.kioskBox{border-radius:16px}}

  @media (max-width:480px){.panel{top:12px;left:12px;width:calc(100vw - 24px)}.hint{display:none}}

</style>
</head>
<body>
<div id="app"></div>

<button class="kioskGear" id="kioskGear" type="button" title="Impostazioni kiosk" aria-label="Impostazioni kiosk">⚙︎</button>
<button class="kioskGear" id="voiceToggle" type="button" title="Voce on/off" aria-label="Voce on/off" style="right:36px">🔊</button>
<div class="kioskSettings" id="kioskSettings" aria-hidden="true">
  <div class="kioskBox" role="dialog" aria-modal="true" aria-labelledby="kioskSettingsTitle">
    <div class="kioskBoxHead">
      <div class="kioskBoxTitle" id="kioskSettingsTitle">Impostazioni kiosk</div>
      <button class="kioskClose" id="kioskClose" type="button" aria-label="Chiudi">×</button>
    </div>
    <div class="kioskLabel">UID dispositivo</div>
    <div class="kioskUidBox" id="kioskUidBox">In attesa di autenticazione…</div>
    <div class="kioskLabel">Documento da creare in Firestore</div>
    <div class="kioskPath" id="kioskPathBox">kiosks / —</div>
    <div class="kioskActions">
      <button class="kioskMiniBtn" id="kioskCopyUid" type="button">Copia UID</button>
      <button class="kioskMiniBtn secondary" id="kioskRefreshUid" type="button">Aggiorna</button>
    </div>
    <div class="kioskMiniStatus" id="kioskMiniStatus">Apri questa schermata sul kiosk Edge e copia l’UID per autorizzarlo.</div>
  </div>
</div>
<div class="panel" id="panel">
  <div class="body">
    <div class="info" id="info"></div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js" }}
</script>
<script type="module">
import * as THREE from 'three';

const LX=28.40, LZ=21.45, H_LOW=6.14, H_HIGH=7.30, VAULTS=9;
const GAP_TEC=1.76, CARTON_TH=0.12;
// soppalco in angolo: lato lungo (18m) addossato al muro di fondo (Z=-8),
// lato corto destro attaccato al muro corto (X=+13.5), profondo 6m verso il centro.
// lato corto sinistro a X=-4.5, con 1.76m di interspazio verso la parete cartongesso.
const SOP={x0:LX/2-18, x1:LX/2, z0:-LZ/2, z1:-LZ/2+6, hLow:2.93, hHigh:4.0};
const RACK_D=1.1, LEVEL_H=1.45, BAY=2.7;

const app=document.getElementById('app');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x070a0f);
scene.fog=new THREE.FogExp2(0x070a0f, 0.0085);
const renderer=new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
// la scena è quasi statica: le ombre non vanno ricalcolate ogni frame.
// Le aggiorno solo quando qualcosa cambia (vedi requestShadowUpdate()).
renderer.shadowMap.autoUpdate=false; renderer.shadowMap.needsUpdate=true;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
renderer.outputColorSpace=THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(45,1,0.1,500);

// richiede un singolo ricalcolo delle ombre nel prossimo frame
let _shadowFrames=0;
function requestShadowUpdate(n){ _shadowFrames=Math.max(_shadowFrames, n||2); }

// ===== ENVIRONMENT MAP procedurale (riflessi premium su metalli e pavimento) =====
(function(){
  const pmrem=new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  // scenetta-gradiente come sorgente di riflessi: cielo freddo in alto, pavimento scuro in basso
  const envScene=new THREE.Scene();
  const top=new THREE.Color(0x2a3a55), bot=new THREE.Color(0x05070b);
  const geo=new THREE.SphereGeometry(50,24,16);
  const mat=new THREE.ShaderMaterial({
    side:THREE.BackSide,
    uniforms:{c0:{value:top},c1:{value:bot}},
    vertexShader:`varying vec3 vP; void main(){vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec3 vP; uniform vec3 c0; uniform vec3 c1;
      void main(){ float h=clamp(vP.y*0.02+0.5,0.0,1.0); gl_FragColor=vec4(mix(c1,c0,h),1.0);} `
  });
  envScene.add(new THREE.Mesh(geo,mat));
  // qualche pannello luminoso per highlight metallici
  const lp=new THREE.Mesh(new THREE.PlaneGeometry(20,6),
    new THREE.MeshBasicMaterial({color:0x9fc4ff}));
  lp.position.set(0,18,-10); lp.lookAt(0,0,0); envScene.add(lp);
  const env=pmrem.fromScene(envScene,0.04).texture;
  scene.environment=env;
  geo.dispose(); mat.dispose(); pmrem.dispose();
})();

// ===== ILLUMINAZIONE PREMIUM =====
// ambient soft freddo + key dall'alto caldo + fill freddo + rim per stacco
const hemi=new THREE.HemisphereLight(0xcfe0ff,0x141821,0.55); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff4e6,2.1);
sun.position.set(16,34,18); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
const ss=32; Object.assign(sun.shadow.camera,{left:-ss,right:ss,top:ss,bottom:-ss,near:1,far:120});
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.03; sun.shadow.radius=3; scene.add(sun);
const fill=new THREE.DirectionalLight(0x5b78ff,0.55); fill.position.set(-22,16,-18); scene.add(fill);
const rim=new THREE.DirectionalLight(0x88e0ff,0.5); rim.position.set(-8,10,-26); scene.add(rim);
// faretti soffitto (ridotti a 2, senza ombre, per alleggerire)
for(const[lx,lz] of [[-8,0],[6,0]]){
  const sp=new THREE.PointLight(0xffe8cc,16,18,2.0);
  sp.position.set(lx,5.6,lz); sp.castShadow=false; scene.add(sp);
}

const M={
  floor:new THREE.MeshStandardMaterial({color:0x161b24,roughness:.22,metalness:.55,envMapIntensity:.9}),
  wall:new THREE.MeshStandardMaterial({color:0x252b36,roughness:.7,metalness:.1,transparent:true,opacity:.94,side:THREE.DoubleSide}),
  vault:new THREE.MeshStandardMaterial({color:0xeef2f8,roughness:.85,side:THREE.DoubleSide}),
  beam:new THREE.MeshStandardMaterial({color:0x3a414d,roughness:.5,metalness:.5}),
  up:new THREE.MeshStandardMaterial({color:0x1f5fe0,roughness:.4,metalness:.6}),
  diag:new THREE.MeshStandardMaterial({color:0xb6bcc4,roughness:.35,metalness:.7}),
  stairStep:new THREE.MeshStandardMaterial({color:0x868e9a,roughness:.45,metalness:.6,side:THREE.DoubleSide}),
  stairStr:new THREE.MeshStandardMaterial({color:0x444b55,roughness:.45,metalness:.65,side:THREE.DoubleSide}),
  load:new THREE.MeshStandardMaterial({color:0xf26a1e,roughness:.45,metalness:.4,emissive:0x3a1500,emissiveIntensity:.3}),
  shelf:new THREE.MeshStandardMaterial({color:0xc9d2de,roughness:.8}),
  box:new THREE.MeshStandardMaterial({color:0xc69a6a,roughness:.9}),
  pallet:new THREE.MeshStandardMaterial({color:0xc99a5b,roughness:.92}),
  palTop:new THREE.MeshStandardMaterial({color:0xcea46d,roughness:.85}),
  palBot:new THREE.MeshStandardMaterial({color:0xbb8d52,roughness:.9}),
  palBlock:new THREE.MeshStandardMaterial({color:0xa07843,roughness:.92}),
  lineFloor:new THREE.MeshStandardMaterial({color:0x1e5ad0,roughness:.5,metalness:.25,emissive:0x06183f,emissiveIntensity:.35}),
  lineConv:new THREE.MeshStandardMaterial({color:0x3a4048,roughness:.4,metalness:.65}),
  lineStr:new THREE.MeshStandardMaterial({color:0x6b7280,roughness:.4,metalness:.65}),
  lineMach:new THREE.MeshStandardMaterial({color:0xc4cbd4,roughness:.32,metalness:.6}),
  lineGlass:new THREE.MeshStandardMaterial({color:0x1a2a3a,roughness:.15,metalness:.5}),
  film:new THREE.MeshStandardMaterial({color:0xdde6ef,roughness:.25,metalness:.1,transparent:true,opacity:.4}),
  ibcCage:new THREE.MeshStandardMaterial({color:0x9aa3ad,roughness:.5,metalness:.6}),
  ibcTank:new THREE.MeshStandardMaterial({color:0xeef3f6,roughness:.2,transparent:true,opacity:.8}),
  sop:new THREE.MeshStandardMaterial({color:0x46506a,roughness:.8}),
  concrete:new THREE.MeshStandardMaterial({color:0x6f7378,roughness:.92,metalness:.05}),
  concreteDk:new THREE.MeshStandardMaterial({color:0x585c62,roughness:.9}),
  fork:new THREE.MeshStandardMaterial({color:0xf2c200,roughness:.5,metalness:.4}),
  forkDk:new THREE.MeshStandardMaterial({color:0x23262b,roughness:.6,metalness:.4}),
  carton:new THREE.MeshStandardMaterial({color:0xe6e3dc,roughness:.9,metalness:0,side:THREE.DoubleSide}),
  quadro:new THREE.MeshStandardMaterial({color:0x9a9079,roughness:.6,metalness:.3,side:THREE.DoubleSide}),
  glass:new THREE.MeshStandardMaterial({color:0xa8d4e8,roughness:.05,metalness:.2,transparent:true,opacity:.16,side:THREE.DoubleSide}),
  frame:new THREE.MeshStandardMaterial({color:0x3a4048,roughness:.5,metalness:.6}),
  officeFloor:new THREE.MeshStandardMaterial({color:0x5a6270,roughness:.85,side:THREE.DoubleSide}),
};

const fixed=new THREE.Group(); scene.add(fixed);
// gruppo specchiato (capannone specchiato): contiene soppalco, parete cartongesso, quadro.
// scale.x=-1 ribalta sinistra<->destra senza ricalcolare le coordinate.
const mirror=new THREE.Group(); mirror.scale.x=-1; scene.add(mirror);

// contorno a L del capannone: rettangolo 27x16 meno l'angolo della parete cartongesso (specchiato a destra-fondo)
const CARTON_W_=6.90;                 // larghezza setto cartongesso (per il taglio)
const GAP_=1.76;
const CUT_X=-(LX/2-18-GAP_), CUT_Z=-LZ/2+CARTON_W_;  // vertice interno angolo tagliato (mondo, specchiato)
function capShape(){
  const s=new THREE.Shape();
  s.moveTo(-LX/2,-LZ/2);
  s.lineTo(CUT_X,-LZ/2);
  s.lineTo(CUT_X,CUT_Z);
  s.lineTo(LX/2,CUT_Z);
  s.lineTo(LX/2,LZ/2);
  s.lineTo(-LX/2,LZ/2);
  s.closePath();
  return s;
}
const floor=new THREE.Mesh(new THREE.ShapeGeometry(capShape()),M.floor);
floor.rotation.x=Math.PI/2; floor.receiveShadow=true; fixed.add(floor);
M.floor.side=THREE.DoubleSide; M.vault.side=THREE.DoubleSide;
// pavimento interno premium: resina industriale scura, lucida
M.floor.color.setHex(0x161b24); M.floor.roughness=0.22; M.floor.metalness=0.55; M.floor.envMapIntensity=0.9;
// piano esterno (showroom): grande superficie scura riflettente sotto e attorno
const stage=new THREE.Mesh(new THREE.PlaneGeometry(140,140),
  new THREE.MeshStandardMaterial({color:0x0a0d12,roughness:.25,metalness:.6}));
stage.rotation.x=-Math.PI/2; stage.position.y=-0.02; stage.receiveShadow=true; scene.add(stage);
// griglia tecnica tenue sul piano esterno
const extGrid=new THREE.GridHelper(140,70,0x1b2735,0x121821);
extGrid.position.y=-0.01; extGrid.material.transparent=true; extGrid.material.opacity=.35; scene.add(extGrid);

const WALLS=[];
let wallsAuto=true, wallsHidden=false;
function wall(w,h,x,y,z,ry){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),M.wall.clone());
  m.position.set(x,y,z);m.rotation.y=ry;m.receiveShadow=true;m.userData.wall=true;
  WALLS.push(m);fixed.add(m);}
// muro di fondo: solo fino al taglio (da X=-13.5 a X=CUT_X)
wall(CUT_X-(-LX/2),H_HIGH,(CUT_X+(-LX/2))/2,H_HIGH/2,-LZ/2,0);
// muro di fronte: intero
wall(LX,H_HIGH,0,H_HIGH/2,LZ/2,Math.PI);
// muro sinistro: intero
wall(LZ,H_HIGH,-LX/2,H_HIGH/2,0,Math.PI/2);
// muro destro: solo sopra il taglio (da Z=CUT_Z a Z=+8)
wall(LZ/2-CUT_Z,H_HIGH,LX/2,H_HIGH/2,(CUT_Z+LZ/2)/2,-Math.PI/2);
// parete in cartongesso: perpendicolare al muro di fondo, di fronte al lato corto sinistro del soppalco.
// soppalco lato corto sx a X=-4.5; interspazio 1.76 → parete a X=-6.26. Larga 6.90 lungo Z, alta 7.30.
const CARTON_W=6.90, CARTON_H=7.30;
const cartonX=SOP.x0-GAP_TEC;        // -4.5 - 1.76 = -6.26
const cartonCz=-LZ/2+CARTON_W/2;     // parte dal muro di fondo, si estende verso il centro
const carton=new THREE.Mesh(new THREE.BoxGeometry(CARTON_TH,CARTON_H,CARTON_W),M.carton);
carton.position.set(cartonX,CARTON_H/2,cartonCz);
carton.castShadow=true; carton.receiveShadow=true; mirror.add(carton);
// ritorno ad angolo: dalla fine del cartongesso torna verso il muro corto sinistro (forma una L, chiude il vano)
const cartonEndZ=-LZ/2+CARTON_W;     // estremità libera del setto
const retW=cartonX-(-LX/2);          // lunghezza ritorno fino al muro corto sinistro
const cartonRet=new THREE.Mesh(new THREE.BoxGeometry(retW,CARTON_H,CARTON_TH),M.carton);
cartonRet.position.set((cartonX+(-LX/2))/2,CARTON_H/2,cartonEndZ);
cartonRet.castShadow=true; cartonRet.receiveShadow=true; mirror.add(cartonRet);
// quadro elettrico nell'interspazio tecnico tra parete cartongesso e lato corto del soppalco
const quadro=new THREE.Mesh(new THREE.BoxGeometry(0.25,1.2,0.8),M.quadro);
quadro.position.set(cartonX+0.9,1.3,-LZ/2+1.0); mirror.add(quadro);

const roof=new THREE.Group(); fixed.add(roof);
roof.visible=false;   // tetto nascosto: in vista 2D/pianta creerebbe confusione
// soffitto piano semplice (interno: il tetto non interessa)
const ceil=new THREE.Mesh(new THREE.ShapeGeometry(capShape()),M.vault);
ceil.rotation.x=Math.PI/2; ceil.position.y=H_HIGH; ceil.receiveShadow=true; roof.add(ceil);
for(const lx of [-8,-2,4,10]){
  const lamp=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1.5,10),
    new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xddeeff,emissiveIntensity:.6}));
  lamp.rotation.z=Math.PI/2; lamp.position.set(lx,5.4,2); roof.add(lamp);
}

(function(){
  const g=new THREE.Group();
  const w=SOP.x1-SOP.x0,d=SOP.z1-SOP.z0,cx=(SOP.x0+SOP.x1)/2,cz=(SOP.z0+SOP.z1)/2;
  // blocco di cemento pieno: muro chiuso da terra al piano del soppalco
  // (lo tengo leggermente più basso per non risultare complanare col solaio in testa → niente z-fighting)
  const block=new THREE.Mesh(new THREE.BoxGeometry(w,SOP.hLow-0.12,d),M.concrete);
  block.position.set(cx,(SOP.hLow-0.12)/2,cz);
  block.castShadow=true; block.receiveShadow=true; g.add(block);
  // spessore solaio in testa: poggia sopra il blocco, faccia superiore = piano del soppalco
  const slab=new THREE.Mesh(new THREE.BoxGeometry(w+0.12,0.24,d+0.12),M.concreteDk);
  slab.position.set(cx,SOP.hLow-0.12,cz);
  slab.castShadow=true; slab.receiveShadow=true; g.add(slab);
  mirror.add(g);
})();

// UFFICIO VETRATO sopra il soppalco, nell'angolo attaccato ai 2 muri (muro corto x1 + muro fondo z0).
// 7,81 lungo il muro di fondo (X), 4,70 lungo il muro corto (Z), altezza controsoffitto 2,70.
(function(){
  const OFF_W=7.81, OFF_D=4.70, OFF_H=2.70;
  const floorY=SOP.hLow;                        // poggia sul piano del soppalco
  // angolo ai 2 muri: x1=LX/2 (muro corto), z0=-LZ/2 (muro fondo)
  const x1=SOP.x1, x0=x1-OFF_W;                 // si sviluppa verso sinistra dal muro corto
  const z0=SOP.z0, z1=z0+OFF_D;                 // si sviluppa verso il centro dal muro fondo
  const cx=(x0+x1)/2, cz=(z0+z1)/2;
  const g=new THREE.Group();
  // pavimento ufficio (leggero)
  const fl=new THREE.Mesh(new THREE.BoxGeometry(OFF_W,0.06,OFF_D),M.officeFloor);
  fl.position.set(cx,floorY+0.03,cz); fl.receiveShadow=true; g.add(fl);
  // controsoffitto
  const ce=new THREE.Mesh(new THREE.BoxGeometry(OFF_W,0.06,OFF_D),M.officeFloor);
  ce.position.set(cx,floorY+OFF_H,cz); g.add(ce);
  // vetrate: solo i 2 lati liberi (verso il capannone), gli altri 2 sono i muri perimetrali
  // lato lungo verso il centro (z1), lato corto verso l'interspazio (x0)
  function glass(w,h,x,y,z,ry){
    const gl=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.04),M.glass);
    gl.position.set(x,y,z); gl.rotation.y=ry; g.add(gl);
  }
  glass(OFF_W,OFF_H,cx,floorY+OFF_H/2,z1,0);          // vetrata lunga (fronte verso centro)
  glass(OFF_D,OFF_H,x0,floorY+OFF_H/2,cz,Math.PI/2);  // vetrata corta (lato verso interspazio)
  // telai montanti agli angoli + porta accennata
  const fr=M.frame;
  function post(x,z){const p=new THREE.Mesh(new THREE.BoxGeometry(0.08,OFF_H,0.08),fr);
    p.position.set(x,floorY+OFF_H/2,z); g.add(p);}
  post(x0,z0); post(x1,z0); post(x0,z1); post(x1,z1);
  // traverso superiore sui lati vetrati
  const t1=new THREE.Mesh(new THREE.BoxGeometry(OFF_W,0.08,0.08),fr);
  t1.position.set(cx,floorY+OFF_H-0.04,z1); g.add(t1);
  const t2=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.08,OFF_D),fr);
  t2.position.set(x0,floorY+OFF_H-0.04,cz); g.add(t2);
  g.traverse(o=>{if(o.isMesh&&o.material!==M.glass)o.castShadow=true;});
  mirror.add(g);
})();

/* SCALA per il soppalco: addossata al lato lungo del soppalco (bordo verso il centro, Z=SOP.z1).
   Sporge verso il centro: piede a terra verso il centro (Z=z1+RUN), cima sul bordo soppalco (Z=z1).
   Larga 1m, sviluppo 6m, sale fino a quota soppalco (2.93). Posizionata verso l'angolo del muro corto. */
const STAIR_X1=LX/2-0.05;                          // bordo scala attaccato al muro perimetrale corto
const STAIR_W=1.0;
const STAIR_X0=STAIR_X1-STAIR_W;                   // bordo sinistro scala (riferimento per B)
(function(){
  const RUN=6.0, WIDTH=STAIR_W, TOP=SOP.hLow;
  const cx=(STAIR_X0+STAIR_X1)/2;
  const zTop=SOP.z1;                                // arrivo sul bordo soppalco
  const zFoot=SOP.z1+RUN;                           // piede verso il centro
  const g=new THREE.Group();
  const nSteps=15, stepRun=RUN/nSteps, stepRise=TOP/nSteps;
  for(let i=0;i<nSteps;i++){
    const z=zFoot - i*stepRun;                      // procede verso il soppalco
    const y=(i+1)*stepRise;
    const tread=new THREE.Mesh(new THREE.BoxGeometry(WIDTH,0.05,stepRun*1.05),M.stairStep);
    tread.position.set(cx,y,z-stepRun/2); tread.castShadow=true; tread.receiveShadow=true; g.add(tread);
    const riser=new THREE.Mesh(new THREE.BoxGeometry(WIDTH,stepRise,0.04),M.stairStr);
    riser.position.set(cx,y-stepRise/2,z); g.add(riser);
  }
  // cosciali e corrimano: orientati esattamente lungo la rampa da (zFoot,0) a (zTop,TOP)
  const dz=zTop-zFoot, dy=TOP-0;
  const slopeLen=Math.hypot(dz,dy);
  const rampRX=Math.atan2(-dy,dz);                // rotation.x che allinea il box alla rampa
  const midZ=(zFoot+zTop)/2, midY=TOP/2;
  function rampBar(xpos,yOff,sec){
    const bar=new THREE.Mesh(new THREE.BoxGeometry(sec,sec,slopeLen),M.stairStr);
    bar.position.set(xpos,midY+yOff,midZ);
    bar.rotation.x=rampRX;
    bar.castShadow=true; g.add(bar);
  }
  // cosciali laterali (a filo gradini) su entrambi i lati
  rampBar(cx-WIDTH/2+0.04,0,0.10);
  rampBar(cx+WIDTH/2-0.04,0,0.10);
  // corrimano + montanti SOLO sul lato verso il centro (l'altro lato è contro il muro)
  {
    const railX=cx-WIDTH/2+0.04;
    rampBar(railX,1.0,0.05);                       // corrimano (1m sopra i gradini)
    const post=(z,y)=>{const p=new THREE.Mesh(new THREE.BoxGeometry(0.05,1.0,0.05),M.stairStr);
      p.position.set(railX,y+0.5,z); p.castShadow=true; g.add(p);};
    post(zFoot,0.10); post(midZ,midY); post(zTop,TOP-0.10);
  }
  mirror.add(g);
})();

const racksGroup=new THREE.Group(); scene.add(racksGroup);
const VANI=[];

const RACK_DEPTH=1.10, RACK_TOTH=5.50, LEVELS=3;
const W3=2.70, W2=1.80;
const PAL_L=1.20, PAL_W=0.80, PAL_H=0.144;
// quote piano di appoggio per livello: L1 a terra, L2/L3 sui correnti
const LEVEL_Y=[0.0, 2.00, 4.00];
// altezza utile entro cui la merce di un vano deve stare (gap livelli - pallet - margine):
// gap 2.00 m, pallet ~0.144 m, margine 0.12 m → ~1.74 m. Il bancale non strabordа mai oltre.
const VANO_GAP=2.00, VANO_MAXH=VANO_GAP-0.144-0.12;

/* CONTENUTI iniziali: vuoto. I bancali vengono popolati in tempo reale dal cloud
   (picking.html → Firestore). Bancale EPAL 80x120, ogni fila = 10 scatole, max 5 file. */
const CONTENUTI = {};

const M_BOX = new THREE.MeshStandardMaterial({color:0xc49a6c, roughness:.85});
const M_BOXEDGE = new THREE.MeshStandardMaterial({color:0x9a7444, roughness:.9});

// materiali flaconi agricoli (HDPE) — condivisi
const M_FLACONE = new THREE.MeshStandardMaterial({color:0xf3f5f2, roughness:.45, metalness:.02});
const M_LIQUIDO = new THREE.MeshStandardMaterial({color:0x7fc6e0, roughness:.25});
const M_TAPPO   = new THREE.MeshStandardMaterial({color:0x1f6f3a, roughness:.5, metalness:.15});  // tappo verde agricolo
const M_SPRAY   = new THREE.MeshStandardMaterial({color:0x2b3036, roughness:.45, metalness:.3});
const M_ETICHETTA = new THREE.MeshStandardMaterial({color:0xeae07a, roughness:.6, side:THREE.DoubleSide}); // fascia etichetta

/* Costruisce un FLACONE AGRICOLO (HDPE) alto H, raggio R:
   corpo cilindrico tozzo con spalla netta, collo corto e largo, tappo grosso a vite,
   etichetta sul corpo. tipo 'spray' aggiunge il gruppo erogatore a grilletto. */
function buildFlacone(R,H,tipo){
  const f=new THREE.Group();
  // corpo principale alto e dritto (flacone industriale)
  const bodyH=H*0.66;
  const body=new THREE.Mesh(new THREE.CylinderGeometry(R*0.98,R,bodyH,16),M_FLACONE);
  body.position.y=bodyH/2; f.add(body);
  // spalla netta (tronco di cono breve verso il collo)
  const shH=H*0.10;
  const shoulder=new THREE.Mesh(new THREE.CylinderGeometry(R*0.5,R*0.98,shH,16),M_FLACONE);
  shoulder.position.y=bodyH+shH/2; f.add(shoulder);
  // collo corto e largo
  const neckH=H*0.06;
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(R*0.48,R*0.5,neckH,14),M_FLACONE);
  neck.position.y=bodyH+shH+neckH/2; f.add(neck);
  const topY=bodyH+shH+neckH;
  // etichetta sul corpo (fascia chiara, look prodotto agricolo)
  const lab=new THREE.Mesh(new THREE.CylinderGeometry(R*1.0,R*1.01,bodyH*0.5,16,1,true),M_ETICHETTA);
  lab.position.y=bodyH*0.42; f.add(lab);
  if(tipo==='spray'){
    // tappo base + gruppo spruzzino a grilletto
    const collar=new THREE.Mesh(new THREE.CylinderGeometry(R*0.52,R*0.52,H*0.05,14),M_SPRAY);
    collar.position.y=topY+H*0.025; f.add(collar);
    const head=new THREE.Mesh(new THREE.BoxGeometry(R*1.4,H*0.12,R*1.2),M_SPRAY);
    head.position.set(-R*0.25,topY+H*0.10,0); f.add(head);
    const noz=new THREE.Mesh(new THREE.CylinderGeometry(R*0.16,R*0.2,R*1.0,8),M_SPRAY);
    noz.rotation.z=Math.PI/2; noz.position.set(-R*1.0,topY+H*0.11,0); f.add(noz);
    const trig=new THREE.Mesh(new THREE.BoxGeometry(R*0.28,H*0.14,R*0.45),M_SPRAY);
    trig.position.set(-R*0.7,topY+H*0.02,0); trig.rotation.z=0.5; f.add(trig);
  } else {
    // tappo a vite grosso (largo e basso, tipico dei flaconi agricoli)
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(R*0.6,R*0.6,H*0.12,16),M_TAPPO);
    cap.position.y=topY+H*0.06; f.add(cap);
    // scanalatura superiore del tappo
    const capTop=new THREE.Mesh(new THREE.CylinderGeometry(R*0.5,R*0.55,H*0.03,16),M_TAPPO);
    capTop.position.y=topY+H*0.125; f.add(capTop);
  }
  return f;
}

/* Costruisce un bancale EPAL con NUMERO ESATTO di scatole, ADATTANDO la disposizione
   in modo che la pila NON superi l'altezza disponibile del vano (`maxH`).
   - scatolePiene / aperta / fillFrac: come prima.
   - restoPz: numero di flaconi nella scatola aperta (mostrati uno per uno).
   - pzPerScatola: capienza scatola (per disporre la griglia dei flaconi).
   - tipoTappo: 'spray' (spruzzino) | 'tappo' (tappo semplice).
   - maxH: altezza utile sopra il pallet entro cui la merce deve stare. */
function buildBancale({scatolePiene=0, aperta=0, fillFrac=0, restoPz=0, pzPerScatola=12, tipoTappo='tappo', maxH=1.75}){
  const g=new THREE.Group();
  // ===== BANCALE EPAL realistico (1200 x 800 x 144 mm) =====
  const PW=0.80, PL=1.20;
  const deckT=0.022;
  const blockH=0.10;
  const topY=blockH+deckT;
  const woodTop=M.palTop, woodBot=M.palBot, woodBlk=M.palBlock;

  // --- piano INFERIORE: 3 tavole longitudinali (lungo Z) ---
  for(const px of [-PW/2+0.05, 0, PW/2-0.05]){
    const t=new THREE.Mesh(new THREE.BoxGeometry(0.10,deckT,PL),woodBot);
    t.position.set(px,deckT/2,0); t.castShadow=true; g.add(t);
  }
  // --- 9 BLOCCHETTI (griglia 3x3) ---
  const bxs=[-PW/2+0.07, 0, PW/2-0.07];
  const bzs=[-PL/2+0.07, 0, PL/2-0.07];
  for(const bx of bxs) for(const bz of bzs){
    const blk=new THREE.Mesh(new THREE.BoxGeometry(0.12,blockH,0.12),woodBlk);
    blk.position.set(bx,deckT+blockH/2,bz); blk.castShadow=true; g.add(blk);
  }
  // --- piano SUPERIORE ---
  for(let i=0;i<5;i++){
    const z=-PL/2+0.06 + i*((PL-0.12)/4);
    const t=new THREE.Mesh(new THREE.BoxGeometry(PW,deckT,0.11),woodTop);
    t.position.set(0,topY+deckT/2,z); t.castShadow=true; g.add(t);
  }
  for(const px of [-PW/2+0.05, PW/2-0.05]){
    const t=new THREE.Mesh(new THREE.BoxGeometry(0.10,deckT,PL),woodTop);
    t.position.set(px,topY+deckT/2,0); g.add(t);
  }
  const palTopY=topY+deckT;

  // ===== DISPOSIZIONE ADATTIVA DELLE SCATOLE =====
  const total = scatolePiene + (aperta>0?1:0);
  // configurazioni griglia candidate (nx lungo larghezza 0.80, nz lungo lunghezza 1.20)
  const GRIDS=[[2,5],[2,6],[3,5],[3,6],[3,7],[4,6],[4,7],[4,8],[5,8],[6,9],[7,10],[8,12]];
  const BOX_H_STD=0.30, BOX_H_MIN=0.11;       // altezza scatola: ideale e minima accettabile
  let nx=2, nz=5, boxH=BOX_H_STD, layers=1;
  for(const [gx,gz] of GRIDS){
    const perFila=gx*gz;
    const L=Math.max(1, Math.ceil(total/perFila));
    // altezza scatola necessaria per far stare L strati entro maxH
    const hFit=Math.min(BOX_H_STD, maxH/L);
    if(hFit>=BOX_H_MIN || L<=1){
      nx=gx; nz=gz; boxH=hFit; layers=L;
      if(hFit>=BOX_H_MIN) break;   // configurazione valida trovata
    }
  }
  // se nemmeno la griglia più fitta basta, comprimo l'altezza al limite (resta dentro il vano)
  if(layers*boxH>maxH) boxH=maxH/layers;

  const perFila=nx*nz;
  const boxW=PW/nx*0.94, boxL=PL/nz*0.94;
  const slotPos=(idx)=>{
    const ix=idx % nx, iz=Math.floor(idx / nx);
    return [ -PW/2 + (ix+0.5)*(PW/nx), -PL/2 + (iz+0.5)*(PL/nz) ];
  };

  // disegna le scatole CHIUSE una per una, riempiendo strato per strato
  for(let n=0; n<scatolePiene; n++){
    const layer=Math.floor(n / perFila);
    const within=n % perFila;
    const [x,z]=slotPos(within);
    const y=palTopY + layer*boxH + boxH/2;
    const box=new THREE.Mesh(new THREE.BoxGeometry(boxW,boxH*0.96,boxL),M_BOX);
    box.position.set(x,y,z); box.castShadow=true; g.add(box);
  }

  // SCATOLA APERTA (parziale): subito dopo l'ultima piena, stesso schema di riempimento
  if(aperta>0){
    const n=scatolePiene;                 // indice posizionale della scatola aperta
    const layer=Math.floor(n / perFila);
    const within=n % perFila;
    const [x,z]=slotPos(within);
    const baseY=palTopY + layer*boxH;
    const wall=0.014;                      // spessore pareti cartone
    const open=new THREE.Group();
    open.position.set(x,baseY,z);
    const cartoneMat=M_BOXEDGE;
    const h=boxH*0.96;                     // altezza nominale della scatola
    const wallH=h*0.55;                    // PARETI PIÙ BASSE: i flaconi sporgono e si vedono
    // fondo
    const fondo=new THREE.Mesh(new THREE.BoxGeometry(boxW,wall,boxL),cartoneMat);
    fondo.position.y=wall/2; open.add(fondo);
    // 4 pareti basse (scatola aperta da cui spuntano i flaconi)
    const pN=new THREE.Mesh(new THREE.BoxGeometry(boxW,wallH,wall),cartoneMat); pN.position.set(0,wallH/2,boxL/2-wall/2); open.add(pN);
    const pS=new THREE.Mesh(new THREE.BoxGeometry(boxW,wallH,wall),cartoneMat); pS.position.set(0,wallH/2,-boxL/2+wall/2); open.add(pS);
    const pE=new THREE.Mesh(new THREE.BoxGeometry(wall,wallH,boxL),cartoneMat); pE.position.set(boxW/2-wall/2,wallH/2,0); open.add(pE);
    const pW=new THREE.Mesh(new THREE.BoxGeometry(wall,wallH,boxL),cartoneMat); pW.position.set(-boxW/2+wall/2,wallH/2,0); open.add(pW);
    // ===== FLACONI REALI dentro la scatola aperta (numero = pezzi residui) =====
    // disposti nella stessa griglia con cui sono confezionati nella scatola intera,
    // alti quanto una scatola: sporgono sopra le pareti basse, ben visibili.
    const nShow=Math.max(0, Math.min(restoPz||0, pzPerScatola||restoPz||1));
    if(nShow>0){
      const cap=pzPerScatola||nShow;
      let cols=Math.max(1,Math.ceil(Math.sqrt(cap*(boxW/boxL))));
      let rows=Math.ceil(cap/cols);
      const innerW=boxW-3*wall, innerL=boxL-3*wall;
      const cellW=innerW/cols, cellL=innerL/rows;
      const R=Math.min(cellW,cellL)*0.40;
      const flH=Math.max(h*1.15, R*7);     // flaconi alti: sporgono dalla scatola
      for(let i=0;i<nShow;i++){
        const c=i%cols, r=Math.floor(i/cols);
        const fx=-innerW/2 + (c+0.5)*cellW;
        const fz=-innerL/2 + (r+0.5)*cellL;
        const fl=buildFlacone(R, flH, tipoTappo);
        fl.position.set(fx, wall, fz);
        fl.traverse(o=>{if(o.isMesh)o.castShadow=true;});
        open.add(fl);
      }
    }
    // 4 flap aperti verso l'esterno (alette ben visibili)
    const flapMat=cartoneMat;
    const flZ=boxL*0.40, flX=boxW*0.40;
    const mkFlap=(w,d,px,pz,rx,rz)=>{
      const f=new THREE.Mesh(new THREE.BoxGeometry(w,wall,d),flapMat);
      f.position.set(px,wallH,pz); if(rx)f.rotation.x=rx; if(rz)f.rotation.z=rz; open.add(f);
    };
    mkFlap(boxW,flZ, 0, boxL/2-wall, -1.2, 0);     // flap fronte ribaltato fuori
    mkFlap(boxW,flZ, 0,-boxL/2+wall,  1.2, 0);     // flap retro
    open.traverse(o=>{if(o.isMesh)o.castShadow=true;});
    g.add(open);
  }
  return g;
}

function buildRack({id,x,z,bays,faceDir,empty,alongX,codeBays}){
  const g=new THREE.Group(); g.position.set(x,0,z);
  if(alongX) g.rotation.y=Math.PI/2;             // campate lungo X invece che lungo Z
  const len=bays.reduce((s,b)=>s+b.w,0);
  const upH=RACK_TOTH+0.2, upGeo=new THREE.BoxGeometry(0.12,upH,0.12);
  let edges=[-len/2]; for(const b of bays) edges.push(edges[edges.length-1]+b.w);
  for(const lz of edges) for(const dx of [-RACK_DEPTH/2,RACK_DEPTH/2]){
    const u=new THREE.Mesh(upGeo,M.up); u.position.set(dx,upH/2,lz); u.castShadow=true; g.add(u);
  }
  // crociere diagonali (zig-zag) su ogni telaio: collegano i 2 montanti lungo la profondità
  const diagN=6;                              // numero di segmenti zig-zag
  const segH=RACK_TOTH/diagN;
  for(const lz of edges){
    for(let s=0;s<diagN;s++){
      const y0=s*segH, y1=(s+1)*segH;
      const x0=(s%2===0)?-RACK_DEPTH/2:RACK_DEPTH/2;
      const x1=(s%2===0)?RACK_DEPTH/2:-RACK_DEPTH/2;
      const len2=Math.hypot(x1-x0,y1-y0);
      const diag=new THREE.Mesh(new THREE.BoxGeometry(0.045,len2,0.045),M.diag);
      diag.position.set((x0+x1)/2,(y0+y1)/2,lz);
      diag.rotation.z=Math.atan2(x1-x0,y1-y0)*-1;
      diag.castShadow=true; g.add(diag);
    }
    // traversi orizzontali del telaio (sopra e sotto)
    for(const yy of [0.15, RACK_TOTH-0.1]){
      const h=new THREE.Mesh(new THREE.BoxGeometry(RACK_DEPTH,0.05,0.05),M.diag);
      h.position.set(0,yy,lz); g.add(h);
    }
  }
  for(let lv=1;lv<=LEVELS;lv++){
    const baseY=LEVEL_Y[lv-1];          // quota appoggio pallet
    const onBeam=lv>1;                    // L1 a terra: niente corrente sotto
    bays.forEach((b,bi)=>{
      const z0=edges[bi], cz=z0+b.w/2;
      if(onBeam){
        const beamGeo=new THREE.BoxGeometry(0.07,0.12,b.w);
        for(const dx of [-RACK_DEPTH/2,RACK_DEPTH/2]){
          const bm=new THREE.Mesh(beamGeo,M.load); bm.position.set(dx,baseY,cz); bm.castShadow=true; g.add(bm);
        }
      }
      const deckY=onBeam?baseY+0.07:0;    // su quale quota poggia il pallet
      const slot=b.w/b.pal;
      for(let p=1;p<=b.pal;p++){
        const pz=z0+slot*(p-1)+slot/2;
        const bayNum = codeBays ? codeBays[bi] : (bi+1);
        const code=`${id}${String(bayNum).padStart(2,'0')}-L${lv}-P${p}`;
        const grp=new THREE.Group();
        const cont=CONTENUTI[code];
        if(cont){
          // bancale dettagliato con file di scatole. EPAL: lato 120 lungo profondità scaffale (X), 80 lungo campata (Z)
          const bancale=buildBancale({scatolePiene:cont.scatolePiene||cont.file*10||0, aperta:cont.aperta||0, fillFrac:cont.fillFrac||0, maxH:VANO_MAXH});
          bancale.rotation.y=Math.PI/2;   // ruota: 120 lungo X (profondità), 80 lungo Z (campata)
          grp.add(bancale);
          grp.userData.cont=cont;
        } else if(!empty){
          const base=new THREE.Mesh(new THREE.BoxGeometry(PAL_L,PAL_H,PAL_W),M.pallet);
          base.position.y=PAL_H/2; base.castShadow=true; grp.add(base);
          const bh=0.95+(((bi*7+lv*3+p)%5)*0.08);
          const cargo=new THREE.Mesh(new THREE.BoxGeometry(PAL_L*0.92,bh,PAL_W*0.92),M.box);
          cargo.position.y=PAL_H+bh/2; cargo.castShadow=true; grp.add(cargo);
          const wrap=new THREE.Mesh(new THREE.BoxGeometry(PAL_L*0.95,bh*0.97,PAL_W*0.95),M.film);
          wrap.position.y=PAL_H+bh/2; grp.add(wrap);
        }
        grp.position.set(0,deckY,pz);
        grp.userData.code=code; g.add(grp);
        const wp=new THREE.Vector3(); grp.getWorldPosition(wp);
        VANI.push({code,row:id,bay:bi+1,obj:grp,center:wp,empty:!!empty&&!cont,cont:cont||null});
      }
    });
  }
  g.userData.id=id; racksGroup.add(g); return g;
}

const C3={w:W3,pal:3}, C2={w:W2,pal:2};
const RACKS={
  A:[C3,C3,C3,C2],   // 33
  B:[C3,C3,C3,C3],   // 36
  C:[C2,C3,C3,C3],   // 33
  D:[C3,C3,C3,C2],   // 33
  E:[C3,C3],         // 18
  F:[C3,C3],         // 18

// SCAFFALATURE — aggiunte una alla volta nelle posizioni reali rilevate.
// La A corre lungo Z (lunghezza), profondità lungo X. Coordinate nel mondo reale.
const built={};

// --- SCAFFALATURA A (vuota) ---
// nell'angolo muro destro (X=+LX/2) + ritorno cartongesso (Z=CUT_Z).
// lato lungo a 20cm dal muro destro; lato corto a 10cm dal cartongesso.
{
  const A_ING=10.35;                          // ingombro totale con telai
  const Ax1=LX/2-0.20;                         // faccia verso muro destro (20cm di stacco)
  const Acx=Ax1-RACK_DEPTH/2;                  // centro X (profondità verso interno)
  const Az0=CUT_Z+0.10;                        // 10cm dal ritorno cartongesso
  const Acz=Az0+A_ING/2;                       // centro Z
  built.A=buildRack({id:'A',x:Acx,z:Acz,bays:RACKS.A,empty:true});
}

// --- SCAFFALATURA B (vuota) ---
// corre lungo X (parallela al lato lungo del soppalco), addossata al bordo soppalco verso il centro (Z=SOP.z1).
// parte 13cm dopo la scala (lungo X). Campate lungo X → costruita ruotata.
{
  // scala nel mondo reale (mirror specchia X): bordo verso centro soppalco
  const stairWorldX1=-STAIR_X0;                 // -12.90
  const B_x0=stairWorldX1+0.13;                 // 13cm dopo la scala
  const B_ING=RACKS.B.reduce((s,b)=>s+b.w,0)+0.45;  // ingombro con telai
  const Bcx=B_x0+B_ING/2;                        // centro lungo X
  const sopZ1=-LZ/2+6;                           // bordo soppalco verso centro (mondo)
  const Bcz=sopZ1+RACK_DEPTH/2+0.20;             // 20cm di stacco dal bordo soppalco, verso il centro
  built.B=buildRack({id:'B',x:Bcx,z:Bcz,bays:RACKS.B,empty:true,alongX:true});

  // --- SCAFFALATURE C e D (vuote) parallele alla B, stessa partenza X ---
  // C: corsia libera di 4m dalla B. D: contrapposta a C, 20cm di stacco, verso il centro.
  const B_front=Bcz+RACK_DEPTH/2;
  const Ccz=B_front+4.0+RACK_DEPTH/2;           // centro C (4m di corsia da B)
  const C_front=Ccz+RACK_DEPTH/2;
  const Dcz=C_front+0.20+RACK_DEPTH/2;           // centro D (20cm da C, contrapposta)
  // C e D allineate alla B sullo stesso asse X. Le loro lunghezze possono differire,
  // ma partono dalla stessa X di inizio (B_x0).
  const C_ING=RACKS.C.reduce((s,b)=>s+b.w,0)+0.45;
  const D_ING=RACKS.D.reduce((s,b)=>s+b.w,0)+0.45;
  const Ccx=B_x0+C_ING/2;
  const Dcx=B_x0+D_ING/2;
  // C specchiata lungo la lunghezza: la campata corta (C01) va dal lato della corsia, adiacente alla D.
  // Geometria invertita [C3,C3,C3,C2], codici mappati [C04,C03,C02,C01].
  const RACKS_C_flip=[...RACKS.C].reverse();
  const C_codeBays=[4,3,2,1];
  built.C=buildRack({id:'C',x:Ccx,z:Ccz,bays:RACKS_C_flip,empty:true,alongX:true,codeBays:C_codeBays});
  built.D=buildRack({id:'D',x:Dcx,z:Dcz,bays:RACKS.D,empty:true,alongX:true});
}

// --- SCAFFALATURE E e F (vuote) parallele alla A, lungo Z ---
// F: corsia libera di 4m dalla A. E: contrapposta a F, 20cm di stacco, verso il centro.
// Stessa partenza Z della A (lato corto a 10cm dal cartongesso).
{
  const Ax1=LX/2-0.20, Acx=Ax1-RACK_DEPTH/2;     // come la A
  const A_inner=Acx-RACK_DEPTH/2;                 // faccia A verso il centro
  const Fcx=A_inner-4.20-RACK_DEPTH/2;           // centro F (corsia 4,20m)
  const F_inner=Fcx-RACK_DEPTH/2;
  const Ecx=F_inner-0.20-RACK_DEPTH/2;            // centro E (20cm da F, contrapposta)
  const Az0=CUT_Z+0.10;                            // stessa partenza Z della A
  const EF_ING=RACKS.E.reduce((s,b)=>s+b.w,0)+0.30;
  const EFcz=Az0+EF_ING/2;
  built.F=buildRack({id:'F',x:Fcx,z:EFcz,bays:RACKS.F,empty:true});
  built.E=buildRack({id:'E',x:Ecx,z:EFcz,bays:RACKS.E,empty:true});
}

// crea uno sprite-etichetta (billboard) col nome prodotto, stile glass premium
function makeLabelSprite(text){
  const txt=String(text||'').trim() || 'Prodotto';
  const dpr=Math.min(devicePixelRatio||1,2);
  // misura testo per dimensionare il canvas
  const pad=44, fontPx=46, maxW=760;
  const cv=document.createElement('canvas');
  const ctx=cv.getContext('2d');
  ctx.font=`600 ${fontPx}px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif`;
  // wrap su 2 righe max
  const words=txt.split(/\s+/); const lines=[]; let cur='';
  for(const w of words){
    const test=cur?cur+' '+w:w;
    if(ctx.measureText(test).width> maxW && cur){ lines.push(cur); cur=w; }
    else cur=test;
    if(lines.length>=2) break;
  }
  if(cur && lines.length<2) lines.push(cur);
  if(lines.length===0) lines.push(txt);
  // tronca se ancora troppo lungo
  let tw=0; for(const l of lines) tw=Math.max(tw,ctx.measureText(l).width);
  const W=Math.min(maxW,tw)+pad*2;
  const lineH=fontPx*1.22;
  const H=lineH*lines.length + pad*1.4;
  cv.width=Math.ceil(W*dpr); cv.height=Math.ceil(H*dpr);
  ctx.scale(dpr,dpr);

  // pannello glass arrotondato
  const r=26;
  ctx.fillStyle='rgba(10,14,20,0.78)';
  roundRectPath(ctx,1,1,W-2,H-2,r); ctx.fill();
  // bordo luminoso
  ctx.lineWidth=2.4;
  const grd=ctx.createLinearGradient(0,0,W,0);
  grd.addColorStop(0,'rgba(120,200,255,0.9)'); grd.addColorStop(1,'rgba(80,140,255,0.7)');
  ctx.strokeStyle=grd; roundRectPath(ctx,1.5,1.5,W-3,H-3,r-1); ctx.stroke();
  // testo
  ctx.font=`600 ${fontPx}px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=8;
  ctx.fillStyle='#eaf3ff';
  const totalTextH=lineH*lines.length;
  lines.forEach((l,i)=>{
    ctx.fillText(l, W/2, H/2 - totalTextH/2 + lineH*(i+0.5));
  });

  const tex=new THREE.CanvasTexture(cv); tex.anisotropy=8; tex.colorSpace=THREE.SRGBColorSpace;
  const spMat=new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false});
  const sp=new THREE.Sprite(spMat);
  // scala mondo proporzionale all'aspect del canvas (~2.4m di larghezza)
  const worldW=2.4, worldH=worldW*(H/W);
  sp.scale.set(worldW,worldH,1);
  sp.renderOrder=999;
  return sp;
}
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// pulisce il glow precedente sul bancale (ripristina i materiali condivisi originali)
function clearGlow(){
  if(!glowState) return;
  for(const it of glowState.meshes){
    if(it.mesh && it.original){
      it.mesh.material = it.original;
      if(it.clone && it.clone.dispose) it.clone.dispose();
    }
  }
  if(glowState.light){ scene.remove(glowState.light); }
  if(glowState.label){
    scene.remove(glowState.label);
    if(glowState.label.material){ if(glowState.label.material.map) glowState.label.material.map.dispose(); glowState.label.material.dispose(); }
  }
  glowState=null;
}

/* ===== VOCE IA (femminile, italiana) — Web Speech API ===== */
const Voce = (function(){
  const synth = window.speechSynthesis || null;
  let voce = null, pronta = false, abilitata = true;
  function scegliVoce(){
    if(!synth) return;
    const voices = synth.getVoices() || [];
    if(!voices.length) return;
    const it = voices.filter(v=>/it(-|_)?/i.test(v.lang) || /italian|ital/i.test(v.name));
    // preferenze: nomi tipicamente femminili IT, poi qualsiasi voce IT, poi default
    const preferite = ['Alice','Elsa','Federica','Giulia','Carla','Google italiano','Microsoft Elsa'];
    let scelta = null;
    for(const p of preferite){ scelta = it.find(v=>v.name.toLowerCase().includes(p.toLowerCase())); if(scelta) break; }
    if(!scelta){
      // euristica: evita nomi maschili noti, prendi la prima IT
      scelta = it.find(v=>!/(luca|cosimo|diego|paolo|male|uomo)/i.test(v.name)) || it[0];
    }
    voce = scelta || voices[0];
    pronta = true;
  }
  if(synth){
    scegliVoce();
    synth.onvoiceschanged = scegliVoce;
  }
  function parla(testo){
    if(!synth || !abilitata || !testo) return;
    try{
      synth.cancel();                       // interrompe l'annuncio precedente
      const u = new SpeechSynthesisUtterance(testo);
      if(voce) u.voice = voce;
      u.lang = (voce && voce.lang) || 'it-IT';
      u.rate = 1.0; u.pitch = 1.05; u.volume = 1.0;
      synth.speak(u);
    }catch(e){ console.warn('TTS error', e); }
  }
  function toggle(on){ abilitata = (on!==undefined)? !!on : !abilitata; if(!abilitata && synth) synth.cancel(); return abilitata; }
  return { parla, toggle, get pronta(){return pronta;}, get abilitata(){return abilitata;} };
})();

// sblocco audio: i browser bloccano la sintesi finché non c'è un'interazione utente.
// Al primo tocco/click/tasto faccio un'enunciazione silenziosa per abilitare la voce.
(function unlockSpeech(){
  let done=false;
  const unlock=()=>{
    if(done) return; done=true;
    try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; (window.speechSynthesis||{speak(){}}).speak(u); }catch(_){}
    window.removeEventListener('pointerdown',unlock); window.removeEventListener('keydown',unlock); window.removeEventListener('touchstart',unlock);
  };
  window.addEventListener('pointerdown',unlock,{once:false});
  window.addEventListener('keydown',unlock,{once:false});
  window.addEventListener('touchstart',unlock,{once:false});
})();

// compone la frase parlata per un vano
// ripulisce il nome prodotto per la pronuncia (toglie SKU/codici, simboli)
function nomeProdottoPulito(title){
  let t=String(title||'').trim();
  if(!t) return '';
  // rimuovi codici SKU tipici (sequenze di lettere+numeri lunghe), parentesi, simboli
  t=t.replace(/\b[A-Z0-9]{6,}\b/g,' ')          // SKU/ASIN lunghi
     .replace(/[•|/_>#]+/g,' ')
     .replace(/\b(sku|ean|asin|cod)\b[:\s-]*\S+/ig,' ')
     .replace(/\s{2,}/g,' ').trim();
  // accorcia se troppo lungo (la voce non deve diventare interminabile)
  const words=t.split(' ');
  if(words.length>8) t=words.slice(0,8).join(' ');
  return t;
}

function fraseVano(v){
  const m=v.code.match(/^([A-F])(\d{2})-L(\d)-P(\d)$/);
  let s='';
  if(m){
    const fila=m[1], campata=parseInt(m[2],10), liv=parseInt(m[3],10), pos=parseInt(m[4],10);
    s=`Scaffalatura ${fila}, campata ${campata}. Livello ${liv}, posizione ${pos}.`;
  } else {
    s=`Ubicazione ${v.code}.`;
  }
  if(v.cont){
    const c=v.cont;
    const prod = nomeProdottoPulito(c.title);
    const pezzi = c.qty===1 ? '1 pezzo' : `${c.qty} pezzi`;
    s += prod ? ` Qui trovi ${prod}: ${pezzi} disponibili.` : ` Sono presenti ${pezzi}.`;
  } else {
    s += ' Ubicazione vuota.';
  }
  return s;
}

function highlightVano(v){

  if(v.cont){

    if(c.aperta) dett += ` + <b>1 aperta</b> (${c.restoPz}/${c.pzPerScatola})`;
    txt += `<br>EPAL 80×120 · ${dett} · ${c.pzPerScatola} pz/scatola → <b>${c.qty}</b> pz`;
    if(c.title) txt += `<br><span style="opacity:.7">${c.title}</span>`;

const cam={theta:Math.PI*0.16,phi:Math.PI*0.10,r:34,tx:0,ty:1.8,tz:1};
const camS={...cam};   // versione interpolata per movimento fluido
let tween=null;

/* Lato dal quale inquadrare ogni fila, scelto sulla CORSIA LIBERA così la camera
   non finisce mai dietro i pallet della fila contrapposta.
   File lungo Z (A,D,E,F): theta ±PI/2 (guarda lungo X).
   File lungo X (B,C): theta 0 o PI (guarda lungo Z).
   - A: muro destro, corsia verso interno → camera a x minore → -PI/2
   - F: contrapposta ad A sulla corsia, E dietro F → camera a x minore → -PI/2
   - E: corsia verso il centro → camera a x minore → -PI/2 (sta più al centro)
   - D,B,C: corsia centrale. B davanti, C dietro (corsia 4m tra loro), D dietro C.
   - B → camera a z maggiore (verso la corsia B-C) → 0
   - C → camera a z minore (verso la corsia B-C) → PI
   - D → camera a z maggiore (corsia D verso fronte) → 0 */
const ROW_THETA={ A:-Math.PI/2, E:-Math.PI/2, F:-Math.PI/2, B:0, C:Math.PI, D:0 };
function detailTheta(target,vano){
  const row=vano&&vano.row;
  if(row && ROW_THETA[row]!==undefined) return ROW_THETA[row];
  // fallback: guarda verso il centro capannone
  return (target.x>0)?-Math.PI/2:Math.PI/2;
}
// posa "dettaglio": camera in DIAGONALE DALL'ALTO, così resta sopra eventuali pallet davanti
function detailPose(target,vano){
  return {tx:target.x, ty:target.y+0.3, tz:target.z, r:8.5, theta:detailTheta(target,vano), phi:Math.PI*0.30};
}
// posa panoramica di riposo: vista d'insieme ravvicinata e bassa (cinematografica)
function panoramaPose(){
  return {tx:0, ty:1.8, tz:1, r:34, theta:Math.PI*0.16, phi:Math.PI*0.10};
}
// avvia un tween verso una posa, scegliendo il cammino angolare più breve
function tweenTo(to,dur){
  const from={...cam};
  const adj={...to};
  adj.theta = from.theta + normAngle(to.theta - from.theta);
  tween={from,to:adj,dur:dur||1100,start:performance.now()};
}

// normalizza un angolo nel range [-PI, PI] per interpolare sul percorso più breve
function normAngle(a){ while(a> Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; }

// vola sul vano (singolo movimento) — usato come avvio del tour
function flyTo(target,kind,vano){
  if(kind==='vano') tweenTo(detailPose(target,vano),1100);
  else tweenTo(panoramaPose(),1100);
}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}

/* ===== TOUR CINEMATICO — ordinato, lento, premium =====
   Pochi shot eleganti che si concatenano senza scatti: ogni shot è un singolo
   movimento continuo da una posa all'altra. La camera resta sempre dal lato della
   corsia e in diagonale dall'alto, così il bancale è sempre visibile. */
let tour=null;
const TOUR_DURATION=30000;     // durata totale del loop (ms)

/* ===== IDLE DRIFT: quando non è selezionato nulla, la camera si muove lentamente
   in modo cinematico per un po', poi rallenta e si ferma. Tutto smooth. ===== */
let idle=null;                 // {start, baseTheta, basePhi, baseR, baseTy}
let lastInteract=performance.now();
const IDLE_WAIT=2200;          // attesa prima che parta il drift (ms)
const IDLE_DRIFT_MS=16000;     // durata del lento movimento prima di pausarsi (ms)
function markInteract(){ lastInteract=performance.now(); idle=null; }

function updateIdle(now){
  // attivo solo se: nessun bancale selezionato, nessun tour, nessun tween in corso
  if(selectedVano||tour||tween){ idle=null; return; }
  if(now-lastInteract < IDLE_WAIT){ idle=null; return; }
  if(!idle){
    // ancora la base del drift alla posa di riposo corrente
    idle={ start:now, baseTheta:cam.theta, basePhi:cam.phi, baseR:cam.r, baseTy:cam.ty };
  }
  const elapsed=now-idle.start;
  // progresso 0→1 sul tempo di drift; oltre 1 resta fermo (pausa)
  const p=Math.min(1, elapsed/IDLE_DRIFT_MS);
  // ease-out: parte lento, accelera appena, poi decelera fino a fermarsi
  const e=1-Math.pow(1-p,3);
  // ampiezze contenute: lieve arco orbitale + respiro di altezza/zoom, niente di brusco
  cam.theta = idle.baseTheta + e*0.55;                 // ruota dolcemente di ~31°
  cam.phi   = idle.basePhi   + Math.sin(e*Math.PI)*0.05; // sale e riscende impercettibilmente
  cam.r     = idle.baseR     - Math.sin(e*Math.PI)*3.0;  // si avvicina e poi torna
  cam.ty    = idle.baseTy    + Math.sin(e*Math.PI)*0.4;
}

function buildShots(target,vano){
  const dt=detailTheta(target,vano);
  const tx=target.x, ty=target.y, tz=target.z;
  const P=(o)=>Object.assign({tx,ty:ty+0.3,tz,theta:dt,r:8.5,phi:Math.PI*0.30},o);

  return [
    // 1) AVVICINAMENTO dall'alto: parte un po' più alto e lontano, scende dolcemente sul bancale
    { name:'approach',
      from:P({r:13, phi:Math.PI*0.40, ty:ty+2.0}),
      to  :P({r:8.5,phi:Math.PI*0.28, ty:ty+0.3}),
      dur:5000, hold:1200 },

    // 2) ORBITA lenta e ampia: gira dolcemente attorno al bancale (sempre dal lato corsia)
    { name:'orbit',
      from:P({r:9, phi:Math.PI*0.26, theta:dt-0.6}),
      to  :P({r:9, phi:Math.PI*0.34, theta:dt+0.6}),
      dur:6000, hold:1000 },

    // 3) RESPIRO: si allontana con eleganza per mostrare il contesto, poi resta
    { name:'breath',
      from:P({r:14, phi:Math.PI*0.34, ty:ty+1.5}),
      to  :{tx:tx*0.45, ty:3.0, tz:tz*0.45, r:30, theta:dt*0.3+Math.PI*0.12, phi:Math.PI*0.36},
      dur:5500, hold:1200 },
  ];
}

function startCinematicTour(v){
  const target=v.center.clone ? v.center.clone() : v.center;
  tour={ vano:v, target, shots:buildShots(target,v), idx:0, sub:'in',
         endAt:performance.now()+TOUR_DURATION, until:0 };
  applyShot(performance.now());
}

// ogni shot: transizione morbida verso 'from', poi movimento lungo verso 'to'
function applyShot(now){
  const sh=tour.shots[tour.idx];
  // riposizionamento morbido (non brusco) sulla posa di partenza dello shot
  tweenTo(sh.from, 1600);
  tour.sub='settling';
  tour.until=now+1600;
}

function updateTour(now){
  if(!tour) return;
  if(now>=tour.endAt){
    tweenTo(panoramaPose(),3200);   // chiusura lunga e morbida sulla panoramica
    tour=null;
    return;
  }
  if(now<tour.until) return;

  const sh=tour.shots[tour.idx];
  if(tour.sub==='settling'){
    // esegue il movimento principale, continuo e lento
    tweenTo(sh.to, sh.dur);
    tour.sub='moving';
    tour.until=now+sh.dur+(sh.hold||0);
  } else {
    tour.idx=(tour.idx+1)%tour.shots.length;
    applyShot(now);
  }
}

// monitor prestazioni: se il framerate resta basso, abbassa il pixelRatio una volta sola
let _fpsSamples=0,_fpsSlow=0,_lastNow=0,_degraded=false;
function perfWatch(now){
  if(_lastNow){ const dt=now-_lastNow; if(dt>26) _fpsSlow++; _fpsSamples++; }
  _lastNow=now;
  if(!_degraded && _fpsSamples>=120){
    if(_fpsSlow>70){   // >~58% dei frame lenti → riduci risoluzione
      renderer.setPixelRatio(Math.max(1, Math.min(devicePixelRatio,1.5)-0.5));
      requestShadowUpdate(2); _degraded=true;
    }
    _fpsSamples=0; _fpsSlow=0;
  }
}

/* Confina la posizione (x,z) della camera dentro il perimetro a L del capannone,
   con un margine dai muri. Esclude anche l'angolo del vano cartongesso. */
const MWALL=0.6;                                  // distanza minima dai muri
// rettangolo interno calpestabile
const CX0=-LX/2+MWALL, CX1=LX/2-MWALL, CZ0=-LZ/2+MWALL, CZ1=LZ/2-MWALL;
// angolo tagliato (vano cartongesso) in coordinate mondo: X∈[CUT_X,LX/2], Z∈[-LZ/2,CUT_Z]
// con un margine attorno al setto cartongesso
const NX0=CUT_X-MWALL, NZ1=CUT_Z+MWALL;          // bordi interni del taglio (lato area)
function clampCameraXZ(x,z){
  // 1) dentro il rettangolo perimetrale
  x=Math.max(CX0,Math.min(CX1,x));
  z=Math.max(CZ0,Math.min(CZ1,z));
  // 2) fuori dall'angolo cartongesso: se il punto è dentro la "tacca", spingilo sul bordo più vicino
  if(x>NX0 && z<NZ1){
    // distanza per uscire verso sinistra (X<NX0) o verso il basso... qui "verso il centro" (Z>NZ1)
    const dx=x-NX0;        // quanto deve spostarsi in -X per uscire
    const dz=NZ1-z;        // quanto deve spostarsi in +Z per uscire
    if(dx<dz) x=NX0; else z=NZ1;   // esci dal lato più vicino
  }
  return [x,z];
}

function tick(now){
  perfWatch(now);
  updateTour(now);
  updateIdle(now);
  if(tween){const k=ease(Math.min(1,(now-tween.start)/tween.dur));
    for(const key in tween.to)cam[key]=tween.from[key]+(tween.to[key]-tween.from[key])*k;
    if(k>=1)tween=null;}
  // animazione glow del bancale selezionato
  if(glowState){
    pulse+=0.05;
    const s=Math.sin(pulse);
    const inten=0.45+s*0.18;
    for(const it of glowState.meshes){
      if(it.mesh.material && it.mesh.material.emissive) it.mesh.material.emissiveIntensity=inten;
    }
    if(glowState.light) glowState.light.intensity=5+s*2.5;
    // etichetta prodotto: entrata cinematica (fade + slide dall'alto) poi leggero bob
    if(glowState.label){
      const t=Math.min(1,(now-glowState.labelStart)/700);   // 0.7s di entrata
      const e=1-Math.pow(1-t,3);                              // ease-out
      glowState.label.material.opacity=e;
      const slide=(1-e)*0.5;                                 // scende leggermente in posizione
      const bob=Math.sin(pulse*0.6)*0.04;                    // respiro continuo dopo l'entrata
      glowState.label.position.y=glowState.labelBaseY + slide + bob;
    }
  }
  // smoothing camera: camS insegue cam con easing continuo
  // durante il tour cinematico uso uno smoothing più dolce per movimenti fluidi
  const sm=tour?0.10:0.16;
  for(const k of ['theta','phi','r','tx','ty','tz']) camS[k]+=(cam[k]-camS[k])*sm;
  let cpx=camS.tx+camS.r*Math.cos(camS.phi)*Math.sin(camS.theta);
  let cpy=camS.ty+camS.r*Math.sin(camS.phi)+0.001;
  let cpz=camS.tz+camS.r*Math.cos(camS.phi)*Math.cos(camS.theta);
  // CONFINAMENTO: la camera non oltrepassa i muri (perimetro a L + cartongesso)
  [cpx,cpz]=clampCameraXZ(cpx,cpz);
  cpy=Math.min(cpy, H_HIGH-0.15);                 // non sopra il soffitto
  camera.position.set(cpx,cpy,cpz);
  camera.lookAt(camS.tx,camS.ty,camS.tz);
  if(wallsAuto){
    for(const w of WALLS){
      const toCam=new THREE.Vector3().subVectors(camera.position,w.position);
      const n=new THREE.Vector3(0,0,1).applyEuler(w.rotation);
      const facing=toCam.dot(n)<0;   // camera dietro la parete (la guardi da fuori)
      const tgt=facing?0:0.92;
      w.material.opacity+=(tgt-w.material.opacity)*0.18;
      w.material.transparent=true; w.visible=w.material.opacity>0.02;
    }
  } else {
    for(const w of WALLS){ w.visible=!wallsHidden;
      if(w.visible){w.material.opacity+=(0.92-w.material.opacity)*0.18;w.material.transparent=true;} }
  }
  // ombre: ricalcolate solo quando serve (scena quasi statica → grande risparmio)
  if(_shadowFrames>0){ renderer.shadowMap.needsUpdate=true; _shadowFrames--; }
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}

const CAPANNONE_3D_FOCUS_DOC_ID = "capannone3dFocus";

function normalizeRackCode(code){
  return String(code || "").trim().toUpperCase().replace(/\s+/g, "");
}

function findAndHighlightRackCode(code, opts={}){
  const c = normalizeRackCode(code);
  if(!c) return false;
  const v = VANI_MAP[c] || VANI.find(x=>x.code===c) || VANI.find(x=>String(x.code||"").startsWith(c));
  if(v){
    highlightVano(v);
    return true;
  }
  const info = document.getElementById('info');
  if(info) info.textContent = 'Pallet non trovato: ' + c;
  if(opts && opts.fromCloud) setCloudStatus('Comando Trova non trovato • ' + c, '#ef4444');
  return false;
}

function handleCapannone3dFocusCommand(data){
  try{
    const d = data || {};
    const code = normalizeRackCode(d.rackLocation || d.code || d.find || d.targetRackLocation || "");
    if(!code) return;
    const seq = String(d.focusSeq || d.commandId || d.focusAtClient || d.updatedAtClient || "");
    const key = `${seq}::${code}`;
    if(key && key === LAST_CAPANNONE_3D_FOCUS_KEY) return;
    LAST_CAPANNONE_3D_FOCUS_KEY = key;

    // piccolo delay: lascia terminare il refresh grafico dei bancali, poi vola sulla posizione
    setTimeout(()=>{
      const ok = findAndHighlightRackCode(code, { fromCloud:true });
      if(ok) setCloudStatus('Trova ricevuto • ' + code, '#22d3ee');
    }, 80);
  }catch(e){
    console.warn('focus command error', e);
  }
}

/* ===================================================================
   COLLEGAMENTO CLOUD (Firebase Firestore) — SOLA LETTURA, REALTIME
   Legge le ubicazioni scritte da picking.html e aggiorna i bancali 3D
   in tempo reale. Capannone 3D NON scrive mai: è solo un visual da kiosk.
   =================================================================== */
const VANI_MAP = {};
for(const v of VANI) VANI_MAP[v.code] = v;

// deduce i pezzi per scatola dal formato prodotto.
// multipli noti: 12 (litro), 24 (500 ml), 48 (100 ml). Default 12.
function pezziPerScatola(title, info){
  // 1) campo esplicito dal cloud, se presente
  const exp = info && (info.pzPerScatola || info.pezziScatola || info.pcsPerBox);
  if(exp && Number(exp)>0) return Math.round(Number(exp));
  // 2) euristica sul titolo
  const t = String(title||'').toLowerCase().replace(/\s+/g,'');
  if(/100ml|0[.,]1l|100cc/.test(t)) return 48;
  if(/500ml|0[.,]5l|50cl/.test(t)) return 24;
  if(/1l|1000ml|1lt|1litro|100cl/.test(t)) return 12;
  return 12;   // default litro
}

// deduce il tipo di chiusura dal prodotto: 'spray' (spruzzino) o 'tappo' (tappo a vite).
function tipoTappoProdotto(title, info){
  // campo esplicito dal cloud, se presente
  const exp = info && (info.tappo || info.chiusura || info.cap);
  if(exp){ const e=String(exp).toLowerCase();
    if(/spray|spruz|trigger|vapo|nebul/.test(e)) return 'spray';
    if(/tappo|cap|vite|flip/.test(e)) return 'tappo';
  }
  // euristica sul titolo
  const t = String(title||'').toLowerCase();
  if(/spray|spruzz|trigger|vaporizz|nebulizz|atomizz/.test(t)) return 'spray';
  return 'tappo';   // default tappo a vite
}

// aggiorna (crea/sostituisce/svuota) il bancale di un vano con PRECISIONE FISICA.
// DIFF: se qty/title non sono cambiati rispetto all'ultimo stato, non ricostruisce nulla
// (evita rebuild inutili a ogni snapshot cloud → niente lag periodici).
// Ritorna true se ha effettivamente modificato la geometria.
function aggiornaVano(code, qty, info){
  const v = VANI_MAP[code]; if(!v) return false;
  const title=(info&&info.title)||'';
  const key = qty>0 ? `${qty}|${title}` : '';
  if(v._lastKey===key) return false;            // nessun cambiamento → skip
  v._lastKey=key;

  if(v._cargo){ v.obj.remove(v._cargo); v._cargo.traverse(o=>{if(o.geometry)o.geometry.dispose();}); v._cargo=null; }
  v.cont = null; v.empty = true;
  if(qty && qty>0){
    const pzScat = pezziPerScatola(title, info);
    const scatolePiene = Math.floor(qty / pzScat);
    const restoPz = qty - scatolePiene*pzScat;          // pezzi nella scatola aperta
    const aperta = restoPz>0 ? 1 : 0;
    const fillFrac = restoPz>0 ? (restoPz/pzScat) : 0;
    const tipoTappo = tipoTappoProdotto(title, info);

    const bancale = buildBancale({ scatolePiene, aperta, fillFrac, restoPz, pzPerScatola:pzScat, tipoTappo, maxH:VANO_MAXH });
    bancale.rotation.y = Math.PI/2;
    v.obj.add(bancale);
    v._cargo = bancale;
    v.empty = false;
    v.cont = {
      scatolePiene, aperta, restoPz, pzPerScatola:pzScat, qty, tipoTappo,
      scatoleTot: scatolePiene + aperta,
      contenuto:(info&&info.contenuto)||'', title
    };
  }
  return true;
}

// avvia il listener realtime sulle ubicazioni (dopo auth valida)
function startInventoryRealtime(fs, db){
  setCloudStatus('Lettura ubicazioni…', '#f59e0b');
  // anagrafica prodotti globale: collezione piatta amzInventoryProducts/{sku}
  // ogni doc ha rackAllocations:[{code,lot,qty}], scritta da picking.html.
  const focusRef = fs.doc(db, "amzInventoryProducts", CAPANNONE_3D_FOCUS_DOC_ID);
  fs.onSnapshot(focusRef, (snap)=>{
    if(snap.exists()) handleCapannone3dFocusCommand(snap.data() || {});
  }, (err)=>{
    console.error('Firestore focus error', err);
    if(err && err.code === 'permission-denied') setCloudStatus('Permessi comando Trova mancanti • apri ⚙ UID', '#ef4444');
  });

  const colRef = fs.collection(db, "amzInventoryProducts");
  fs.onSnapshot(colRef, (snap)=>{
    const perCode = {};
    snap.forEach(docSnap=>{
      const d = docSnap.data() || {};
      const allocs = Array.isArray(d.rackAllocations) ? d.rackAllocations : [];
      const title = d.title || d.name || d.sku || docSnap.id;
      for(const a of allocs){
        const code = String(a.code||a.location||'').trim().toUpperCase();
        const qty = Math.round(Number(a.qty||a.quantity||0))||0;
        if(!code || qty<=0) continue;
        if(!perCode[code]) perCode[code] = { qty:0, title };
        perCode[code].qty += qty;
      }
    });
    let changed=false;
    for(const code in VANI_MAP){
      const data = perCode[code];
      if(aggiornaVano(code, data ? data.qty : 0, data ? { title:data.title } : null)) changed=true;
    }
    if(changed) requestShadowUpdate(2);   // ricalcola le ombre solo se la merce è cambiata
    const n = Object.keys(perCode).length;
    setCloudStatus(`Cloud live • ${n} ubicazioni`, '#22c55e');
  }, (err)=>{
    console.error('Firestore error', err);
    if(err && err.code === 'permission-denied'){
      setCloudStatus('Permessi mancanti • apri ⚙ UID', '#ef4444');
      const statusBox = document.getElementById('kioskMiniStatus');
      if(statusBox) statusBox.textContent = KIOSK_UID ? ('Permission denied. Crea in Firestore kiosks/' + KIOSK_UID + ' e pubblica le regole.') : 'Permission denied. Apri quando l’UID è disponibile.';
    }else{
      setCloudStatus('Cloud non raggiungibile', '#ef4444');
    }
  });
}
</script>
</body>
</html>
