<!DOCTYPE html>

<html lang="it" translate="no">
<head>

  <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<meta name="theme-color" content="#0a84ff" />
<link rel="manifest" href="./manifest.webmanifest" />

<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Hub Centrale" />
<link rel="apple-touch-icon" href="./icons/icon-180.png" />
<meta name="format-detection" content="telephone=no" />

<script>
(function(){
  try{
    const u = new URL(location.href);
    if(u.pathname.endsWith(".html/")){
      u.pathname = u.pathname.slice(0, -1);
      location.replace(u.toString());
    }
  }catch(e){}
})();
</script>

<style>
    :root{
      --bg:#F2F2F7;
      --card:#ffffff;
      --muted:rgba(12, 16, 26, .60);
      --text:rgba(12, 16, 26, .94);
      --stroke:rgba(12, 16, 26, .08);
      --hairline:rgba(12, 16, 26, .12);
      --accent:#0a84ff;
      --accent-soft:rgba(10, 132, 255, .08);
      --shadow-soft:0 18px 48px rgba(15, 23, 42, .10);
      --shadow-card:0 10px 26px rgba(15, 23, 42, .08);
      --radius-xl:26px;
      --radius:22px;
      --radius-md:18px;
      --safe-top: env(safe-area-inset-top);
      --safe-bot: env(safe-area-inset-bottom);
      --safe-left: env(safe-area-inset-left);
      --safe-right: env(safe-area-inset-right);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

    html,body{
      height:100%;
      margin:0;
      font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
      overflow-x:hidden;
    }

    body.reduce-motion *{animation:none !important;transition:none !important;}

    .wrap{
      width:min(1100px, calc(100vw - 26px));
      margin:0 auto;
      padding:0 6px;
    }

    .hero{
      position:relative;
      padding: calc(18px + var(--safe-top)) 0 14px;
      background:linear-gradient(140deg, rgba(10,132,255,.12), rgba(10,132,255,.02) 40%, transparent 70%);
      overflow:hidden;
    }

    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:radial-gradient(160px 120px at 82% 12%, rgba(10,132,255,.14), transparent 60%);
      pointer-events:none;
      opacity:.9;
    }

    .heroBar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      position:relative;
      z-index:1;
      padding:0 10px 18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:16px;
      min-width:0;
      flex:1 1 auto;
    }

    .logo{
      width:96px;
      height:96px;
      object-fit:contain;
      flex:0 0 auto;
      filter: drop-shadow(0 10px 18px rgba(10,132,255,.10));
    }

    .titles{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:0;
    }

    .h1{
      margin:0;
      font-size:38px;
      line-height:1.05;
      letter-spacing:-0.02em;
      font-weight:900;
      display:flex;
      align-items:baseline;
      gap:10px;
      flex-wrap:wrap;
    }

    .h1 .accent{color:var(--accent);}

    .subtitle{
      margin:0;
      font-size:15px;
      font-weight:700;
      color:var(--muted);
      display:flex;
      align-items:center;
      gap:6px;
      flex-wrap:wrap;
    }

    .tagline{
      font-size:14px;
      color:rgba(12,16,26,.72);
      font-weight:750;
      margin:0;
      letter-spacing:0.01em;
    }

    .profile{
      display:flex;
      align-items:center;
      gap:12px;
      flex:0 0 auto;
      padding:10px 14px;
      border:1px solid var(--stroke);
      border-radius:999px;
      background:linear-gradient(145deg, rgba(255,255,255,.88), rgba(255,255,255,.98));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 10px 22px rgba(10,132,255,.08);
    }

    .avatar{
      width:42px;
      height:42px;
      border-radius:14px;
      background:linear-gradient(140deg, rgba(10,132,255,.95), rgba(10,132,255,.75));
      color:#fff;
      display:grid;
      place-items:center;
      font-weight:900;
      letter-spacing:0.01em;
      font-size:16px;
    }

    .status{
      display:flex;
      align-items:center;
      gap:7px;
      font-size:13px;
      font-weight:850;
      color:rgba(12,16,26,.78);
      white-space:nowrap;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:999px;
      background:#2ecc71;
      box-shadow:0 0 0 4px rgba(46,204,113,.18);
    }

    .panel{
      position:relative;
      margin-top:-8px;
      padding: 0 10px 20px;
      z-index:1;
    }

    .panelCard{
      border:1px solid var(--stroke);
      background:var(--card);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow-soft);
      padding:20px 18px;
    }

    .searchRow{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
      margin-bottom:18px;
    }

    .searchBar{
      display:flex;
      align-items:center;
      gap:10px;
      padding:12px 14px;
      border-radius:18px;
      border:1px solid var(--stroke);
      background:linear-gradient(160deg, rgba(246,247,251,.96), rgba(255,255,255,.96));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 8px 18px rgba(15,23,42,.06);
      font-weight:780;
      color:rgba(12,16,26,.72);
      font-size:14px;
    }

    .searchIcon{
      width:16px;
      height:16px;
      border:1px solid var(--stroke);
      border-radius:50%;
      display:grid;
      place-items:center;
      padding:4px;
      color:var(--accent);
      background:rgba(10,132,255,.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.85);
    }

    .quickActions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .pill{
      border:none;
      background:linear-gradient(140deg, rgba(10,132,255,.16), rgba(10,132,255,.12));
      color:#0b4f9c;
      padding:10px 14px;
      border-radius:16px;
      font-weight:850;
      font-size:13px;
      letter-spacing:0.01em;
      display:flex;
      align-items:center;
      gap:8px;
      box-shadow:0 10px 18px rgba(10,132,255,.12);
      cursor:pointer;
      transition:transform .14s ease, box-shadow .14s ease;
    }
    .pill:active{transform:scale(.97); box-shadow:0 6px 12px rgba(10,132,255,.14);}    

    .cardHead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      padding:4px 2px 12px;
    }

    .cardTitle{
      margin:0;
      font-size:18px;
      font-weight:950;
      letter-spacing:0.01em;
      color:rgba(12,16,26,.9);
    }

    .cardDesc{
      margin:4px 0 0;
      font-size:13.4px;
      color:var(--muted);
      font-weight:760;
      line-height:1.32;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:12px;
    }

    .tile{
      --tileGrad1: rgba(10, 132, 255, .94);
      --tileGrad2: rgba(64, 156, 255, .46);
      --tileStroke: rgba(10, 132, 255, .55);
      --tileGlow: rgba(10, 132, 255, .22);
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:10px;
      padding:16px 12px 18px;
      min-height:156px;
      border:1px solid var(--stroke);
      border-radius:var(--radius-md);
      background:linear-gradient(180deg, #fff, rgba(246,247,251,.92));
      box-shadow:var(--shadow-card);
      color:var(--text);
      text-decoration:none;
      transition: transform .16s cubic-bezier(.22,.61,.36,1), box-shadow .18s ease, filter .18s ease, outline-color .18s ease;
      will-change:transform;
      user-select:none;
      animation: tilePop 520ms cubic-bezier(.18,.89,.32,1.28) both;
      animation-delay: calc(var(--i, 0) * 70ms);
      opacity:0;
      transform: translateY(12px) scale(.97);
    }

    .tile::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      background:radial-gradient(220px 120px at 30% 12%, rgba(255,255,255,.9), transparent 60%);
      opacity:.55;
      pointer-events:none;
      transition:opacity .16s ease;
    }

    .tile:active{
      transform: translateY(2px) scale(.985);
      filter:brightness(.985);
      box-shadow:0 8px 18px rgba(15,23,42,.10);
    }
    .tile:active::after{opacity:.28;}

    .tile:focus-visible{
      outline:2px solid rgba(10,132,255,.26);
      outline-offset:4px;
    }

    .appIcon{
      width:78px;
      height:78px;
      border-radius:22px;
      display:grid;
      place-items:center;
      background:linear-gradient(160deg, var(--tileGrad1), var(--tileGrad2));
      border:1px solid var(--tileStroke);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.86), 0 18px 34px rgba(15,23,42,.10), 0 18px 34px var(--tileGlow);
      filter: saturate(1.18) contrast(1.06);
      position:relative;
      z-index:1;
    }

    .appIcon svg{
      width:42px;
      height:42px;
      stroke: #fff;
      stroke-width:1.8;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .label{
      position:relative;
      z-index:1;
      text-align:center;
      font-size:14.4px;
      font-weight:950;
      line-height:1.26;
      letter-spacing:0.01em;
      color:rgba(12,16,26,.9);
    }

    .hint{
      position:relative;
      z-index:1;
      text-align:center;
      font-size:12.4px;
      font-weight:760;
      color:var(--muted);
      line-height:1.28;
      margin-top:-2px;
    }

    .t-polveri{ --tileGrad1: rgba(10,132,255,.96); --tileGrad2: rgba(64,156,255,.46); --tileStroke: rgba(10,132,255,.60); --tileGlow: rgba(10,132,255,.24); }
    .t-payroll{ --tileGrad1: rgba(175,82,222,.96); --tileGrad2: rgba(210,130,255,.50); --tileStroke: rgba(175,82,222,.60); --tileGlow: rgba(175,82,222,.22); }
    .t-inv{ --tileGrad1: rgba(52,199,89,.96); --tileGrad2: rgba(120,235,150,.46); --tileStroke: rgba(52,199,89,.60); --tileGlow: rgba(52,199,89,.22); }
        .t-amazon{ --tileGrad1: rgba(255,204,0,.96); --tileGrad2: rgba(255,234,150,.55); --tileStroke: rgba(255,204,0,.60); --tileGlow: rgba(255,204,0,.20); }
.t-liquidi{ --tileGrad1: rgba(90,200,250,.96); --tileGrad2: rgba(160,235,255,.48); --tileStroke: rgba(90,200,250,.60); --tileGlow: rgba(90,200,250,.22); }
    .t-granulari{ --tileGrad1: rgba(255,149,0,.96); --tileGrad2: rgba(255,200,105,.50); --tileStroke: rgba(255,149,0,.60); --tileGlow: rgba(255,149,0,.22); }
    .t-bulk{ --tileGrad1: rgba(88,86,214,.96); --tileGrad2: rgba(150,150,255,.50); --tileStroke: rgba(88,86,214,.60); --tileGlow: rgba(88,86,214,.22); }
    .t-control{ --tileGrad1: rgba(255,45,85,.94); --tileGrad2: rgba(255,140,165,.50); --tileStroke: rgba(255,45,85,.58); --tileGlow: rgba(255,45,85,.22); }
    .t-supply{ --tileGrad1: rgba(52,172,224,.96); --tileGrad2: rgba(140,220,255,.50); --tileStroke: rgba(52,172,224,.60); --tileGlow: rgba(52,172,224,.22); }

    @keyframes tilePop{
      0%{opacity:0; transform: translateY(18px) scale(.94);}
      68%{opacity:1; transform: translateY(-2px) scale(1.02);}
      100%{opacity:1; transform: translateY(0) scale(1);}
    }

    .kpiWrap{
      margin-top:18px;
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
      gap:12px;
    }

    .kpiCard{
      border:1px solid var(--stroke);
      border-radius:18px;
      padding:12px 14px;
      background:linear-gradient(170deg, #fff, rgba(246,247,251,.94));
      box-shadow:0 12px 24px rgba(15,23,42,.06);
      display:flex;
      align-items:flex-start;
      gap:10px;
    }

    .kpiBadge{
      width:28px;
      height:28px;
      border-radius:10px;
      display:grid;
      place-items:center;
      background:var(--accent-soft);
      color:var(--accent);
      font-size:14px;
      font-weight:900;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
    }

    .kpiText{
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .kpiTitle{
      margin:0;
      font-size:13.4px;
      font-weight:900;
      color:rgba(12,16,26,.86);
    }

    .kpiValue{
      margin:0;
      font-size:12.8px;
      color:var(--muted);
      font-weight:760;
    }

    .footer{
      padding:18px 10px calc(12px + var(--safe-bot));
      display:flex;
      justify-content:center;
      gap:14px;
      flex-wrap:wrap;
      font-size:12.6px;
      font-weight:760;
      color:rgba(12,16,26,.62);
      border-top:1px solid rgba(12,16,26,.06);
      margin-top:20px;
    }

    .footer a,
    .footer button{
      color:inherit;
      text-decoration:none;
      background:none;
      border:none;
      padding:0;
      cursor:pointer;
      transition:color .12s ease;
    }

    .footer a:hover,
    .footer button:hover{color:rgba(10,132,255,.9);}

    @media (max-width: 720px){
      .wrap{width:calc(100vw - 24px);}    
      .hero{padding: calc(18px + var(--safe-top)) 0 12px;}
      .heroBar{flex-direction:column; align-items:flex-start; padding-bottom:20px;}
      .logo{width:120px; height:auto; max-width:72vw;}
      .h1{font-size:34px;}
      .subtitle{font-size:15px;}
      .profile{align-self:flex-end;}
      .searchRow{margin-top:4px;}
      .grid{grid-template-columns:repeat(2, minmax(0, 1fr));}
    }

    @media (max-width: 520px){
      .wrap{width:calc(100vw - 20px);}   
      .logo{width:136px;}
      .h1{font-size:32px;}
      .subtitle{font-size:14.4px;}
      .tagline{font-size:13.4px;}
      .profile{align-self:stretch; width:100%; justify-content:flex-end;}
      .panelCard{padding:18px 14px;}
      .grid{grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px;}
      .tile{min-height:148px;}
    }

    @media (min-width: 900px){
      .grid{grid-template-columns:repeat(3, minmax(0, 1fr));}
    }

    @media (min-width: 1100px){
      .grid{grid-template-columns:repeat(4, minmax(0, 1fr));}
    }

    @media (prefers-reduced-motion: reduce){
      .tile{animation:none; opacity:1; transform:none;}
    }
  



/* === Auth Overlay (pagina chiusa finché non loggato) === */
body.locked{ overflow:hidden; }
body.locked .hero, body.locked .panel, body.locked .footer{ display:none; }

.authOverlay{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:calc(18px + var(--safe-top)) calc(14px + var(--safe-right)) calc(18px + var(--safe-bot)) calc(14px + var(--safe-left));
  background:rgba(0,0,0,.45);
  backdrop-filter:saturate(160%) blur(16px);
  -webkit-backdrop-filter:saturate(160%) blur(16px);
  overscroll-behavior:contain;
}

.authCard{
  width:min(520px, 100%);
  border-radius:22px;
  background:rgba(255,255,255,.92);
  border:1px solid rgba(0,0,0,.10);
  box-shadow:0 30px 90px rgba(0,0,0,.24);
  padding:16px;
}

.authTop{ display:flex; gap:14px; align-items:center; margin-bottom:12px; }
.authLogo{
  width:46px; height:46px; border-radius:16px;
  display:grid; place-items:center;
  font-weight:900; letter-spacing:.4px;
  background:rgba(10,132,255,.14);
  border:1px solid rgba(10,132,255,.28);
  color:rgba(10,132,255,.92);
}

.authTitle{ font-weight:900; font-size:18px; color:rgba(12,16,26,.92); }
.authSub{ opacity:.78; font-size:13px; margin-top:2px; color:rgba(12,16,26,.86); }

.authActions{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }

.primaryBtn{
  width:100%;
  border:1px solid rgba(0,0,0,.10);
  border-radius:16px;
  padding:12px 14px;
  font-weight:900;
  background:rgba(255,255,255,.92);
  color:rgba(12,16,26,.92);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.92), 0 14px 28px rgba(15,23,42,.08);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.primaryBtn:hover{ filter:brightness(1.01); }
.primaryBtn:active{ transform:translateY(1px); }

.ghostBtn{
  width:100%;
  border-radius:16px;
  padding:11px 14px;
  border:1px solid rgba(0,0,0,.10);
  background:rgba(255,255,255,.72);
  color:rgba(12,16,26,.82);
  cursor:pointer;
}
.ghostBtn:active{ transform:translateY(1px); }

.gIcon{ display:inline-flex; align-items:center; justify-content:center; }
.gIcon svg{ display:block; width:18px; height:18px; }

.authMsg{ margin-top:12px; font-size:13px; color:rgba(12,16,26,.82); min-height:18px; font-weight:750; }

/* Pulsanti tile come bottoni */
button.tile{
  font:inherit;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
}

/* === Modal: Linea Liquidi Automatica === */
.modalOverlay{
  position:fixed;
  inset:0;
  z-index:9990;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:calc(14px + var(--safe-top)) calc(12px + var(--safe-right)) calc(14px + var(--safe-bot)) calc(12px + var(--safe-left));
  background:rgba(0,0,0,.45);
  backdrop-filter:saturate(160%) blur(16px);
  -webkit-backdrop-filter:saturate(160%) blur(16px);
  opacity:0;
  pointer-events:none;
  transform:translateY(10px);
  transition:opacity .22s ease, transform .22s ease;
  overscroll-behavior:contain;
}

.modalOverlay[aria-hidden="false"]{
  opacity:1;
  pointer-events:auto;
  transform:translateY(0);
}

.modalShell{
  width:min(760px, 100%);
  background:rgba(255,255,255,.94);
  border:1px solid rgba(0,0,0,.10);
  border-radius:24px;
  box-shadow:0 30px 90px rgba(0,0,0,.26);
  padding:14px;
  max-height:min(86dvh, calc(100dvh - 26px));
  overflow:auto;
  -webkit-overflow-scrolling:touch;
}

.modalHead{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  padding:2px 2px 10px;
}

.modalTitle{
  font-size:18px;
  font-weight:950;
  letter-spacing:-.01em;
  color:rgba(12,16,26,.94);
}
.modalSub{
  margin-top:3px;
  font-size:13px;
  font-weight:760;
  color:rgba(12,16,26,.66);
}

.iconBtn{
  border:1px solid rgba(0,0,0,.10);
  background:rgba(255,255,255,.85);
  border-radius:14px;
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 10px 20px rgba(15,23,42,.08);
}
.iconBtn:active{ transform:translateY(1px); }

.modalGrid{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:12px;
}

.modalTile{
  position:relative;
  border:1px solid rgba(0,0,0,.10);
  border-radius:22px;
  padding:14px 12px 16px;
  background:linear-gradient(180deg, rgba(255,255,255,.95), rgba(246,247,251,.92));
  text-decoration:none;
  color:rgba(12,16,26,.92);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  min-height:170px;
  box-shadow:0 14px 28px rgba(15,23,42,.08);
  user-select:none;
  transition:transform .16s cubic-bezier(.22,.61,.36,1), box-shadow .18s ease, filter .18s ease;
}

.modalTile:active{
  transform:translateY(2px);
  box-shadow:0 10px 20px rgba(15,23,42,.10);
  filter:brightness(.99);
}

.modalIcon{
  --g1: rgba(10,132,255,.96);
  --g2: rgba(64,156,255,.46);
  --strokeC: rgba(10,132,255,.56);
  --glowC: rgba(10,132,255,.22);
  width:92px;
  height:92px;
  border-radius:26px;
  display:grid;
  place-items:center;
  background:linear-gradient(160deg, var(--g1), var(--g2));
  border:1px solid var(--strokeC);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.86), 0 18px 34px rgba(15,23,42,.10), 0 18px 34px var(--glowC);
}

.modalTile.is-write .modalIcon{
  --g1: rgba(255,149,0,.96);
  --g2: rgba(255,200,105,.50);
  --strokeC: rgba(255,149,0,.58);
  --glowC: rgba(255,149,0,.22);
}

.modalIcon svg{
  width:46px;
  height:46px;
  stroke:#fff;
  stroke-width:1.8;

<script type="module">
// === Firebase Auth + ruoli (member/admin) ===
const firebaseConfig = {
  apiKey: "AIzaSyBiyB4pilnPpVj8vImD4PI6LF2_RtyDnv4",
  authDomain: "tabellone-produzione-liv-e313e.firebaseapp.com",
  projectId: "tabellone-produzione-liv-e313e",
  storageBucket: "tabellone-produzione-liv-e313e.firebasestorage.app",
  messagingSenderId: "537555699968",
  appId: "1:537555699968:web:4d04cb9596b67bfb0e4be5"
};

const $ = (id)=>document.getElementById(id);

const overlay = $("authOverlay");
const authMsg = $("authMsg");
const btnGoogle = $("btnGoogle");
const btnReload = $("btnReload");
const btnReset = $("btnReset");
const btnSignOutOverlay = $("btnSignOutOverlay");
const btnSignOut = $("btnSignOut");
const authSpinner = $("authSpinner");
const authSpinText = $("authSpinText");


const userNameEl = $("userName");
const statusEl = document.querySelector(".status span:last-child");
// Anti long-press / selezione / copia
(function hardenInteractions(){
  const stop = (e)=>{ try{ e.preventDefault(); }catch(_){} try{ e.stopPropagation(); }catch(_){} return false; };
  document.addEventListener("contextmenu", stop, { capture:true });
  document.addEventListener("selectstart", stop, { capture:true });
  document.addEventListener("copy", stop, { capture:true });
  document.addEventListener("cut", stop, { capture:true });
  document.addEventListener("paste", stop, { capture:true });
  document.addEventListener("dragstart", stop, { capture:true });
})();

// Navigazione tile (bottoni, niente preview iOS)
document.querySelectorAll('button.tile[data-href]').forEach((btn)=>{
  btn.addEventListener("click", ()=>{
    const href = btn.getAttribute("data-href");
    if(href) location.href = href;
  });
});


function lockPage(lock){
  document.body.classList.toggle("locked", !!lock);
  if(lock){
    overlay.hidden = false;
  }else{
    overlay.hidden = true;
  }
}

function setMsg(msg){
  authMsg.textContent = msg || "";
}

function setSpin(text){
  if(authSpinText) authSpinText.textContent = text || "Verifica accesso…";
}

function showOverlayState(state){
  // state: "checking" | "login" | "working" | "error" | "noaccess"
  const showSpinner = (state === "checking" || state === "working");
  if(authSpinner) authSpinner.style.display = showSpinner ? "flex" : "none";

  btnGoogle.style.display = (state === "login") ? "" : "none";
  btnReload.style.display = (state === "error") ? "" : "none";
  btnReset.style.display = (state === "login" || state === "error" || state === "noaccess") ? "" : "none";
  btnSignOutOverlay.style.display = (state === "noaccess") ? "" : "none";
}







lockPage(true);
showOverlayState("checking");
setSpin("Verifica sessione…");
setMsg("");

// Init Firebase (dynamic import, come negli altri hub)
let app, auth, db, authMod, fsMod;
const providerInit = async ()=>{
  const [{ initializeApp }, _authMod, _fsMod] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js"),
    import("https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js"),
  ]);
  authMod = _authMod;
  fsMod = _fsMod;

  app = initializeApp(firebaseConfig);
  auth = authMod.getAuth(app);
  db = fsMod.getFirestore(app);

  // Prova a impostare la persistenza migliore disponibile (aiuta moltissimo su iOS/PWA)
  async function setBestAuthPersistence(){
    const attempts = [
      authMod.indexedDBLocalPersistence,
      authMod.browserLocalPersistence,
      authMod.browserSessionPersistence
    ].filter(Boolean);
    for(const p of attempts){
      try{ await authMod.setPersistence(auth, p); return true; }catch(_e){}
    }
    return false;
  }
  try{ await setBestAuthPersistence(); }catch(_e){}

  // Login marker (per capire se un redirect è rimasto "bloccato")
  const LOGIN_FLAG = "gc_login_in_progress_v1";
  const markLoginStart = ()=>{ try{ sessionStorage.setItem(LOGIN_FLAG, String(Date.now())); }catch(_e){} };
  const clearLoginFlag = ()=>{ try{ sessionStorage.removeItem(LOGIN_FLAG); }catch(_e){} };

  // Reset duro (risolve stato auth corrotto su iOS/PWA senza dover reinstallare la web-app)
  async function hardResetAuthStorage(){
    showOverlayState("working");
    setSpin("Ripristino accesso…");
    setMsg("");
    try{ await authMod.signOut(auth); }catch(_e){}

    // localStorage: rimuovi chiavi Firebase/Auth
    try{
      const keys = [];
      for(let i=0;i<localStorage.length;i++){ keys.push(localStorage.key(i)); }
      keys.filter(k=>k && (k.startsWith("firebase:") || k.includes("firebase") || k.startsWith("gc_") || k.startsWith("hub_")) )
          .forEach(k=>{ try{ localStorage.removeItem(k); }catch(_e){} });
    }catch(_e){}

    // sessionStorage
    try{ sessionStorage.clear(); }catch(_e){}

    // indexedDB: elimina DB usati da Firebase (best-effort)
    async function delDb(name){
      return await new Promise((res)=>{
        try{
          const req = indexedDB.deleteDatabase(name);
          req.onsuccess = ()=>res(true);
          req.onerror = ()=>res(false);
          req.onblocked = ()=>res(false);
        }catch(_e){ res(false); }
      });
    }
    try{
      await delDb("firebaseLocalStorageDb");
      await delDb("firebase-installations-database");
      await delDb("firebase-heartbeat-database");
    }catch(_e){}

    // reload pulito
    try{ location.replace(location.pathname + location.search); }catch(_e){ location.reload(); }
  }
  btnReset?.addEventListener("click", hardResetAuthStorage);

  const googleProvider = new authMod.GoogleAuthProvider();
  try{ googleProvider.setCustomParameters({ prompt: "select_account" }); }catch(_e){}

  const ua = navigator.userAgent || "";
  const isIOS = /iPad|iPhone|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isStandalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || (navigator.standalone === true);
  const preferRedirect = isIOS || isStandalone;

  async function signInWithGoogle(){
    setMsg("");
    showOverlayState("working");
    setSpin("Apertura accesso Google…");

    // refresh persistence prima di login (iOS/PWA)
    try{ await setBestAuthPersistence(); }catch(_e){}

    // marker per diagnosi/recupero redirect
    markLoginStart();

    try{
      // Popup first (più "app-like"), fallback a redirect se bloccato/non supportato
      try{
        await authMod.signInWithPopup(auth, googleProvider);
        clearLoginFlag();
        return;
      }catch(err){
        const code = String(err?.code || "");
        const msg = String(err?.message || "").toLowerCase();
        const popupIssue = code.includes("popup") || msg.includes("popup");
        const notSupported = code.includes("operation-not-supported-in-this-environment") || code.includes("web-storage-unsupported");
        if(popupIssue || notSupported){
          await authMod.signInWithRedirect(auth, googleProvider);
          return;
        }
        throw err;
      }
    }catch(err){
      console.error(err);
      setMsg("Non riesco ad aprire l'accesso Google. Premi Ripristina accesso oppure riprova.");
      showOverlayState("error");
    }
  }


  btnGoogle?.addEventListener("click", signInWithGoogle);
  btnReload?.addEventListener("click", ()=>location.reload());


  // Sign out
  async function doSignOut(){
    try{ await authMod.signOut(auth); }catch(_e){}
    try{ clearLoginFlag(); }catch(_e){}
  }
  btnSignOut?.addEventListener("click", doSignOut);
  btnSignOutOverlay?.addEventListener("click", doSignOut);

  // Anti-flash: evita il bottone Google che appare/sparisce su iOS mentre la sessione si ripristina
  let __loginRevealTimer = null;

  // helper: leggi access doc (uid o emailLower)
  async function getAccess(docId){
    try{
      const ref = fsMod.doc(db, "powderUsers", docId);
      const snap = await fsMod.getDoc(ref);
      if(!snap.exists()) return null;
      const data = snap.data() || {};
      if(data.enabled === false) return null;
      return data;
    }catch(e){
      // permessi o rete
      console.warn("getAccess error", e);
      return null;
    }
  }

  async function resolveRole(user){
    const uid = user?.uid || "";
    const emailLower = (user?.email || "").toLowerCase();

    let data = null;
    if(uid) data = await getAccess(uid);
    if(!data && emailLower) data = await getAccess(emailLower);

    if(!data) return { isMember:false, isAdmin:false };
    return { isMember:true, isAdmin: data.isAdmin === true };
  }

  // Auth listener
  authMod.onAuthStateChanged(auth, async (user)=>{
    if(!user){
      // not signed in: prima "checking", poi mostra login (anti-flash iOS/PWA)
      if(userNameEl) userNameEl.textContent = "—";
      if(statusEl) statusEl.textContent = "Non connesso";
      lockPage(true);
      showOverlayState("checking");
      setSpin("Verifica sessione…");
      setMsg("");

      // Se era partito un login via redirect e non è andato a buon fine, proponi reset
      try{
        const ts = parseInt(sessionStorage.getItem(LOGIN_FLAG) || "0", 10);
        if(ts && (Date.now() - ts) > 15000){
          setMsg("Login non completato. Premi Ripristina accesso e riprova.");
          showOverlayState("login");
          return;
        }
      }catch(_e){}

      if(__loginRevealTimer) clearTimeout(__loginRevealTimer);
      __loginRevealTimer = setTimeout(()=>{
        try{
          if(!auth.currentUser){
            showOverlayState("login");
            setSpin("");
          }
        }catch(_e){
          showOverlayState("login");
          setSpin("");
        }
      }, 650);
      return;
    }

    // Signed in: check role
    lockPage(true);
    showOverlayState("checking");
    setSpin("Verifica permessi…");
    const displayName = user.displayName || user.email || "Utente";
    if(userNameEl) userNameEl.textContent = displayName;
    if(statusEl) statusEl.textContent = "Connesso";

    // Assicura token pronto (iOS/PWA) prima di leggere Firestore
try{ await user.getIdToken(); }catch(_e){}

// Verifica ruoli con piccoli retry (rete/iOS)
let role = await resolveRole(user);
if(!role.isMember){
  await new Promise(r=>setTimeout(r, 350));
  role = await resolveRole(user);
}
if(!role.isMember){
  await new Promise(r=>setTimeout(r, 650));
  role = await resolveRole(user);
}

if(!role.isMember){

      // Signed in but not authorized
      lockPage(true);
      showOverlayState("noaccess");
      setMsg("Accesso non autorizzato per questo account. Contatta l’amministratore.");
      // Nascondi anche eventuali tile admin
      document.querySelectorAll("[data-admin-only]").forEach(el=>el.style.display="none");
      return;
    }

    // Authorized
    lockPage(false);
    setMsg("");


    // Admin-only tile
    document.querySelectorAll("[data-admin-only]").forEach(el=>{
      el.style.display = role.isAdmin ? "" : "none";
    });
  });

  // Se siamo arrivati da redirect login
try{
  await authMod.getRedirectResult(auth);
  clearLoginFlag();
}catch(e){
  const code = String(e?.code || "");
  // Se il redirect si è "incastrato" (tipico iOS/PWA), guida al reset
  if(code.includes("redirect") || code.includes("web-storage-unsupported")){
    console.warn("redirect result", e);
    setMsg("Problema durante l’accesso. Premi Ripristina accesso e riprova.");
    showOverlayState("login");
  }
}
};

providerInit().catch((e)=>{
  console.error(e);
  setMsg("Errore di inizializzazione. Ricarica la pagina.");
  showOverlayState("error");
});
</script></body>
