<!doctype html>
<html lang="it" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#04070f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Estrusore 1LT" />
  <title>ESTRUSORE BOTTIGLIA AGRO 1 LT</title>
   <script defer src="/public1/gc_back_to_index.js" data-back-href="./index.html" data-back-label="Indietro"></script>
  <style>
    :root{
      --bg:#04070f;
      --bg-2:#0a1020;
      --card:#0a1224;
      --card-2:#0d1830;
      --ink:#e6f4ff;
      --ink-soft:#c5dff0;
      --muted:#5d7a99;
      --muted-2:#3a5570;
      --line:rgba(0,217,255,.14);
      --line-strong:rgba(0,217,255,.28);
      --cyan:#00d9ff;
      --cyan-soft:#7dE9ff;
      --cyan-dark:#00b8e6;
      --magenta:#ff2d92;
      --green:#4ade80;
      --amber:#f59e0b;
      --red:#ef4444;
      --mono:ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Monaco, Consolas, monospace;
      --shadow-sm:0 4px 12px rgba(0,0,0,.30);
      --shadow:0 18px 48px rgba(0,0,0,.40);
      --shadow-lg:0 28px 72px rgba(0,0,0,.50);
      --radius:18px;
      --safe-top:env(safe-area-inset-top);
      --safe-bottom:env(safe-area-inset-bottom);
      --max:860px;
    }

    *{ box-sizing:border-box; }
    html{
      /* Solid dark base so iOS rubber-band / overscroll never shows white */
      background-color:#04070f;
    }
    html,body{
      margin:0;
      min-height:100%;
      background:
        radial-gradient(1200px 520px at 6% -10%, rgba(0,217,255,.14), transparent 60%),
        radial-gradient(900px 520px at 104% 6%, rgba(255,45,146,.10), transparent 62%),
        radial-gradient(800px 800px at 50% 120%, rgba(0,217,255,.06), transparent 62%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color:var(--ink);
      font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    /* Painted panel that sits behind the iOS status bar / safe-area inset
       so the area above the page content blends with the topbar instead
       of showing white. Uses a fixed positioned strip pinned to the very top. */
    body::after{
      content:"";
      position:fixed;
      top:0; left:0; right:0;
      height:env(safe-area-inset-top);
      background:
        radial-gradient(900px 360px at 0% 0%, rgba(0,217,255,.16), transparent 60%),
        linear-gradient(135deg, #060a14 0%, #0c1426 60%, #060a14 100%);
      z-index:200;
      pointer-events:none;
      border-bottom:1px solid rgba(0,217,255,.12);
      box-shadow:0 1px 0 rgba(0,217,255,.05);
    }

    /* Ambient grid covering whole page (subtle) */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(rgba(0,217,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,217,255,.025) 1px, transparent 1px);
      background-size:32px 32px;
      pointer-events:none;
      z-index:0;
      mask-image:radial-gradient(ellipse 100% 80% at 50% 30%, #000 35%, transparent 100%);
      -webkit-mask-image:radial-gradient(ellipse 100% 80% at 50% 30%, #000 35%, transparent 100%);
    }

    body{
      padding:calc(16px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
      position:relative;
    }

    .shell{
      max-width:var(--max);
      margin:0 auto;
      display:grid;
      gap:16px;
      position:relative;
      z-index:1;
    }

    /* ============ TOPBAR — CYBER HUD ============ */
    .topbar{
      position:relative;
      overflow:hidden;
      background:
        radial-gradient(900px 360px at 0% 0%, rgba(0,217,255,.12), transparent 55%),
        radial-gradient(700px 360px at 100% 100%, rgba(255,45,146,.10), transparent 60%),
        linear-gradient(135deg, #060a14 0%, #0c1426 50%, #060a14 100%);
      border:1px solid rgba(0,217,255,.22);
      border-radius:22px;
      padding:24px 26px;
      display:flex;
      align-items:stretch;
      justify-content:space-between;
      gap:22px;
      flex-wrap:wrap;
      box-shadow:
        0 28px 72px rgba(0,217,255,.06),
        0 4px 14px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(0,217,255,.20),
        inset 0 -1px 0 rgba(0,0,0,.45);
      isolation:isolate;
      color:#e6f4ff;
      font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .topbar-grid{
      position:absolute;
      inset:0;
      background-image:
        linear-gradient(rgba(0,217,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,217,255,.05) 1px, transparent 1px);
      background-size:24px 24px;
      background-position:-1px -1px;
      pointer-events:none;
      mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, #000 25%, transparent 95%);
      -webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, #000 25%, transparent 95%);
      z-index:0;
    }

    .topbar-scanline{
      position:absolute;
      left:0; right:0; top:0;
      height:2px;
      background:linear-gradient(90deg,
        transparent 0%,
        rgba(0,217,255,0) 12%,
        rgba(0,217,255,.85) 50%,
        rgba(0,217,255,0) 88%,
        transparent 100%);
      filter:blur(1px);
      animation:scan 5s ease-in-out infinite;
      pointer-events:none;
      z-index:1;
      will-change:transform, opacity;
    }

    @keyframes scan{
      0%   { transform:translateY(0);   opacity:.25; }
      45%  { transform:translateY(120%); opacity:.95; }
      55%  { transform:translateY(120%); opacity:.95; }
      100% { transform:translateY(0);   opacity:.25; }
    }

    .topbar-corner{
      position:absolute;
      width:18px;
      height:18px;
      border:1.5px solid #00d9ff;
      pointer-events:none;
      z-index:2;
      box-shadow:0 0 12px rgba(0,217,255,.45);
      filter:drop-shadow(0 0 4px rgba(0,217,255,.4));
    }
    .topbar-corner--tl{ top:8px;    left:8px;    border-right:0; border-bottom:0; border-top-left-radius:6px; }
    .topbar-corner--tr{ top:8px;    right:8px;   border-left:0;  border-bottom:0; border-top-right-radius:6px; }
    .topbar-corner--bl{ bottom:8px; left:8px;    border-right:0; border-top:0;    border-bottom-left-radius:6px; }
    .topbar-corner--br{ bottom:8px; right:8px;   border-left:0;  border-top:0;    border-bottom-right-radius:6px; }

    /* ----- Brand ----- */
    .brand{
      position:relative;
      z-index:3;
      display:flex;
      align-items:center;
      gap:18px;
      min-width:0;
      flex:1 1 auto;
    }

    .brand-icon{
      width:78px;
      height:78px;
      flex:0 0 78px;
      border:1px solid rgba(0,217,255,.45);
      border-radius:14px;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 30% 22%, rgba(0,217,255,.28), rgba(0,217,255,0) 50%),
        linear-gradient(155deg, rgba(0,217,255,.14), rgba(2,12,28,.55) 60%, rgba(0,217,255,.06));
      position:relative;
      box-shadow:
        inset 0 1px 0 rgba(0,217,255,.32),
        inset 0 0 18px rgba(0,217,255,.10),
        0 0 22px rgba(0,217,255,.18),
        0 0 4px rgba(0,217,255,.30);
    }

    .brand-icon::before{
      content:"";
      position:absolute;
      inset:6px;
      border:1px dashed rgba(0,217,255,.22);
      border-radius:10px;
      pointer-events:none;
    }

    .brand-icon::after{
      content:"";
      position:absolute;
      inset:-1px;
      border-radius:14px;
      padding:1px;
      background:linear-gradient(135deg, rgba(0,217,255,.55), transparent 45%, rgba(255,45,146,.35));
      -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;
              mask-composite:exclude;
      pointer-events:none;
    }

    .brand-icon svg{
      width:44px;
      height:44px;
      display:block;
      position:relative;
      z-index:1;
      filter:
        hue-rotate(-26deg)
        saturate(1.5)
        brightness(1.45)
        drop-shadow(0 0 6px rgba(0,217,255,.55))
        drop-shadow(0 0 2px rgba(0,217,255,.85));
    }

    .brand-title{
      min-width:0;
      flex:1 1 auto;
      display:flex;
      flex-direction:column;
      gap:8px;
      align-items:flex-start;
    }

    .brand-meta-top{
      display:flex;
      align-items:center;
      gap:10px;
      font-family:ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Monaco, Consolas, monospace;
      font-size:10px;
      font-weight:800;
      letter-spacing:.16em;
      text-transform:uppercase;
      flex-wrap:wrap;
    }

    .brand-tag{
      padding:3px 9px;
      border:1px solid rgba(0,217,255,.35);
      border-radius:4px;
      background:rgba(0,217,255,.08);
      color:#7dE9ff;
      text-shadow:0 0 6px rgba(0,217,255,.50);
      box-shadow:inset 0 1px 0 rgba(0,217,255,.15);
    }

    .brand-status{
      display:inline-flex;
      align-items:center;
      gap:7px;
      color:rgba(74,222,128,.95);
      text-shadow:0 0 6px rgba(34,197,94,.50);
    }

    .status-dot{
      width:7px;
      height:7px;
      border-radius:999px;
      background:#4ade80;
      box-shadow:
        0 0 8px rgba(74,222,128,.95),
        0 0 0 2px rgba(74,222,128,.20);
      animation:blink 1.6s ease-in-out infinite;
    }

    @keyframes blink{
      0%, 70%, 100% { opacity:1; }
      35%, 50%      { opacity:.30; }
    }

    h1{
      margin:0;
      font-size:clamp(20px, 3vw, 30px);
      line-height:1.05;
      letter-spacing:.005em;
      text-wrap:balance;
      color:#ffffff;
      font-weight:900;
      text-shadow:
        0 0 14px rgba(0,217,255,.45),
        0 0 3px rgba(0,217,255,.65),
        0 1px 0 rgba(0,0,0,.30);
      background:none;
      -webkit-background-clip:border-box;
      background-clip:border-box;
    }

    .brand-meta-bottom{
      display:flex;
      align-items:center;
      gap:10px;
      font-family:ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Monaco, Consolas, monospace;
      font-size:11px;
      font-weight:700;
      letter-spacing:.10em;
      flex-wrap:wrap;
    }

    .brand-id{
      color:rgba(125,233,255,.80);
      text-shadow:0 0 6px rgba(0,217,255,.30);
    }

    .brand-divider{
      color:rgba(0,217,255,.30);
    }

    .brand-uom{
      color:rgba(230,244,255,.55);
    }

    /* ----- Right side: readout + login ----- */
    .topbar-readout{
      position:relative;
      z-index:3;
      display:flex;
      align-items:stretch;
      gap:12px;
      flex:0 0 auto;
    }

    .readout-panel{
      position:relative;
      border:1px solid rgba(0,217,255,.32);
      border-radius:12px;
      padding:11px 18px 12px 16px;
      background:
        linear-gradient(180deg, rgba(0,217,255,.08), rgba(0,217,255,.02));
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:5px;
      min-width:200px;
      box-shadow:
        inset 0 1px 0 rgba(0,217,255,.18),
        inset 0 0 22px rgba(0,217,255,.06),
        0 0 14px rgba(0,217,255,.10);
    }

    .readout-panel::before,
    .readout-panel::after{
      content:"";
      position:absolute;
      width:9px;
      height:9px;
      border-color:#00d9ff;
      filter:drop-shadow(0 0 3px rgba(0,217,255,.7));
    }
    .readout-panel::before{
      top:-1px; left:-1px;
      border-top:1.5px solid;
      border-left:1.5px solid;
    }
    .readout-panel::after{
      bottom:-1px; right:-1px;
      border-bottom:1.5px solid;
      border-right:1.5px solid;
    }

    .readout-label{
      display:inline-flex;
      align-items:center;
      gap:7px;
      font-family:ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Monaco, Consolas, monospace;
      font-size:9px;
      font-weight:900;
      letter-spacing:.20em;
      text-transform:uppercase;
      color:rgba(125,233,255,.78);
    }

    .readout-label-dot{
      width:5px;
      height:5px;
      border-radius:999px;
      background:#00d9ff;
      box-shadow:0 0 6px rgba(0,217,255,.95), 0 0 0 2px rgba(0,217,255,.20);
      flex:0 0 5px;
    }

    .readout-value{
      display:flex;
      align-items:baseline;
      gap:7px;
    }

    .readout-digits{
      font-family:ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Monaco, Consolas, monospace;
      font-size:26px;
      font-weight:900;
      letter-spacing:-.01em;
      color:#7dE9ff;
      font-variant-numeric:tabular-nums;
      line-height:1;
      text-shadow:
        0 0 12px rgba(0,217,255,.55),
        0 0 3px rgba(0,217,255,.85);
    }

    .readout-unit{
      font-family:ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Monaco, Consolas, monospace;
      font-size:11px;
      font-weight:800;
      letter-spacing:.16em;
      color:rgba(0,217,255,.55);
      text-transform:uppercase;
    }

    /* ----- Cyber login button ----- */
    .top-actions{
      position:relative;
      z-index:3;
      display:flex;
      align-items:stretch;
      gap:10px;
    }

    .btn-cyber{
      appearance:none;
      position:relative;
      overflow:hidden;
      border:1px solid rgba(0,217,255,.50);
      background:linear-gradient(180deg, rgba(0,217,255,.20), rgba(0,217,255,.06));
      color:#7dE9ff;
      padding:0 22px;
      min-height:100%;
      border-radius:12px;
      font-family:ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Monaco, Consolas, monospace;
      font-size:13px;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      text-shadow:0 0 8px rgba(0,217,255,.65);
      box-shadow:
        inset 0 1px 0 rgba(0,217,255,.22),
        inset 0 0 22px rgba(0,217,255,.10),
        0 0 14px rgba(0,217,255,.12);
      transition:background .14s ease, border-color .14s ease, box-shadow .14s ease, transform .14s ease, color .14s ease;
    }

    .btn-cyber::before{
      content:"";
      position:absolute;
      top:0;
      left:-60%;
      width:50%;
      height:100%;
      background:linear-gradient(105deg, rgba(125,233,255,0) 0%, rgba(125,233,255,.30) 50%, rgba(125,233,255,0) 100%);
      transform:skewX(-18deg);
      pointer-events:none;
      transition:left .9s ease;
    }

    .btn-cyber:hover{
      background:linear-gradient(180deg, rgba(0,217,255,.32), rgba(0,217,255,.12));
      border-color:rgba(0,217,255,.85);
      color:#bff5ff;
      box-shadow:
        inset 0 1px 0 rgba(0,217,255,.32),
        inset 0 0 24px rgba(0,217,255,.20),
        0 0 26px rgba(0,217,255,.32);
    }
    .btn-cyber:hover::before{ left:120%; }
    .btn-cyber:active{ transform:scale(.985); }
    .btn-cyber:disabled{ opacity:.5; cursor:not-allowed; }

    .btn-cyber-bracket{
      color:rgba(0,217,255,.65);
      font-weight:700;
    }

    /* ============ BUTTONS (modal) ============ */
    .btn{
      appearance:none;
      position:relative;
      overflow:hidden;
      border:1px solid var(--line-strong);
      background:linear-gradient(180deg, rgba(13,24,48,.85), rgba(8,16,32,.90));
      color:var(--ink-soft);
      min-height:48px;
      padding:0 20px;
      border-radius:12px;
      font-family:var(--mono);
      font-size:12px;
      font-weight:900;
      letter-spacing:.16em;
      text-transform:uppercase;
      cursor:pointer;
      box-shadow:
        inset 0 1px 0 rgba(0,217,255,.12),
        0 4px 12px rgba(0,0,0,.30);
      transition:transform .14s ease, filter .14s ease, background .14s ease, border-color .14s ease, color .14s ease, box-shadow .14s ease;
    }
    .btn:hover{
      border-color:rgba(0,217,255,.55);
      color:var(--cyan-soft);
      box-shadow:
        inset 0 1px 0 rgba(0,217,255,.20),
        0 6px 16px rgba(0,217,255,.14);
    }
    .btn:active{ transform:scale(.985); }
    .btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; filter:saturate(.5); }

    .btn-primary{
      background:linear-gradient(180deg, rgba(0,217,255,.22), rgba(0,217,255,.08));
      border-color:rgba(0,217,255,.55);
      color:var(--cyan-soft);
      text-shadow:0 0 8px rgba(0,217,255,.55);
      box-shadow:
        inset 0 1px 0 rgba(0,217,255,.30),
        inset 0 0 22px rgba(0,217,255,.10),
        0 0 16px rgba(0,217,255,.18);
    }
    .btn-primary:hover{
      background:linear-gradient(180deg, rgba(0,217,255,.34), rgba(0,217,255,.14));
      border-color:rgba(0,217,255,.85);
      color:#bff5ff;
      box-shadow:
        inset 0 1px 0 rgba(0,217,255,.40),
        inset 0 0 24px rgba(0,217,255,.20),
        0 0 28px rgba(0,217,255,.34);
    }

    /* ============ SECTIONS ============ */
    .section{
      position:relative;
      background:
        linear-gradient(180deg, rgba(10,18,36,.92) 0%, rgba(8,14,28,.94) 100%);
      border:1px solid rgba(0,217,255,.18);
      border-radius:18px;
      box-shadow:
        var(--shadow),
        inset 0 1px 0 rgba(0,217,255,.10),
        inset 0 -1px 0 rgba(0,0,0,.40);
      padding:22px;
      display:grid;
      gap:16px;
      isolation:isolate;
      overflow:hidden;
    }

    .section::before{
      content:"";
      position:absolute;
      inset:0;
      background-image:
        linear-gradient(rgba(0,217,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,217,255,.025) 1px, transparent 1px);
      background-size:24px 24px;
      pointer-events:none;
      mask-image:radial-gradient(ellipse 90% 90% at 50% 50%, #000 30%, transparent 100%);
      -webkit-mask-image:radial-gradient(ellipse 90% 90% at 50% 50%, #000 30%, transparent 100%);
      z-index:0;
    }

    /* Top edge accent line — luminescent */
    .section::after{
      content:"";
      position:absolute;
      top:0;
      left:18px;
      right:18px;
      height:1px;
      background:linear-gradient(90deg, transparent, rgba(0,217,255,.45), transparent);
      pointer-events:none;
      z-index:1;
    }

    .section > *{ position:relative; z-index:2; }

    .section-title{
      margin:0;
      font-family:var(--mono);
      font-size:11px;
      font-weight:900;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:var(--cyan-soft);
      text-shadow:0 0 8px rgba(0,217,255,.40);
      display:flex;
      align-items:center;
      gap:10px;
    }

    .section-title::before{
      content:"";
      width:14px;
      height:1px;
      background:linear-gradient(90deg, transparent, rgba(0,217,255,.85));
      flex:0 0 14px;
    }

    .section-title::after{
      content:"";
      flex:1 1 auto;
      height:1px;
      background:linear-gradient(90deg, rgba(0,217,255,.30), transparent);
      min-width:40px;
    }

    /* ============ PRODUCE BUTTON ============ */
    .produce-wrap{
      display:grid;
      gap:12px;
    }

    .produce-btn{
      appearance:none;
      position:relative;
      overflow:hidden;
      width:100%;
      min-height:clamp(170px, 34vh, 270px);
      border:1px solid rgba(0,217,255,.55);
      border-radius:18px;
      padding:20px;
      text-align:center;
      font-family:var(--mono);
      font-size:clamp(28px, 5vw, 52px);
      line-height:1.04;
      font-weight:900;
      letter-spacing:.10em;
      cursor:pointer;
      color:#dffaff;
      background:
        radial-gradient(circle at 22% 14%, rgba(125,233,255,.30), rgba(0,217,255,0) 50%),
        radial-gradient(circle at 80% 110%, rgba(255,45,146,.18), rgba(0,0,0,0) 55%),
        linear-gradient(180deg, rgba(0,217,255,.30) 0%, rgba(0,184,230,.18) 50%, rgba(0,90,140,.18) 100%);
      text-shadow:
        0 0 16px rgba(0,217,255,.65),
        0 0 4px rgba(0,217,255,.85),
        0 1px 0 rgba(0,0,0,.40);
      box-shadow:
        inset 0 1px 0 rgba(0,217,255,.34),
        inset 0 0 40px rgba(0,217,255,.14),
        0 24px 56px rgba(0,217,255,.20),
        0 4px 14px rgba(0,0,0,.40);
      transition:transform .16s ease, filter .16s ease, opacity .16s ease, box-shadow .16s ease, color .16s ease;
    }

    /* Inner grid */
    .produce-btn::after{
      content:"";
      position:absolute;
      inset:0;
      background-image:
        linear-gradient(rgba(0,217,255,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,217,255,.06) 1px, transparent 1px);
      background-size:32px 32px;
      pointer-events:none;
      mask-image:radial-gradient(ellipse 90% 90% at 50% 50%, #000 25%, transparent 95%);
      -webkit-mask-image:radial-gradient(ellipse 90% 90% at 50% 50%, #000 25%, transparent 95%);
      z-index:0;
    }

    /* Shimmer sweep */
    .produce-btn::before{
      content:"";
      position:absolute;
      top:0;
      left:-60%;
      width:50%;
      height:100%;
      background:linear-gradient(105deg, rgba(125,233,255,0) 0%, rgba(125,233,255,.30) 50%, rgba(125,233,255,0) 100%);
      transform:skewX(-18deg);
      pointer-events:none;
      transition:left .9s ease;
      z-index:1;
    }

    .produce-btn:not(:disabled):hover::before{ left:120%; }

    .produce-btn:not(:disabled):hover{
      filter:brightness(1.06);
      transform:translateY(-2px);
      color:#fff;
      box-shadow:
        inset 0 1px 0 rgba(0,217,255,.40),
        inset 0 0 50px rgba(0,217,255,.20),
        0 30px 72px rgba(0,217,255,.30),
        0 6px 18px rgba(0,0,0,.45);
    }
    .produce-btn:not(:disabled):active{ transform:scale(.992) translateY(0); }
    .produce-btn:disabled{ opacity:.50; cursor:not-allowed; filter:saturate(.4); }

    /* Corner brackets on the produce button */
    .produce-btn-corner{
      position:absolute;
      width:14px;
      height:14px;
      border:1.5px solid rgba(0,217,255,.85);
      pointer-events:none;
      z-index:2;
      filter:drop-shadow(0 0 4px rgba(0,217,255,.55));
    }
    .produce-btn-corner--tl{ top:10px;    left:10px;    border-right:0; border-bottom:0; }
    .produce-btn-corner--tr{ top:10px;    right:10px;   border-left:0;  border-bottom:0; }
    .produce-btn-corner--bl{ bottom:10px; left:10px;    border-right:0; border-top:0; }
    .produce-btn-corner--br{ bottom:10px; right:10px;   border-left:0;  border-top:0; }

    .produce-btn:disabled .produce-btn-corner{ opacity:.5; }

    /* ============ CURRENT USER (terminal style) ============ */
    .current-user{
      min-height:42px;
      padding:11px 14px;
      border-radius:10px;
      background:linear-gradient(180deg, rgba(8,14,28,.85), rgba(6,10,22,.90));
      border:1px solid rgba(0,217,255,.16);
      font-family:var(--mono);
      font-size:13px;
      font-weight:700;
      letter-spacing:.04em;
      color:var(--muted);
      overflow-wrap:anywhere;
      display:flex;
      align-items:center;
      gap:10px;
      box-shadow:inset 0 1px 0 rgba(0,217,255,.06);
    }

    .current-user::before{
      content:">";
      color:var(--muted-2);
      font-weight:900;
      flex:0 0 auto;
      transition:color .25s ease, text-shadow .25s ease;
    }

    .current-user.is-online{
      color:var(--cyan-soft);
      border-color:rgba(0,217,255,.28);
    }

    .current-user.is-online::before{
      color:var(--green);
      text-shadow:0 0 8px rgba(74,222,128,.85);
    }

    /* ============ STOCK BOX (big digital readout) ============ */
    .stock-box{
      position:relative;
      min-height:130px;
      border-radius:14px;
      padding:24px 26px;
      background:
        radial-gradient(circle at 14% 14%, rgba(0,217,255,.10), rgba(0,217,255,0) 45%),
        linear-gradient(180deg, rgba(8,16,34,.92), rgba(6,12,26,.94));
      border:1px solid rgba(0,217,255,.30);
      box-shadow:
        inset 0 1px 0 rgba(0,217,255,.18),
        inset 0 0 26px rgba(0,217,255,.06),
        0 0 16px rgba(0,217,255,.10),
        0 8px 24px rgba(0,0,0,.40);
      display:grid;
      gap:8px;
      align-content:center;
      justify-items:start;
      overflow:hidden;
    }

    /* Corner ticks */
    .stock-box::before,
    .stock-box::after{
      content:"";
      position:absolute;
      width:12px;
      height:12px;
      border-color:#00d9ff;
      filter:drop-shadow(0 0 4px rgba(0,217,255,.6));
      pointer-events:none;
    }
    .stock-box::before{
      top:-1px; left:-1px;
      border-top:1.5px solid;
      border-left:1.5px solid;
    }
    .stock-box::after{
      bottom:-1px; right:-1px;
      border-bottom:1.5px solid;
      border-right:1.5px solid;
    }

    .stock-qty{
      font-family:var(--mono);
      font-size:clamp(40px, 7vw, 64px);
      line-height:1;
      font-weight:900;
      letter-spacing:-.02em;
      color:var(--cyan-soft);
      font-variant-numeric:tabular-nums;
      text-shadow:
        0 0 16px rgba(0,217,255,.55),
        0 0 4px rgba(0,217,255,.85);
    }

    .stock-meta{
      font-family:var(--mono);
      font-size:11px;
      font-weight:900;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:rgba(0,217,255,.60);
    }

    /* ============ MOVEMENTS (log lines) ============ */
    .movements{
      display:grid;
      gap:8px;
    }

    .movement{
      position:relative;
      background:linear-gradient(180deg, rgba(10,18,36,.85), rgba(8,14,28,.90));
      border:1px solid rgba(0,217,255,.14);
      border-radius:12px;
      padding:13px 16px 13px 18px;
      display:grid;
      gap:6px;
      box-shadow:inset 0 1px 0 rgba(0,217,255,.08), 0 4px 12px rgba(0,0,0,.25);
      transition:transform .14s ease, border-color .14s ease, box-shadow .14s ease, background .14s ease;
    }

    .movement::before{
      content:"";
      position:absolute;
      left:0;
      top:12px;
      bottom:12px;
      width:3px;
      border-radius:0 3px 3px 0;
      background:linear-gradient(180deg, var(--cyan), var(--cyan-dark));
      box-shadow:0 0 8px rgba(0,217,255,.50);
      opacity:.55;
      transition:opacity .14s ease;
    }

    .movement:hover{
      transform:translateY(-1px);
      border-color:rgba(0,217,255,.40);
      background:linear-gradient(180deg, rgba(12,22,42,.92), rgba(10,16,32,.95));
      box-shadow:inset 0 1px 0 rgba(0,217,255,.16), 0 8px 20px rgba(0,217,255,.10);
    }
    .movement:hover::before{ opacity:1; }

    .movement-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
    }

    .movement-qty{
      font-family:var(--mono);
      font-size:18px;
      font-weight:900;
      letter-spacing:.02em;
      font-variant-numeric:tabular-nums;
      color:var(--cyan-soft);
      text-shadow:0 0 8px rgba(0,217,255,.40);
    }

    .movement-user{
      font-family:var(--mono);
      font-size:12px;
      font-weight:700;
      letter-spacing:.04em;
      color:var(--ink-soft);
      text-align:right;
      overflow-wrap:anywhere;
    }

    .movement-date{
      font-family:var(--mono);
      font-size:11px;
      font-weight:600;
      letter-spacing:.06em;
      color:var(--muted);
      text-transform:uppercase;
    }

    .empty{
      padding:22px 4px;
      color:var(--muted);
      font-family:var(--mono);
      font-weight:700;
      font-size:12px;
      letter-spacing:.12em;
      text-transform:uppercase;
      text-align:center;
    }

    .empty::before{ content:"// "; color:var(--cyan); opacity:.55; }

    /* ============ MODAL ============ */
    .modal{
      position:fixed;
      inset:0;
      background:rgba(2,6,16,.62);
      backdrop-filter:blur(10px) saturate(1.1);
      -webkit-backdrop-filter:blur(10px) saturate(1.1);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:100;
      opacity:0;
      visibility:hidden;
      pointer-events:none;
      transition:opacity .18s ease, visibility .18s ease;
    }

    .modal.is-open{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }

    .modal-card{
      position:relative;
      width:min(440px, 100%);
      background:
        radial-gradient(800px 320px at 0% 0%, rgba(0,217,255,.12), transparent 55%),
        linear-gradient(180deg, rgba(10,18,36,.96), rgba(6,12,26,.98));
      border:1px solid rgba(0,217,255,.28);
      border-radius:18px;
      box-shadow:
        0 32px 80px rgba(0,0,0,.60),
        0 0 26px rgba(0,217,255,.16),
        inset 0 1px 0 rgba(0,217,255,.18),
        inset 0 -1px 0 rgba(0,0,0,.50);
      padding:24px;
      display:grid;
      gap:14px;
      transform:translateY(8px) scale(.98);
      opacity:0;
      transition:transform .22s cubic-bezier(.34,1.56,.64,1), opacity .22s ease;
      overflow:hidden;
    }

    .modal-card::before{
      content:"";
      position:absolute;
      inset:0;
      background-image:
        linear-gradient(rgba(0,217,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,217,255,.03) 1px, transparent 1px);
      background-size:24px 24px;
      pointer-events:none;
      mask-image:radial-gradient(ellipse 90% 90% at 50% 50%, #000 30%, transparent 100%);
      -webkit-mask-image:radial-gradient(ellipse 90% 90% at 50% 50%, #000 30%, transparent 100%);
      z-index:0;
    }

    /* Modal corner brackets */
    .modal-card-corner{
      position:absolute;
      width:14px;
      height:14px;
      border:1.5px solid rgba(0,217,255,.65);
      pointer-events:none;
      z-index:1;
      filter:drop-shadow(0 0 4px rgba(0,217,255,.45));
    }
    .modal-card-corner--tl{ top:8px;    left:8px;    border-right:0; border-bottom:0; }
    .modal-card-corner--tr{ top:8px;    right:8px;   border-left:0;  border-bottom:0; }
    .modal-card-corner--bl{ bottom:8px; left:8px;    border-right:0; border-top:0; }
    .modal-card-corner--br{ bottom:8px; right:8px;   border-left:0;  border-top:0; }

    .modal-card > *{ position:relative; z-index:2; }

    .modal.is-open .modal-card{
      transform:translateY(0) scale(1);
      opacity:1;
    }

    .modal-card h2{
      margin:0;
      font-family:var(--mono);
      font-size:22px;
      line-height:1.08;
      letter-spacing:.04em;
      text-transform:uppercase;
      font-weight:900;
      color:#fff;
      text-shadow:0 0 12px rgba(0,217,255,.45), 0 0 3px rgba(0,217,255,.75);
    }

    .modal-card h2::before{
      content:"// ";
      color:var(--cyan);
      opacity:.65;
      font-weight:700;
    }

    .field{
      display:grid;
      gap:8px;
    }

    .field label{
      font-family:var(--mono);
      font-size:10px;
      font-weight:900;
      letter-spacing:.20em;
      text-transform:uppercase;
      color:rgba(125,233,255,.70);
      text-shadow:0 0 4px rgba(0,217,255,.30);
    }

    .field input{
      width:100%;
      appearance:none;
      border:1px solid rgba(0,217,255,.30);
      border-radius:12px;
      min-height:60px;
      padding:0 16px;
      font-family:var(--mono);
      font-size:30px;
      font-weight:900;
      text-align:center;
      color:var(--cyan-soft);
      background:
        linear-gradient(180deg, rgba(6,10,22,.95), rgba(4,8,18,.98));
      outline:none;
      font-variant-numeric:tabular-nums;
      caret-color:var(--cyan);
      text-shadow:0 0 10px rgba(0,217,255,.45);
      box-shadow:
        inset 0 1px 0 rgba(0,217,255,.10),
        inset 0 0 18px rgba(0,217,255,.06);
      transition:border-color .14s ease, box-shadow .14s ease;
    }

    .field input:focus{
      border-color:rgba(0,217,255,.85);
      box-shadow:
        inset 0 1px 0 rgba(0,217,255,.20),
        inset 0 0 24px rgba(0,217,255,.12),
        0 0 0 4px rgba(0,217,255,.16),
        0 0 14px rgba(0,217,255,.20);
    }

    .modal-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:4px;
    }

    /* ============ TOAST ============ */
    .toast{
      position:fixed;
      left:50%;
      bottom:calc(20px + var(--safe-bottom));
      transform:translateX(-50%) translateY(14px);
      opacity:0;
      pointer-events:none;
      z-index:120;
      background:
        linear-gradient(180deg, rgba(10,18,36,.96), rgba(6,12,26,.98));
      color:var(--cyan-soft);
      border:1px solid rgba(0,217,255,.45);
      border-radius:10px;
      padding:13px 18px;
      font-family:var(--mono);
      font-size:12px;
      font-weight:800;
      letter-spacing:.10em;
      text-transform:uppercase;
      text-shadow:0 0 6px rgba(0,217,255,.40);
      box-shadow:
        0 24px 52px rgba(0,0,0,.50),
        0 0 18px rgba(0,217,255,.18),
        inset 0 1px 0 rgba(0,217,255,.18);
      transition:opacity .20s ease, transform .20s ease;
      max-width:min(90vw, 520px);
      text-align:center;
      backdrop-filter:blur(8px);
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    .toast.ok{
      color:#bbf7d0;
      border-color:rgba(74,222,128,.50);
      text-shadow:0 0 6px rgba(74,222,128,.50);
      box-shadow:
        0 24px 52px rgba(0,0,0,.50),
        0 0 18px rgba(74,222,128,.20),
        inset 0 1px 0 rgba(74,222,128,.22);
    }
    .toast.err{
      color:#fecaca;
      border-color:rgba(239,68,68,.50);
      text-shadow:0 0 6px rgba(239,68,68,.55);
      box-shadow:
        0 24px 52px rgba(0,0,0,.50),
        0 0 18px rgba(239,68,68,.22),
        inset 0 1px 0 rgba(239,68,68,.22);
    }

    /* ============ MOBILE ============ */
    @media (max-width: 640px){
      body{
        padding-left:12px;
        padding-right:12px;
      }
      .topbar{
        padding:18px 16px;
        border-radius:20px;
        gap:16px;
      }
      .topbar-corner{
        width:14px;
        height:14px;
      }
      .section{
        padding:16px;
        border-radius:16px;
      }
      .brand{
        gap:14px;
      }
      .brand-icon{
        width:62px;
        height:62px;
        flex-basis:62px;
        border-radius:12px;
      }
      .brand-icon::before{
        inset:5px;
        border-radius:8px;
      }
      .brand-icon svg{
        width:38px;
        height:38px;
      }
      .brand-meta-top{
        font-size:9px;
        gap:8px;
      }
      .brand-tag{
        padding:2px 7px;
      }
      .brand-meta-bottom{
        font-size:10px;
        gap:8px;
      }
      .topbar-readout{
        flex:1 1 100%;
        flex-direction:row;
        align-items:stretch;
      }
      .readout-panel{
        min-width:0;
        flex:1 1 auto;
        padding:10px 14px;
      }
      .readout-digits{
        font-size:22px;
      }
      .readout-unit{
        font-size:10px;
      }
      .top-actions{
        flex:0 0 auto;
      }
      .btn-cyber{
        padding:0 16px;
        font-size:12px;
        min-height:auto;
      }
      .produce-btn{
        min-height:200px;
        font-size:clamp(26px, 8vw, 40px);
      }
      .produce-btn-corner{
        width:12px;
        height:12px;
      }
      .stock-box{
        padding:20px 22px;
      }
      .movement-top,
      .modal-actions{
        grid-template-columns:1fr;
      }
      .movement-user{
        text-align:left;
      }
    }
  </style>
</head>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import {
      getAuth,

      signInWithPopup,
      signInWithRedirect,

      signOut,
      onAuthStateChanged,

    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
    import {

      addDoc,
      onSnapshot,
      query,

      serverTimestamp

    function safeInt(value){
      const n = parseInt(String(value ?? "").replace(/[^\d-]/g, ""), 10);
      return Number.isFinite(n) ? n : 0;
    }

    function normalizeCodeKey(value){
      return String(value || "").trim().toLowerCase().replace(/[\s_-]+/g, "");
    }

    function isPrimaryCode(value){
      return normalizeCodeKey(value) === normalizeCodeKey(CODE);
    }

    function isLinkedFbl1000Code(value){
      const key = normalizeCodeKey(value);
      if (!key) return false;
      return LINKED_FBL1000_CODES.some(code => normalizeCodeKey(code) === key) || key.startsWith("fbl1000");
    }

    function isNeutralMovement(mv){
      return mv?.nonStockItem === true || mv?.inventoryNeutral === true || mv?.stockNeutral === true || mv?.alwaysAvailableItem === true;
    }

    function normalizeWarehouse(value){
      const s = String(value || "").trim().toLowerCase();
      if (!s) return WAREHOUSE;
      if (s === "cerea" || s.startsWith("cer") || s.includes("cerea")) return WAREHOUSE;
      return s;
    }

    function tsToDate(ts){
      try{
        if (!ts) return null;
        if (typeof ts.toDate === "function") return ts.toDate();
        if (ts instanceof Date) return ts;
        const d = new Date(ts);
        return Number.isNaN(d.getTime()) ? null : d;
      }catch(_){
        return null;
      }
    }

    function fmtDateTime(ts){
      const d = tsToDate(ts);
      if (!d) return "—";
      try{
        return d.toLocaleString("it-IT", { dateStyle: "short", timeStyle: "short" });
      }catch(_){
        return d.toLocaleString("it-IT");
      }
    }

    function todayYYYYMMDD(){
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: TZ,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());
      const map = Object.fromEntries(parts.map(p => [p.type, p.value]));
      return `${map.year}-${map.month}-${map.day}`;
    }

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function titleizeWords(value){
      return String(value || "")
        .split(/\s+/)
        .filter(Boolean)
        .map(part => part.charAt(0).toUpperCase() + part.slice(1).toLowerCase())
        .join(" ");
    }

    function prettifyUserLabel(value){
      const raw = String(value || "").trim();
      if (!raw) return "—";
      if (raw.includes("@")){
        const local = raw.split("@")[0].replace(/[._-]+/g, " ").trim();
        const pretty = titleizeWords(local);
        return pretty || raw;
      }
      if (!raw.includes(" ") && /[._-]/.test(raw)){
        const pretty = titleizeWords(raw.replace(/[._-]+/g, " ").trim());
        return pretty || raw;
      }
      return raw;
    }

      for (const key of Object.keys(map)){

    function mapMovement(docSnap){
      const data = docSnap.data() || {};
      return {
        id: docSnap.id,
        type: String(data.type || "IN").trim(),
        code: String(data.code || "").trim(),
        qty: safeInt(data.qty),
        uom: String(data.uom || UOM).trim() || UOM,
        warehouse: String(data.warehouse || "").trim(),
        source: String(data.source || "").trim(),
        docType: String(data.docType || "").trim(),
        docNum: String(data.docNum || "").trim(),
        note: String(data.note || "").trim(),
        customer: String(data.customer || "").trim(),
        nonStockItem: data.nonStockItem === true,
        inventoryNeutral: data.inventoryNeutral === true,
        stockNeutral: data.stockNeutral === true,
        alwaysAvailableItem: data.alwaysAvailableItem === true,
        estrusoreSync: data.estrusoreSync === true,
        estrusoreLinkedMovementId: String(data.estrusoreLinkedMovementId || data.linkedMovementId || "").trim(),
        estrusoreMirrorFromCode: String(data.estrusoreMirrorFromCode || data.mirrorFromCode || "").trim(),
        linkedDdtId: String(data.linkedDdtId || data.estrusoreLinkedDdtId || "").trim(),
        linkedDdtNumber: String(data.linkedDdtNumber || data.estrusoreLinkedDdtNumber || "").trim(),
        createdAt: data.createdAt || data.date || null,
        createdByName: String(data.createdByName || data.userName || data.displayName || "").trim(),
        createdBy: String(data.createdBy || data.userEmail || data.user || data.author || "").trim()
      };
    }

    function resolveUserLabel(){
      if (!state.user) return "Non connesso";
      return prettifyUserLabel(state.user.displayName || state.user.email || state.user.uid || "Connesso");
    }

    function buildMirroredSourceMovementIds(){
      const ids = new Set();
      for (const mv of (state.codeMovements || [])){
        if (!mv || !isPrimaryCode(mv.code) || mv.estrusoreSync !== true) continue;
        const sourceId = String(mv.estrusoreLinkedMovementId || "").trim();
        if (sourceId) ids.add(sourceId);
      }
      return ids;
    }

    function extractCereaMovements(){
      const mirroredSourceIds = buildMirroredSourceMovementIds();
      return (state.codeMovements || []).filter(mv => {
        if (!mv || normalizeWarehouse(mv.warehouse) !== WAREHOUSE) return false;
        if (isNeutralMovement(mv)) return false;
        if (isPrimaryCode(mv.code)) return true;
        if (isLinkedFbl1000Code(mv.code)){
          // Storico: mostra anche gli scarichi FBL1000 già creati da Porta a Conca.
          // Futuro: se Inventario ha scritto il mirror ST0090B03BI01E, non contare due volte.
          return !mirroredSourceIds.has(String(mv.id || "").trim());
        }
        return false;
      });
    }

    function resolveUom(){
      const fromMov = extractCereaMovements()
        .map(mv => String(mv.uom || "").trim())
        .find(Boolean);

      return fromMov || UOM;
    }

    function computeStockTotal(){
      return extractCereaMovements().reduce((sum, mv) => {
        const qty = safeInt(mv.qty);
        return sum + (String(mv.type || "").toUpperCase() === "OUT" ? -qty : qty);
      }, 0);
    }

    function isEstrusoreProductionMovement(mv){
      if (!mv || !isPrimaryCode(mv.code)) return false;
      if (normalizeWarehouse(mv.warehouse) !== WAREHOUSE) return false;
      if (isNeutralMovement(mv)) return false;
      if (mv.estrusoreSync === true) return false;
      if (String(mv.estrusoreLinkedMovementId || "").trim()) return false;
      if (String(mv.estrusoreMirrorFromCode || "").trim()) return false;
      if (String(mv.type || "").toUpperCase() !== "IN") return false;

      const source = String(mv.source || "").trim().toLowerCase();
      const docNum = String(mv.docNum || "").trim().toUpperCase();

      // Contatore "prodotti da sempre": conta solo le produzioni dirette
      // create da questo pannello Estrusore, evitando carichi manuali,
      // rettifiche positive, movimenti generati da hub/DDT o codici collegati FBL1000.
      return source === SOURCE.toLowerCase() || docNum.startsWith("ESTR-");
    }

    function computeLifetimeProduced(){
      const countedIds = new Set();
      return (state.codeMovements || []).reduce((sum, mv) => {
        if (!isEstrusoreProductionMovement(mv)) return sum;
        const key = String(mv.id || "").trim();
        if (key){
          if (countedIds.has(key)) return sum;
          countedIds.add(key);
        }
        return sum + Math.max(0, safeInt(mv.qty));
      }, 0);
    }

    function renderMovements(){
      if (!state.user){
        els.movements.innerHTML = '<div class="empty">Accedi per vedere i movimenti.</div>';
        return;
      }

      const list = extractCereaMovements().slice()
        .sort((a, b) => {
          const at = tsToDate(a.createdAt)?.getTime() || 0;
          const bt = tsToDate(b.createdAt)?.getTime() || 0;
          return bt - at;
        })
        .slice(0, 30);

      if (!list.length){
        els.movements.innerHTML = '<div class="empty">Nessun movimento trovato.</div>';
        return;
      }

      els.movements.innerHTML = list.map(mv => {
        const sign = String(mv.type || "IN").toUpperCase() === "OUT" ? "-" : "+";
        const who = prettifyUserLabel(mv.createdByName || mv.createdBy);
        return `
          <div class="movement">
            <div class="movement-top">
              <div class="movement-qty">${escapeHtml(sign + " " + mv.qty.toLocaleString("it-IT") + " " + (mv.uom || UOM))}</div>
              <div class="movement-user">${escapeHtml(who)}</div>
            </div>
            <div class="movement-date">${escapeHtml(fmtDateTime(mv.createdAt))}</div>
          </div>
        `;
      }).join("");
    }

    function animateNumber(element, targetValue, duration = 900){
      if (!element) return;
      const prev = parseInt(element.dataset.currentValue ?? "0", 10);
      const target = Number.isFinite(targetValue) ? targetValue : 0;

      // First paint or no change: write directly, no animation.
      if (element.dataset.currentValue === undefined || prev === target){
        element.textContent = target.toLocaleString("it-IT");
        element.dataset.currentValue = String(target);
        return;
      }

      // Cancel any in-flight animation on this element.
      if (element._numAnimRaf){
        cancelAnimationFrame(element._numAnimRaf);
        element._numAnimRaf = null;
      }

      const start = performance.now();
      const diff = target - prev;

      function step(now){
        const elapsed = now - start;
        const t = Math.min(elapsed / duration, 1);
        // ease-out cubic
        const eased = 1 - Math.pow(1 - t, 3);
        const current = Math.round(prev + diff * eased);
        element.textContent = current.toLocaleString("it-IT");
        if (t < 1){
          element._numAnimRaf = requestAnimationFrame(step);
        }else{
          element.dataset.currentValue = String(target);
          element._numAnimRaf = null;
        }
      }

      element._numAnimRaf = requestAnimationFrame(step);
    }

    function setNumericDisplay(element, value){
      if (!element) return;
      if (value === null || value === undefined){
        element.textContent = "—";
        delete element.dataset.currentValue;
        if (element._numAnimRaf){
          cancelAnimationFrame(element._numAnimRaf);
          element._numAnimRaf = null;
        }
        return;
      }
      animateNumber(element, value);
    }

    function render(){
      els.currentUser.textContent = resolveUserLabel();
      els.currentUser.classList.toggle("is-online", !!state.user);

      setNumericDisplay(els.stockQty, state.user ? computeStockTotal() : null);

      if (els.stockMeta){
        els.stockMeta.textContent = resolveUom();
      }

      setNumericDisplay(els.lifetimeProduced, state.user ? computeLifetimeProduced() : null);

      els.btnLogin.hidden = !!state.user;
      const loginWrap = els.btnLogin.parentElement;
      if (loginWrap) loginWrap.hidden = !!state.user;
      els.btnProduce.disabled = !(state.user && state.db) || state.busy;
      renderMovements();
    }

    function focusQtyInput(syncUserGesture = false){
      const input = els.qtyInput;
      try{
        input.focus({ preventScroll: true });
      }catch(_){
        try{ input.focus(); }catch(__){ }
      }
      try{ input.click(); }catch(_){ }
      try{ input.setSelectionRange(0, input.value.length); }catch(_){
        try{ input.select(); }catch(__){ }
      }

      if (syncUserGesture){
        requestAnimationFrame(() => {
          if (document.activeElement !== input){
            try{
              input.focus({ preventScroll: true });
            }catch(_){
              try{ input.focus(); }catch(__){ }
            }
            try{ input.click(); }catch(_){ }
            try{ input.setSelectionRange(0, input.value.length); }catch(_){
              try{ input.select(); }catch(__){ }
            }
          }
        });
      }
    }

    function openModal(syncUserGesture = false){
      els.produceModal.classList.add("is-open");
      els.produceModal.setAttribute("aria-hidden", "false");
      els.qtyInput.value = "1";
      if (syncUserGesture){
        focusQtyInput(true);
        return;
      }
      requestAnimationFrame(() => focusQtyInput(false));
    }

    function closeModal(){
      els.produceModal.classList.remove("is-open");
      els.produceModal.setAttribute("aria-hidden", "true");
    }

    function subscribeCodeMovements(){
      if (state.unsubMovements){
        try{ state.unsubMovements(); }catch(_){ }
        state.unsubMovements = null;
      }

      state.codeMovements = [];

      if (!(state.user && state.db)){
        render();
        return;
      }

      const q = query(orgCol("inventoryMovements"), where("code", "in", TRACKED_CODES));
      state.unsubMovements = onSnapshot(q, (snap) => {
        const byId = new Map();
        for (const movement of snap.docs.map(mapMovement)){
          if (!movement?.id) continue;
          byId.set(movement.id, movement);
        }
        state.codeMovements = Array.from(byId.values());
        render();
      }, (err) => {
        console.error("inventoryMovements listener failed", err);
        showToast(humanAuthErr(err), "err");
      });
    }

    async function signIn(){
      try{
        await signInWithPopup(state.auth, provider);
      }catch(err){
        console.warn("signIn popup failed", err);
        if (String(err?.code || "").includes("popup-blocked") || String(err?.code || "").includes("operation-not-supported-in-this-environment")){
          try{
            await signInWithRedirect(state.auth, provider);
            return;
          }catch(err2){
            console.warn("signIn redirect failed", err2);
            showToast(humanAuthErr(err2), "err");
            return;
          }
        }
        showToast(humanAuthErr(err), "err");
      }
    }

    async function produceNow(){
      if (state.busy) return;
      if (!(state.user && state.db)){
        showToast("Accedi per produrre", "err");
        return;
      }

      const qty = safeInt(els.qtyInput.value);
      if (!Number.isFinite(qty) || qty <= 0){
        showToast("Inserisci una quantità valida", "err");
        els.qtyInput.focus();
        els.qtyInput.select();
        return;
      }

      state.busy = true;
      render();

      const date = todayYYYYMMDD();
      const docNum = `ESTR-${date}-${Math.random().toString(36).slice(2, 8).toUpperCase()}`;
      const userLabel = state.user.displayName || state.user.email || state.user.uid || "";
      const userEmail = state.user.email || "";

      const payload = {
        type: "IN",
        customer: "Produzione",
        code: CODE,
        item: ITEM_NAME,
        uom: UOM,
        qtyRaw: `${qty} ${UOM}`,
        qty,
        date,
        note: NOTE,
        source: SOURCE,
        rawText: "",
        warehouse: WAREHOUSE,
        docType: "PRODUZIONE",
        docNum,
        docDateRaw: date,
        createdAt: serverTimestamp(),
        createdBy: userLabel,
        createdByName: state.user.displayName || "",
        createdByEmail: userEmail,
        createdByUid: state.user.uid || ""
      };

      try{
        const movementRef = await addDoc(orgCol("inventoryMovements"), payload);
        try{
          const emailData = buildProductionEmail({
            qty,
            docNum,
            date,
            createdAt: new Date(),
            movementId: movementRef?.id || "",
            userLabel,
            userEmail
          });
          await enqueueMatteoEmail(emailData.subject, emailData.textBody, emailData.htmlBody);
        }catch(mailErr){
          console.warn("production email failed", mailErr);
        }
        closeModal();
        showToast(`Caricati ${qty.toLocaleString("it-IT")} ${UOM}`, "ok");
      }catch(err){
        console.error("produceNow failed", err);
        showToast(humanAuthErr(err), "err");
      }finally{
        state.busy = false;
        render();
      }
    }

    async function init(){
      try{
        state.app = initializeApp(FIREBASE_CONFIG);
        state.auth = getAuth(state.app);
        await setPersistence(state.auth, browserLocalPersistence);
        state.db = initializeFirestore(state.app, {
          experimentalAutoDetectLongPolling: true,
          useFetchStreams: false
        });

        try{
          await getRedirectResult(state.auth);
        }catch(err){
          console.warn("getRedirectResult failed", err);
        }

        onAuthStateChanged(state.auth, (user) => {
          state.user = user || null;
          if (state.user){
            subscribeCodeMovements();
          }else{
            if (state.unsubMovements){
              try{ state.unsubMovements(); }catch(_){ }
              state.unsubMovements = null;
            }
            state.codeMovements = [];
            render();
          }
          render();
        });
      }catch(err){
        console.error("init failed", err);
        showToast(humanAuthErr(err), "err");
      }

      render();
    }

    els.btnConfirm.addEventListener("click", produceNow);

    els.produceModal.addEventListener("click", (event) => {
      if (event.target === els.produceModal) closeModal();
    });

    els.qtyInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter"){
        event.preventDefault();
        produceNow();
      }
      if (event.key === "Escape"){
        event.preventDefault();
        closeModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && els.produceModal.classList.contains("is-open")){
        closeModal();
      }
    });

    init();
  </script>
</body>
</html>
