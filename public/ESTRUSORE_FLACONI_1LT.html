<!doctype html>
<html lang="it" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>ESTRUSORE BOTTIGLIA AGRO 1 LT</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --ink:#0f172a;
      --muted:#64748b;
      --line:rgba(15,23,42,.10);
      --blue:#1c6fe6;
      --blue-dark:#1656b2;
      --shadow:0 16px 44px rgba(15,23,42,.08);
      --radius:24px;
      --safe-top:env(safe-area-inset-top);
      --safe-bottom:env(safe-area-inset-bottom);
      --max:860px;
    }

    *{ box-sizing:border-box; }
    html,body{
      margin:0;
      min-height:100%;
      background:
        radial-gradient(1000px 420px at 10% -10%, rgba(28,111,230,.18), transparent 60%),
        radial-gradient(900px 460px at 100% 0%, rgba(22,163,74,.10), transparent 58%),
        var(--bg);
      color:var(--ink);
      font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    body{
      padding:calc(16px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
    }

    .shell{
      max-width:var(--max);
      margin:0 auto;
      display:grid;
      gap:16px;
    }

    .topbar{
      background:rgba(255,255,255,.86);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      border:1px solid rgba(255,255,255,.9);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:16px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    h1{
      margin:0;
      font-size:clamp(22px, 3.4vw, 34px);
      line-height:1.05;
      letter-spacing:-.02em;
    }

    .top-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      appearance:none;
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      min-height:46px;
      padding:0 16px;
      border-radius:14px;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
      transition:transform .12s ease, filter .12s ease, opacity .12s ease, background .12s ease;
    }
    .btn:hover{ filter:brightness(1.01); }
    .btn:active{ transform:scale(.985); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; }
    .btn-primary{
      background:var(--blue);
      border-color:var(--blue);
      color:#fff;
    }
    .btn-secondary{
      background:#eef4ff;
      border-color:rgba(28,111,230,.18);
      color:var(--blue);
    }

    .section{
      background:rgba(255,255,255,.86);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      border:1px solid rgba(255,255,255,.9);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:20px;
      display:grid;
      gap:16px;
    }

    .section-title{
      margin:0;
      font-size:14px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .produce-wrap{
      display:grid;
      gap:12px;
    }

    .produce-btn{
      appearance:none;
      border:0;
      background:
        radial-gradient(circle at 16% 14%, rgba(255,255,255,.30), rgba(255,255,255,0) 45%),
        linear-gradient(145deg, var(--blue) 0%, var(--blue-dark) 100%);
      color:#fff;
      width:100%;
      min-height:clamp(170px, 34vh, 270px);
      border-radius:28px;
      padding:20px;
      text-align:center;
      font-size:clamp(30px, 5vw, 54px);
      line-height:1.04;
      font-weight:900;
      letter-spacing:-.03em;
      cursor:pointer;
      transition:transform .14s ease, filter .14s ease, opacity .14s ease;
    }
    .produce-btn:hover{ filter:brightness(1.02); }
    .produce-btn:active{ transform:scale(.992); }
    .produce-btn:disabled{ opacity:.55; cursor:not-allowed; }

    .current-user{
      min-height:42px;
      padding:10px 14px;
      border-radius:14px;
      background:#f8fbff;
      border:1px solid rgba(28,111,230,.10);
      font-size:14px;
      font-weight:800;
      color:var(--muted);
      overflow-wrap:anywhere;
    }

    .movements{
      display:grid;
      gap:10px;
    }

    .movement{
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px 16px;
      display:grid;
      gap:8px;
    }

    .movement-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
    }

    .movement-qty{
      font-size:20px;
      font-weight:900;
      letter-spacing:-.02em;
    }

    .movement-user{
      font-size:14px;
      font-weight:800;
      color:var(--ink);
      text-align:right;
      overflow-wrap:anywhere;
    }

    .movement-date{
      font-size:13px;
      font-weight:700;
      color:var(--muted);
    }

    .empty{
      padding:14px 0;
      color:var(--muted);
      font-weight:700;
    }

    .modal[hidden]{ display:none !important; }
    .modal{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.28);
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:100;
    }

    .modal-card{
      width:min(420px, 100%);
      background:#fff;
      border:1px solid rgba(255,255,255,.9);
      border-radius:24px;
      box-shadow:0 24px 64px rgba(15,23,42,.18);
      padding:20px;
      display:grid;
      gap:14px;
    }

    .modal-card h2{
      margin:0;
      font-size:26px;
      line-height:1.08;
      letter-spacing:-.02em;
    }

    .field{
      display:grid;
      gap:8px;
    }

    .field label{
      font-size:12px;
      font-weight:800;
      letter-spacing:.05em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .field input{
      width:100%;
      appearance:none;
      border:1px solid var(--line);
      border-radius:16px;
      min-height:58px;
      padding:0 16px;
      font-size:28px;
      font-weight:900;
      text-align:center;
      color:var(--ink);
      background:#fff;
      outline:none;
    }

    .field input:focus{
      border-color:rgba(28,111,230,.55);
      box-shadow:0 0 0 4px rgba(28,111,230,.12);
    }

    .modal-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(18px + var(--safe-bottom));
      transform:translateX(-50%) translateY(12px);
      opacity:0;
      pointer-events:none;
      z-index:120;
      background:rgba(15,23,42,.92);
      color:#fff;
      border-radius:14px;
      padding:12px 16px;
      font-size:14px;
      font-weight:800;
      box-shadow:0 18px 40px rgba(15,23,42,.18);
      transition:opacity .18s ease, transform .18s ease;
      max-width:min(90vw, 520px);
      text-align:center;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    .toast.ok{ background:rgba(22,163,74,.96); }
    .toast.err{ background:rgba(220,38,38,.96); }

    @media (max-width: 640px){
      body{
        padding-left:12px;
        padding-right:12px;
      }
      .section{
        padding:16px;
        border-radius:24px;
      }
      .produce-btn{
        min-height:210px;
        font-size:clamp(26px, 8vw, 42px);
      }
      .movement-top,
      .modal-actions{
        grid-template-columns:1fr;
      }
      .movement-user{
        text-align:left;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <h1>ESTRUSORE BOTTIGLIA AGRO 1 LT</h1>
      <div class="top-actions">
        <button id="btnLogin" class="btn btn-primary" type="button">Accedi</button>
        <button id="btnLogout" class="btn btn-secondary" type="button" hidden>Esci</button>
      </div>
    </header>

    <section class="section">
      <h2 class="section-title">Produci</h2>
      <div class="produce-wrap">
        <button id="btnProduce" class="produce-btn" type="button" disabled>PRODUCI</button>
        <div id="currentUser" class="current-user">Non connesso</div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Movimenti</h2>
      <div id="movements" class="movements">
        <div class="empty">Accedi per vedere i movimenti.</div>
      </div>
    </section>
  </div>

  <div id="produceModal" class="modal" hidden aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Produci</h2>
      <div class="field">
        <label for="qtyInput">Quantità</label>
        <input id="qtyInput" type="number" min="1" step="1" inputmode="numeric" autocomplete="off" value="1" />
      </div>
      <div class="modal-actions">
        <button id="btnCancel" class="btn" type="button">Annulla</button>
        <button id="btnConfirm" class="btn btn-primary" type="button">Conferma</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      signOut,
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
    import {
      initializeFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      where,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyBiyB4pilnPpVj8vImD4PI6LF2_RtyDnv4",
      authDomain: "tabellone-produzione-liv-e313e.firebaseapp.com",
      projectId: "tabellone-produzione-liv-e313e",
      storageBucket: "tabellone-produzione-liv-e313e.firebasestorage.app",
      messagingSenderId: "537555699968",
      appId: "1:537555699968:web:4d04cb9596b67bfb0e4be5"
    };

    const ORG_ID = "generalcopper";
    const CODE = "ST0090B03BI01E";
    const ITEM_NAME = "Bottiglia agro 1 lt";
    const UOM = "pz";
    const WAREHOUSE = "cerea";
    const SOURCE = "Estrusore HTML";
    const NOTE = "Estrusore bottiglia agro 1 lt";
    const TZ = "Europe/Rome";

    const els = {
      btnLogin: document.getElementById("btnLogin"),
      btnLogout: document.getElementById("btnLogout"),
      btnProduce: document.getElementById("btnProduce"),
      currentUser: document.getElementById("currentUser"),
      movements: document.getElementById("movements"),
      produceModal: document.getElementById("produceModal"),
      qtyInput: document.getElementById("qtyInput"),
      btnCancel: document.getElementById("btnCancel"),
      btnConfirm: document.getElementById("btnConfirm"),
      toast: document.getElementById("toast")
    };

    const state = {
      app: null,
      auth: null,
      db: null,
      user: null,
      busy: false,
      codeMovements: [],
      unsubMovements: null
    };

    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    function orgCol(name){
      return collection(state.db, "orgs", ORG_ID, name);
    }

    function safeInt(value){
      const n = parseInt(String(value ?? "").replace(/[^\d-]/g, ""), 10);
      return Number.isFinite(n) ? n : 0;
    }

    function normalizeWarehouse(value){
      const s = String(value || "").trim().toLowerCase();
      if (!s) return WAREHOUSE;
      if (s === "cerea" || s.startsWith("cer") || s.includes("cerea")) return WAREHOUSE;
      return s;
    }

    function tsToDate(ts){
      try{
        if (!ts) return null;
        if (typeof ts.toDate === "function") return ts.toDate();
        if (ts instanceof Date) return ts;
        const d = new Date(ts);
        return Number.isNaN(d.getTime()) ? null : d;
      }catch(_){
        return null;
      }
    }

    function fmtDateTime(ts){
      const d = tsToDate(ts);
      if (!d) return "—";
      try{
        return d.toLocaleString("it-IT", { dateStyle: "short", timeStyle: "short" });
      }catch(_){
        return d.toLocaleString("it-IT");
      }
    }

    function todayYYYYMMDD(){
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: TZ,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());
      const map = Object.fromEntries(parts.map(p => [p.type, p.value]));
      return `${map.year}-${map.month}-${map.day}`;
    }

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    let toastTimer = null;
    function showToast(message, kind = ""){
      const el = els.toast;
      el.textContent = String(message || "");
      el.className = `toast${kind ? " " + kind : ""} show`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.className = "toast";
      }, 2600);
    }

    function humanAuthErr(err){
      const code = String(err?.code || err?.message || "").toLowerCase();
      const map = {
        "auth/unauthorized-domain": "Dominio non autorizzato in Firebase Auth.",
        "auth/operation-not-allowed": "Provider Google non abilitato in Firebase.",
        "auth/popup-blocked": "Popup bloccato dal browser: provo il redirect.",
        "auth/popup-closed-by-user": "Popup chiuso: riprova.",
        "auth/cancelled-popup-request": "Richiesta annullata: riprova.",
        "auth/network-request-failed": "Connessione instabile: riprova.",
        "auth/invalid-api-key": "Config Firebase non valida.",
        "permission-denied": "Permessi Firestore insufficienti."
      };
      for (const key of Object.keys(map)){
        if (code.includes(key)) return map[key];
      }
      return "Operazione non riuscita.";
    }

    function mapMovement(docSnap){
      const data = docSnap.data() || {};
      return {
        id: docSnap.id,
        type: String(data.type || "IN").trim(),
        code: String(data.code || "").trim(),
        qty: safeInt(data.qty),
        uom: String(data.uom || UOM).trim() || UOM,
        warehouse: String(data.warehouse || "").trim(),
        createdAt: data.createdAt || data.date || null,
        createdBy: String(data.createdBy || data.userEmail || data.user || data.author || "").trim()
      };
    }

    function resolveUserLabel(){
      if (!state.user) return "Non connesso";
      return state.user.email || state.user.displayName || state.user.uid || "Connesso";
    }

    function renderMovements(){
      if (!state.user){
        els.movements.innerHTML = '<div class="empty">Accedi per vedere i movimenti.</div>';
        return;
      }

      const list = (state.codeMovements || [])
        .filter(mv => normalizeWarehouse(mv.warehouse) === WAREHOUSE)
        .slice()
        .sort((a, b) => {
          const at = tsToDate(a.createdAt)?.getTime() || 0;
          const bt = tsToDate(b.createdAt)?.getTime() || 0;
          return bt - at;
        })
        .slice(0, 30);

      if (!list.length){
        els.movements.innerHTML = '<div class="empty">Nessun movimento trovato.</div>';
        return;
      }

      els.movements.innerHTML = list.map(mv => {
        const sign = String(mv.type || "IN").toUpperCase() === "OUT" ? "-" : "+";
        const who = mv.createdBy || "—";
        return `
          <div class="movement">
            <div class="movement-top">
              <div class="movement-qty">${escapeHtml(sign + " " + mv.qty.toLocaleString("it-IT") + " " + (mv.uom || UOM))}</div>
              <div class="movement-user">${escapeHtml(who)}</div>
            </div>
            <div class="movement-date">${escapeHtml(fmtDateTime(mv.createdAt))}</div>
          </div>
        `;
      }).join("");
    }

    function render(){
      els.currentUser.textContent = resolveUserLabel();
      els.btnLogin.hidden = !!state.user;
      els.btnLogout.hidden = !state.user;
      els.btnProduce.disabled = !(state.user && state.db) || state.busy;
      renderMovements();
    }

    function openModal(){
      els.produceModal.hidden = false;
      els.produceModal.setAttribute("aria-hidden", "false");
      els.qtyInput.value = "1";
      setTimeout(() => {
        els.qtyInput.focus();
        els.qtyInput.select();
      }, 0);
    }

    function closeModal(){
      els.produceModal.hidden = true;
      els.produceModal.setAttribute("aria-hidden", "true");
    }

    function subscribeCodeMovements(){
      if (state.unsubMovements){
        try{ state.unsubMovements(); }catch(_){ }
        state.unsubMovements = null;
      }

      state.codeMovements = [];

      if (!(state.user && state.db)){
        render();
        return;
      }

      const q = query(orgCol("inventoryMovements"), where("code", "==", CODE));
      state.unsubMovements = onSnapshot(q, (snap) => {
        state.codeMovements = snap.docs.map(mapMovement);
        render();
      }, (err) => {
        console.error("inventoryMovements listener failed", err);
        showToast(humanAuthErr(err), "err");
      });
    }

    async function signIn(){
      try{
        await signInWithPopup(state.auth, provider);
      }catch(err){
        console.warn("signIn popup failed", err);
        if (String(err?.code || "").includes("popup-blocked") || String(err?.code || "").includes("operation-not-supported-in-this-environment")){
          try{
            await signInWithRedirect(state.auth, provider);
            return;
          }catch(err2){
            console.warn("signIn redirect failed", err2);
            showToast(humanAuthErr(err2), "err");
            return;
          }
        }
        showToast(humanAuthErr(err), "err");
      }
    }

    async function produceNow(){
      if (state.busy) return;
      if (!(state.user && state.db)){
        showToast("Accedi per produrre", "err");
        return;
      }

      const qty = safeInt(els.qtyInput.value);
      if (!Number.isFinite(qty) || qty <= 0){
        showToast("Inserisci una quantità valida", "err");
        els.qtyInput.focus();
        els.qtyInput.select();
        return;
      }

      state.busy = true;
      render();

      const date = todayYYYYMMDD();
      const docNum = `ESTR-${date}-${Math.random().toString(36).slice(2, 8).toUpperCase()}`;
      const userLabel = state.user.email || state.user.displayName || state.user.uid || "";

      const payload = {
        type: "IN",
        customer: "Produzione",
        code: CODE,
        item: ITEM_NAME,
        uom: UOM,
        qtyRaw: `${qty} ${UOM}`,
        qty,
        date,
        note: NOTE,
        source: SOURCE,
        rawText: "",
        warehouse: WAREHOUSE,
        docType: "PRODUZIONE",
        docNum,
        docDateRaw: date,
        createdAt: serverTimestamp(),
        createdBy: userLabel
      };

      try{
        await addDoc(orgCol("inventoryMovements"), payload);
        closeModal();
        showToast(`Caricati ${qty.toLocaleString("it-IT")} ${UOM}`, "ok");
      }catch(err){
        console.error("produceNow failed", err);
        showToast(humanAuthErr(err), "err");
      }finally{
        state.busy = false;
        render();
      }
    }

    async function init(){
      try{
        state.app = initializeApp(FIREBASE_CONFIG);
        state.auth = getAuth(state.app);
        await setPersistence(state.auth, browserLocalPersistence);
        state.db = initializeFirestore(state.app, {
          experimentalAutoDetectLongPolling: true,
          useFetchStreams: false
        });

        try{
          await getRedirectResult(state.auth);
        }catch(err){
          console.warn("getRedirectResult failed", err);
        }

        onAuthStateChanged(state.auth, (user) => {
          state.user = user || null;
          if (state.user){
            subscribeCodeMovements();
          }else{
            if (state.unsubMovements){
              try{ state.unsubMovements(); }catch(_){ }
              state.unsubMovements = null;
            }
            state.codeMovements = [];
            render();
          }
          render();
        });
      }catch(err){
        console.error("init failed", err);
        showToast(humanAuthErr(err), "err");
      }

      render();
    }

    els.btnLogin.addEventListener("click", signIn);
    els.btnLogout.addEventListener("click", async () => {
      try{
        await signOut(state.auth);
      }catch(err){
        console.error("logout failed", err);
        showToast(humanAuthErr(err), "err");
      }
    });

    els.btnProduce.addEventListener("click", () => {
      if (!(state.user && state.db)){
        showToast("Accedi per produrre", "err");
        return;
      }
      openModal();
    });

    els.btnCancel.addEventListener("click", closeModal);
    els.btnConfirm.addEventListener("click", produceNow);

    els.produceModal.addEventListener("click", (event) => {
      if (event.target === els.produceModal) closeModal();
    });

    els.qtyInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter"){
        event.preventDefault();
        produceNow();
      }
      if (event.key === "Escape"){
        event.preventDefault();
        closeModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !els.produceModal.hidden){
        closeModal();
      }
    });

    init();
  </script>
</body>
</html>
