    const FIREBASE_CONFIG = {

    const ORG_ID = "generalcopper";
    const CODE = "ST0090B03BI01E";
    const ITEM_NAME = "Bottiglia agro 1 lt";

    const LINKED_FBL1000_CODES = Object.freeze([
      "FBL1000UN00501102532",
      "FBL1000",
      "fbl1000",
      "FBL",
      "fbl",
      "FBL-1000",
      "FBL 1000"
    ]);
    const TRACKED_CODES = Object.freeze(Array.from(new Set([CODE, ...LINKED_FBL1000_CODES].map(value => String(value || "").trim()).filter(Boolean))));
    const WAREHOUSE = "cerea";

    };

    function orgCol(name){
      return collection(state.db, "orgs", ORG_ID, name);
    }

    function safeInt(value){
      const n = parseInt(String(value ?? "").replace(/[^\d-]/g, ""), 10);
      return Number.isFinite(n) ? n : 0;
    }

    function cleanText(value){
      return String(value || "").replace(/\s+/g, " ").trim();
    }

    function normalizeCodeKey(value){
      return String(value || "").trim().toLowerCase().replace(/[\s_-]+/g, "");
    }

    function isPrimaryCode(value){
      return normalizeCodeKey(value) === normalizeCodeKey(CODE);
    }

    function isLinkedFbl1000Code(value){
      const key = normalizeCodeKey(value);
      if (!key) return false;
      return LINKED_FBL1000_CODES.some(code => normalizeCodeKey(code) === key) || key.startsWith("fbl1000");
    }

    function normalizeLookupText(value){
      return String(value || "")
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, " ")
        .trim()
        .replace(/\s+/g, " ");
    }

    function compactLookupText(value){
      return normalizeLookupText(value).replace(/\s+/g, "");
    }

    function getProductCodeFromData(data, id = ""){
      return String(data?.code || data?.sku || data?.codice || id || "").trim();
    }

    function mapProductRecord(docSnap){
      const data = docSnap.data() || {};
      return {
        id: String(docSnap.id || "").trim(),
        code: getProductCodeFromData(data, docSnap.id),
        name: String(data.name || data.nome || data.item || data.title || "").trim(),
        alias: String(data.alias || data.aliasName || data.aliasLower || "").trim(),
        searchText: String(data.searchText || data.description || data.category || data.categoryKey || "").trim()
      };
    }

    function isEstrusoreFblProductRecord(product){
      if (!product || typeof product !== "object") return false;
      const code = String(product.code || product.id || "").trim();
      const alias = String(product.alias || "").trim();
      const blob = compactLookupText([code, alias, product.name, product.searchText].join(" "));

      if (isPrimaryCode(code)) return true;
      if (isLinkedFbl1000Code(code) || isLinkedFbl1000Code(alias)) return true;
      if (blob.includes("fbl1000") || blob.includes("fbl1000un00501102532")) return true;
      if (blob.includes("bottigliaagro1lt") || blob.includes("bottigliaagro1l") || blob.includes("flaconeagro1lt")) return true;
      if (compactLookupText(alias) === "fbl" && normalizeCodeKey(code).startsWith("fbl")) return true;
      return false;
    }

    function buildTrackedCodes(){
      const set = new Set();
      for (const code of TRACKED_CODES){
        const clean = String(code || "").trim();
        if (clean) set.add(clean);
      }

      for (const product of (state.productRecords || [])){
        if (!isEstrusoreFblProductRecord(product)) continue;
        const code = String(product.code || product.id || "").trim();
        if (code) set.add(code);
        const id = String(product.id || "").trim();
        if (id && isLinkedFbl1000Code(id)) set.add(id);
        const alias = String(product.alias || "").trim();
        if (alias && compactLookupText(alias).startsWith("fbl")) set.add(alias);
      }

      return Array.from(set)
        .map(value => String(value || "").trim())
        .filter(Boolean)
        .filter((value, index, arr) => arr.findIndex(v => v === value) === index);
    }

    function isLinkedFbl1000Movement(mv){
      if (!mv || typeof mv !== "object") return false;
      if (isLinkedFbl1000Code(mv.code) || isLinkedFbl1000Code(mv.estrusoreMirrorFromCode)) return true;
      const compact = compactLookupText([
        mv.code,
        mv.item,
        mv.source,
        mv.note,
        mv.rawText,
        mv.customer,
        mv.estrusoreMirrorFromCode,
        mv.estrusoreMirrorFromItem,
        mv.docType,
        mv.docNum,
        mv.ddtNumber
      ].join(" "));
      if (compact.includes("fbl1000") || compact.includes("fbl1000un00501102532")) return true;
      if (compact.includes("bottigliaagro1lt") || compact.includes("bottigliaagro1l") || compact.includes("flaconeagro1lt")) return true;
      return false;
    }

    function isNeutralMovement(mv){
      return mv?.nonStockItem === true || mv?.inventoryNeutral === true || mv?.stockNeutral === true || mv?.alwaysAvailableItem === true;
    }

    function normalizeWarehouse(value){
      const s = String(value || "").trim().toLowerCase();
      if (!s) return WAREHOUSE;
      if (s === "cerea" || s.startsWith("cer") || s.includes("cerea")) return WAREHOUSE;
      if (s === "concamarise" || s === "conca" || s.includes("concamarise") || /\bconca\b/.test(s)) return "concamarise";
      return s;
    }

    function normalizeWarehouseStrict(value){
      const raw = String(value || "").trim();
      if (!raw) return "";
      return normalizeWarehouse(raw);
    }

    function isConcamariseWarehouse(value){
      return normalizeWarehouseStrict(value) === "concamarise";
    }

    function getMovementType(mv){
      return String(mv?.type || "IN").trim().toUpperCase() === "OUT" ? "OUT" : "IN";
    }

    function movementRouteCompactText(mv){
      return compactLookupText([
        mv?.source,
        mv?.note,
        mv?.rawText,
        mv?.docType,
        mv?.docNum,
        mv?.ddtNumber,
        mv?.fromWarehouse,
        mv?.toWarehouse,
        mv?.transferDirection,
        mv?.ddtDirection,
        mv?.direction
      ].join(" "));
    }

    function isCereaToConcamariseTransfer(mv){
      if (!mv || typeof mv !== "object") return false;
      const direction = cleanText(mv.transferDirection || mv.ddtDirection || mv.direction || "").toLowerCase();
      const fromWarehouse = normalizeWarehouseStrict(mv.fromWarehouse || mv.sourceWarehouse || mv.originWarehouse || "");
      const toWarehouse = normalizeWarehouseStrict(mv.toWarehouse || mv.destinationWarehouse || "");

      if (direction === "to_concamarise" || direction === "cerea_to_concamarise") return true;
      if (fromWarehouse === WAREHOUSE && toWarehouse === "concamarise") return true;

      const route = movementRouteCompactText(mv);
      if (route.includes("portaaconca")) return true;
      if (
        route.includes("cerea") &&
        (route.includes("concamarise") || route.includes("conca")) &&
        (route.includes("spostamento") || route.includes("trasferimento") || route.includes("ddt") || route.includes("bolla"))
      ) return true;

      return false;
    }

    function isConcamariseToCereaTransfer(mv){
      if (!mv || typeof mv !== "object") return false;
      const direction = cleanText(mv.transferDirection || mv.ddtDirection || mv.direction || "").toLowerCase();
      const fromWarehouse = normalizeWarehouseStrict(mv.fromWarehouse || mv.sourceWarehouse || mv.originWarehouse || "");
      const toWarehouse = normalizeWarehouseStrict(mv.toWarehouse || mv.destinationWarehouse || "");

      if (direction === "to_cerea" || direction === "concamarise_to_cerea" || direction === "conca_to_cerea") return true;
      if (fromWarehouse === "concamarise" && toWarehouse === WAREHOUSE) return true;

      const route = movementRouteCompactText(mv);
      if (route.includes("portaacerea")) return true;
      if (
        route.includes("cerea") &&
        (route.includes("concamarise") || route.includes("conca")) &&
        (route.includes("spostamento") || route.includes("trasferimento") || route.includes("ddt") || route.includes("bolla"))
      ) return true;

      return false;
    }

    function isLinkedFblCereaTransferMovement(mv){
      if (!isLinkedFbl1000Movement(mv)) return false;
      if (normalizeWarehouseStrict(mv.warehouse) !== WAREHOUSE) return false;

      const type = getMovementType(mv);
      if (type === "OUT") return isCereaToConcamariseTransfer(mv);
      if (type === "IN") return isConcamariseToCereaTransfer(mv);
      return false;
    }

    function isLinkedFblCereaInventoryCorrectionMovement(mv){
      if (!isLinkedFbl1000Movement(mv)) return false;
      if (normalizeWarehouseStrict(mv.warehouse) !== WAREHOUSE) return false;

      // Rettifica dal gestionale/hub: quando l'inventario Cerea viene modificato
      // manualmente, viene creato un movimento IN/OUT sul codice reale FBL.
      // Estrusore deve seguirlo perché rappresenta lo stock attuale Cerea.
      const text = compactLookupText([
        mv?.source,
        mv?.docType,
        mv?.note,
        mv?.rawText
      ].join(" "));

      return Boolean(
        text.includes("rettifica") ||
        text.includes("rettificarapida") ||
        text.includes("rettificainventario") ||
        text.includes("correzioneinventario") ||
        text.includes("modificainventario") ||
        text.includes("inventoryadjust") ||
        text.includes("adjuststock")
      );
    }

    function getFblTransferLineKey(mv){
      if (!mv) return "";
      const ddtKey = cleanText(mv.linkedDdtId || mv.ddtId || mv.transportDocumentId || mv.linkedDdtNumber || mv.ddtNumber || mv.docNum || mv.docNumber || "");
      if (!ddtKey) return "";
      const codeKey = normalizeCodeKey(mv.estrusoreMirrorFromCode || mv.mirrorFromCode || mv.code || "");
      const lineNo = cleanText(mv.lineNo || mv.lineNumber || "");
      const qty = safeInt(mv.estrusoreMirrorQty || mv.qty || 0);
      return [ddtKey, lineNo, codeKey, qty].join("|");
    }

    function tsToDate(ts){
      try{
        if (!ts) return null;
        if (typeof ts.toDate === "function") return ts.toDate();
        if (ts instanceof Date) return ts;
        const d = new Date(ts);
        return Number.isNaN(d.getTime()) ? null : d;
      }catch(_){
        return null;
      }
    }

    function fmtDateTime(ts){
      const d = tsToDate(ts);
      if (!d) return "—";
      try{
        return d.toLocaleString("it-IT", { dateStyle: "short", timeStyle: "short" });
      }catch(_){
        return d.toLocaleString("it-IT");
      }
    }

    function todayYYYYMMDD(){
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: TZ,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());
      const map = Object.fromEntries(parts.map(p => [p.type, p.value]));
      return `${map.year}-${map.month}-${map.day}`;
    }

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function titleizeWords(value){
      return String(value || "")
        .split(/\s+/)
        .filter(Boolean)
        .map(part => part.charAt(0).toUpperCase() + part.slice(1).toLowerCase())
        .join(" ");
    }

    function prettifyUserLabel(value){
      const raw = String(value || "").trim();
      if (!raw) return "—";
      if (raw.includes("@")){
        const local = raw.split("@")[0].replace(/[._-]+/g, " ").trim();
        const pretty = titleizeWords(local);
        return pretty || raw;
      }
      if (!raw.includes(" ") && /[._-]/.test(raw)){
        const pretty = titleizeWords(raw.replace(/[._-]+/g, " ").trim());
        return pretty || raw;
      }
      return raw;
    }

    function mapMovement(docSnap){
      const data = docSnap.data() || {};
      return {
        id: docSnap.id,
        type: String(data.type || "IN").trim(),
        code: String(data.code || "").trim(),
        item: String(data.item || data.product || data.name || "").trim(),
        customer: String(data.customer || data.supplier || data.supplierName || "").trim(),
        rawText: String(data.rawText || "").trim(),
        qty: safeInt(data.qty),
        uom: String(data.uom || UOM).trim() || UOM,
        warehouse: String(data.warehouse || data.site || data.magazzino || data.location || "").trim(),
        fromWarehouse: String(data.fromWarehouse || data.sourceWarehouse || data.originWarehouse || "").trim(),
        toWarehouse: String(data.toWarehouse || data.destinationWarehouse || "").trim(),
        transferDirection: String(data.transferDirection || data.ddtDirection || data.direction || "").trim(),
        docType: String(data.docType || "").trim(),
        docNum: String(data.docNum || data.docNumber || "").trim(),
        ddtId: String(data.ddtId || data.ddtDocId || data.transportDocumentId || "").trim(),
        ddtNumber: String(data.ddtNumber || data.transportDocNumber || "").trim(),
        lineNo: String(data.lineNo || data.lineNumber || "").trim(),
        source: String(data.source || "").trim(),
        note: String(data.note || "").trim(),
        nonStockItem: data.nonStockItem === true,
        inventoryNeutral: data.inventoryNeutral === true,
        stockNeutral: data.stockNeutral === true,
        alwaysAvailableItem: data.alwaysAvailableItem === true,
        estrusoreSync: data.estrusoreSync === true,
        estrusoreLinkedMovementId: String(data.estrusoreLinkedMovementId || data.linkedMovementId || "").trim(),
        estrusoreMirrorFromCode: String(data.estrusoreMirrorFromCode || data.mirrorFromCode || "").trim(),
        estrusoreMirrorFromItem: String(data.estrusoreMirrorFromItem || data.mirrorFromItem || "").trim(),
        estrusoreMirrorQty: safeInt(data.estrusoreMirrorQty || data.mirrorQty || data.qty || 0),
        linkedDdtId: String(data.linkedDdtId || data.estrusoreLinkedDdtId || "").trim(),
        linkedDdtNumber: String(data.linkedDdtNumber || data.estrusoreLinkedDdtNumber || "").trim(),
        createdAt: data.createdAt || data.date || null,
        createdByName: String(data.createdByName || data.userName || data.displayName || "").trim(),
        createdBy: String(data.createdBy || data.userEmail || data.user || data.author || "").trim()
      };
    }

    function resolveUserLabel(){
      if (!state.user) return "Non connesso";
      return prettifyUserLabel(state.user.displayName || state.user.email || state.user.uid || "Connesso");
    }

    function buildMirroredSourceMovementIds(){
      const ids = new Set();
      for (const mv of (state.codeMovements || [])){
        if (!mv || !isPrimaryCode(mv.code) || mv.estrusoreSync !== true) continue;
        const sourceId = String(mv.estrusoreLinkedMovementId || "").trim();
        if (sourceId) ids.add(sourceId);
      }
      return ids;
    }

    function buildPrimaryMirrorFblTransferLineKeys(){
      const keys = new Set();
      for (const mv of (state.codeMovements || [])){
        if (!mv || !isPrimaryCode(mv.code) || mv.estrusoreSync !== true) continue;
        const key = getFblTransferLineKey(mv);
        if (key) keys.add(key);
      }
      return keys;
    }

    function extractCereaMovements(){
      const mirroredSourceIds = buildMirroredSourceMovementIds();
      const primaryMirrorLineKeys = buildPrimaryMirrorFblTransferLineKeys();
      const out = [];

      for (const mv of (state.codeMovements || [])){
        if (!mv || isNeutralMovement(mv)) continue;

        // Fonte principale dell'estrusore: solo movimenti del codice interno a Cerea.
        // Produzione = IN, mirror Porta a Conca = OUT.
        if (isPrimaryCode(mv.code)){
          if (normalizeWarehouseStrict(mv.warehouse) === WAREHOUSE) out.push(mv);
          continue;
        }

        // Fallback storico: usa gli FBL solo in due casi:
        // 1) veri trasferimenti che toccano Cerea (Porta a Conca / Porta a Cerea),
        // 2) rettifiche inventario del gestionale/hub su Cerea.
        // NON deve sommare carichi manuali/iniziali FBL a Cerea, altrimenti lo stock raddoppia.
        const isTransfer = isLinkedFblCereaTransferMovement(mv);
        const isCorrection = isLinkedFblCereaInventoryCorrectionMovement(mv);
        if (!(isTransfer || isCorrection)) continue;

        if (isTransfer){
          if (mirroredSourceIds.has(String(mv.id || "").trim())) continue;

          const lineKey = getFblTransferLineKey(mv);
          if (lineKey && primaryMirrorLineKeys.has(lineKey)) continue;
        }

        out.push(mv);
      }

      return out;
    }

    function resolveUom(){
      const fromMov = extractCereaMovements()
        .map(mv => String(mv.uom || "").trim())
        .find(Boolean);

      return fromMov || UOM;
    }

    function computeStockTotal(){
      return extractCereaMovements().reduce((sum, mv) => {
        const qty = safeInt(mv.qty);
        return sum + (String(mv.type || "").toUpperCase() === "OUT" ? -qty : qty);
      }, 0);
    }

    function getMovementDocumentNumber(mv){
      return cleanText(
        mv?.linkedDdtNumber ||
        mv?.ddtNumber ||
        mv?.docNum ||
        mv?.linkedDdtId ||
        mv?.ddtId ||
        ""
      );
    }

    function getMovementOriginalCode(mv){
      const code = cleanText(mv?.estrusoreMirrorFromCode || mv?.mirrorFromCode || "");
      if (code) return code;
      if (!isPrimaryCode(mv?.code) && isLinkedFbl1000Movement(mv)) return cleanText(mv?.code || "");
      return "";
    }

    function isPortaAConcaMovement(mv){
      if (!mv) return false;
      const type = getMovementType(mv);
      if (type !== "OUT") return false;
      if (isPrimaryCode(mv.code) && mv.estrusoreSync === true){
        return isCereaToConcamariseTransfer(mv) || compactLookupText([mv.source, mv.note, mv.docType].join(" ")).includes("portaconca");
      }
      return isLinkedFblCereaTransferMovement(mv) && isCereaToConcamariseTransfer(mv);
    }

    function isPortaACereaMovement(mv){
      if (!mv) return false;
      const type = getMovementType(mv);
      if (type !== "IN") return false;
      if (isPrimaryCode(mv.code) && mv.estrusoreSync === true){
        return isConcamariseToCereaTransfer(mv) || compactLookupText([mv.source, mv.note, mv.docType].join(" ")).includes("portacerea");
      }
      return isLinkedFblCereaTransferMovement(mv) && isConcamariseToCereaTransfer(mv);
    }

    function isProductionMovement(mv){
      if (!mv || !isPrimaryCode(mv.code)) return false;
      if (mv.estrusoreSync === true) return false;
      const type = getMovementType(mv);
      const text = compactLookupText([mv.source, mv.docType, mv.note].join(" "));
      return type === "IN" && (text.includes("estrusore") || text.includes("produzione"));
    }

    function resolveMovementDetailLabel(mv){
      if (!mv) return "";

      const docNumber = getMovementDocumentNumber(mv);
      const originalCode = getMovementOriginalCode(mv);
      const pieces = [];

      if (isPortaAConcaMovement(mv)){
        pieces.push("Movimento generato da bolla Porta a Conca");
        if (docNumber) pieces.push(`Bolla/DDT ${docNumber}`);
        if (originalCode) pieces.push(`Codice origine ${originalCode}`);
        return pieces.join(" · ");
      }

      if (isPortaACereaMovement(mv)){
        pieces.push("Movimento generato da bolla Porta a Cerea");
        if (docNumber) pieces.push(`Bolla/DDT ${docNumber}`);
        if (originalCode) pieces.push(`Codice origine ${originalCode}`);
        return pieces.join(" · ");
      }

      if (isLinkedFblCereaInventoryCorrectionMovement(mv)){
        pieces.push("Rettifica gestionale inventario Cerea");
        if (docNumber) pieces.push(`Documento ${docNumber}`);
        if (originalCode || cleanText(mv.code)) pieces.push(`Codice ${originalCode || cleanText(mv.code)}`);
        return pieces.join(" · ");
      }

      if (isProductionMovement(mv)){
        pieces.push("Produzione estrusore");
        if (docNumber) pieces.push(`Documento ${docNumber}`);
        return pieces.join(" · ");
      }

      const source = cleanText(mv.source || mv.note || mv.docType || "Movimento inventario Cerea");
      if (source) pieces.push(source);
      if (docNumber) pieces.push(`Documento ${docNumber}`);
      if (originalCode) pieces.push(`Codice origine ${originalCode}`);
      return pieces.join(" · ");
    }

    function renderMovements(){
      if (!state.user){
        els.movements.innerHTML = '<div class="empty">Accedi per vedere i movimenti.</div>';
        return;
      }

      const list = extractCereaMovements().slice()
        .sort((a, b) => {
          const at = tsToDate(a.createdAt)?.getTime() || 0;
          const bt = tsToDate(b.createdAt)?.getTime() || 0;
          return bt - at;
        })
        .slice(0, 30);

      if (!list.length){
        els.movements.innerHTML = '<div class="empty">Nessun movimento trovato.</div>';
        return;
      }

      els.movements.innerHTML = list.map(mv => {
        const sign = String(mv.type || "IN").toUpperCase() === "OUT" ? "-" : "+";
        const who = prettifyUserLabel(mv.createdByName || mv.createdBy);
        const detail = resolveMovementDetailLabel(mv);
        return `
          <div class="movement">
            <div class="movement-top">
              <div class="movement-qty">${escapeHtml(sign + " " + mv.qty.toLocaleString("it-IT") + " " + (mv.uom || UOM))}</div>
              <div class="movement-user">${escapeHtml(who)}</div>
            </div>
            ${detail ? `<div class="movement-detail">${escapeHtml(detail)}</div>` : ""}
            <div class="movement-date">${escapeHtml(fmtDateTime(mv.createdAt))}</div>
          </div>
        `;
      }).join("");
    }

    function render(){
      els.currentUser.textContent = resolveUserLabel();
      if (els.stockQty){
        els.stockQty.textContent = state.user ? computeStockTotal().toLocaleString("it-IT") : "—";
      }
      if (els.stockMeta){
        els.stockMeta.textContent = resolveUom();
      }
      els.btnLogin.hidden = !!state.user;
      els.btnProduce.disabled = !(state.user && state.db) || state.busy;
      renderMovements();
    }

    function focusQtyInput(syncUserGesture = false){
      const input = els.qtyInput;
      try{
        input.focus({ preventScroll: true });
      }catch(_){
        try{ input.focus(); }catch(__){ }
      }
      try{ input.click(); }catch(_){ }
      try{ input.setSelectionRange(0, input.value.length); }catch(_){
        try{ input.select(); }catch(__){ }
      }

      if (syncUserGesture){
        requestAnimationFrame(() => {
          if (document.activeElement !== input){
            try{
              input.focus({ preventScroll: true });
            }catch(_){
              try{ input.focus(); }catch(__){ }
            }
            try{ input.click(); }catch(_){ }
            try{ input.setSelectionRange(0, input.value.length); }catch(_){
              try{ input.select(); }catch(__){ }
            }
          }
        });
      }
    }

    function openModal(syncUserGesture = false){
      els.produceModal.classList.add("is-open");
      els.produceModal.setAttribute("aria-hidden", "false");
      els.qtyInput.value = "1";
      if (syncUserGesture){
        focusQtyInput(true);
        return;
      }
      requestAnimationFrame(() => focusQtyInput(false));
    }

    function closeModal(){
      els.produceModal.classList.remove("is-open");
      els.produceModal.setAttribute("aria-hidden", "true");
    }

    function clearMovementSubscriptions(){
      if (state.unsubMovements){
        try{ state.unsubMovements(); }catch(_){ }
        state.unsubMovements = null;
      }
      for (const unsub of (state.movementUnsubs || [])){
        try{ unsub(); }catch(_){ }
      }
      state.movementUnsubs = [];
      state.movementBuckets = new Map();
      state.movementSubscribeSig = "";
    }

    function rebuildCodeMovementsFromBuckets(){
      const byId = new Map();
      for (const bucket of (state.movementBuckets || new Map()).values()){
        for (const movement of (bucket || [])){
          if (!movement?.id) continue;
          if (!(isPrimaryCode(movement.code) || isLinkedFbl1000Movement(movement))) continue;
          byId.set(movement.id, movement);
        }
      }
      state.codeMovements = Array.from(byId.values());
      render();
    }

    function refreshMovementSubscriptions(){
      if (!(state.user && state.db)) return;

      const codes = buildTrackedCodes();
      state.trackedCodes = codes;
      const sig = codes.slice().sort().join("|");
      if (sig === state.movementSubscribeSig && (state.movementUnsubs || []).length) return;

      clearMovementSubscriptions();
      state.movementSubscribeSig = sig;

      if (!codes.length){
        state.codeMovements = [];
        render();
        return;
      }

      const chunks = [];
      for (let i = 0; i < codes.length; i += 10){
        chunks.push(codes.slice(i, i + 10));
      }

      chunks.forEach((chunk, index) => {
        const q = chunk.length === 1
          ? query(orgCol("inventoryMovements"), where("code", "==", chunk[0]))
          : query(orgCol("inventoryMovements"), where("code", "in", chunk));

        const unsub = onSnapshot(q, (snap) => {
          state.movementBuckets.set(String(index), snap.docs.map(mapMovement));
          rebuildCodeMovementsFromBuckets();
        }, (err) => {
          console.error("inventoryMovements listener failed", err);
          showToast(humanAuthErr(err), "err");
        });
        state.movementUnsubs.push(unsub);
      });
    }

    function subscribeCodeMovements(){
      if (state.unsubProducts){
        try{ state.unsubProducts(); }catch(_){ }
        state.unsubProducts = null;
      }
      clearMovementSubscriptions();
      state.codeMovements = [];
      state.productRecords = [];
      state.trackedCodes = [];

      if (!(state.user && state.db)){
        render();
        return;
      }

      // Primo aggancio immediato sui codici noti, così anche le bolle già create
      // vengono lette senza aspettare l'anagrafica prodotti.
      refreshMovementSubscriptions();

      // Poi allarghiamo i codici leggibili usando l'anagrafica prodotti del hub:
      // se FBL è un alias, prendiamo tutti i codici reali collegati a quell'alias.
      state.unsubProducts = onSnapshot(orgCol("products"), (snap) => {
        state.productRecords = snap.docs.map(mapProductRecord);
        refreshMovementSubscriptions();
      }, (err) => {
        console.warn("products listener failed", err);
      });
    }

    async function signIn(){
      try{
        await signInWithPopup(state.auth, provider);
      }catch(err){
        console.warn("signIn popup failed", err);
        if (String(err?.code || "").includes("popup-blocked") || String(err?.code || "").includes("operation-not-supported-in-this-environment")){
          try{
            await signInWithRedirect(state.auth, provider);
            return;
          }catch(err2){
            console.warn("signIn redirect failed", err2);
            showToast(humanAuthErr(err2), "err");
            return;
          }
        }
        showToast(humanAuthErr(err), "err");
      }
    }

    async function produceNow(){
      if (state.busy) return;
      if (!(state.user && state.db)){
        showToast("Accedi per produrre", "err");
        return;
      }

      const qty = safeInt(els.qtyInput.value);
      if (!Number.isFinite(qty) || qty <= 0){
        showToast("Inserisci una quantità valida", "err");
        els.qtyInput.focus();
        els.qtyInput.select();
        return;
      }

      state.busy = true;
      render();

      const date = todayYYYYMMDD();
      const docNum = `ESTR-${date}-${Math.random().toString(36).slice(2, 8).toUpperCase()}`;
      const userLabel = state.user.displayName || state.user.email || state.user.uid || "";
      const userEmail = state.user.email || "";

      const payload = {
        type: "IN",
        customer: "Produzione",
        code: CODE,
        item: ITEM_NAME,
        uom: UOM,
        qtyRaw: `${qty} ${UOM}`,
        qty,
        date,
        note: NOTE,
        source: SOURCE,
        rawText: "",
        warehouse: WAREHOUSE,
        docType: "PRODUZIONE",
        docNum,
        docDateRaw: date,
        createdAt: serverTimestamp(),
        createdBy: userLabel,
        createdByName: state.user.displayName || "",
        createdByEmail: userEmail,
        createdByUid: state.user.uid || ""
      };

      try{
        const movementRef = await addDoc(orgCol("inventoryMovements"), payload);
        try{
          const emailData = buildProductionEmail({
            qty,
            docNum,
            date,
            createdAt: new Date(),
            movementId: movementRef?.id || "",
            userLabel,
            userEmail
          });
          await enqueueMatteoEmail(emailData.subject, emailData.textBody, emailData.htmlBody);
        }catch(mailErr){
          console.warn("production email failed", mailErr);
        }
        closeModal();
        showToast(`Caricati ${qty.toLocaleString("it-IT")} ${UOM}`, "ok");
      }catch(err){
        console.error("produceNow failed", err);
        showToast(humanAuthErr(err), "err");
      }finally{
        state.busy = false;
        render();
      }
    }

    async function init(){
      try{
        state.app = initializeApp(FIREBASE_CONFIG);
        state.auth = getAuth(state.app);
        await setPersistence(state.auth, browserLocalPersistence);
        state.db = initializeFirestore(state.app, {
          experimentalAutoDetectLongPolling: true,
          useFetchStreams: false
        });

        try{
          await getRedirectResult(state.auth);
        }catch(err){
          console.warn("getRedirectResult failed", err);
        }

        onAuthStateChanged(state.auth, (user) => {
          state.user = user || null;
          if (state.user){
            subscribeCodeMovements();
          }else{
            if (state.unsubProducts){
              try{ state.unsubProducts(); }catch(_){ }
              state.unsubProducts = null;
            }
            clearMovementSubscriptions();
            state.codeMovements = [];
            state.productRecords = [];
            state.trackedCodes = [];
            render();
          }
          render();
        });
      }catch(err){
        console.error("init failed", err);
        showToast(humanAuthErr(err), "err");
      }

      render();
    }

    els.btnLogin.addEventListener("click", signIn);

    els.btnProduce.addEventListener("click", () => {
      if (!(state.user && state.db)){
        showToast("Accedi per produrre", "err");
        return;
      }
      openModal(true);
    });

    els.btnCancel.addEventListener("click", closeModal);
    els.btnConfirm.addEventListener("click", produceNow);

    els.produceModal.addEventListener("click", (event) => {
      if (event.target === els.produceModal) closeModal();
    });

    els.qtyInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter"){
        event.preventDefault();
        produceNow();
      }
      if (event.key === "Escape"){
        event.preventDefault();
        closeModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && els.produceModal.classList.contains("is-open")){
        closeModal();
      }
    });

    init();
  </script>
</body>
</html>
