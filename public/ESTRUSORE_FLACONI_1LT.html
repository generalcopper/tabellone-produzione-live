<!doctype html>
<html lang="it" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>ESTRUSORE BOTTIGLIA AGRO 1 LT</title>
   <script defer src="/public1/gc_back_to_index.js" data-back-href="./index.html" data-back-label="Indietro"></script>
  <style>
    :root{
      --bg:#f4f6fb;
      --card:#ffffff;
      --ink:#0b1220;
      --ink-soft:#1e293b;
      --muted:#64748b;
      --muted-2:#94a3b8;
      --line:rgba(15,23,42,.08);
      --line-strong:rgba(15,23,42,.14);
      --blue:#1c6fe6;
      --blue-soft:#2f80ed;
      --blue-dark:#1656b2;
      --green:#16a34a;
      --shadow-sm:0 4px 12px rgba(15,23,42,.05);
      --shadow:0 18px 48px rgba(15,23,42,.08);
      --shadow-lg:0 28px 72px rgba(15,23,42,.12);
      --radius:24px;
      --safe-top:env(safe-area-inset-top);
      --safe-bottom:env(safe-area-inset-bottom);
      --max:860px;
    }

    *{ box-sizing:border-box; }
    html,body{
      margin:0;
      min-height:100%;
      background:
        radial-gradient(1100px 460px at 8% -12%, rgba(28,111,230,.20), transparent 62%),
        radial-gradient(900px 480px at 102% -2%, rgba(22,163,74,.10), transparent 60%),
        radial-gradient(700px 700px at 50% 110%, rgba(28,111,230,.06), transparent 60%),
        var(--bg);
      color:var(--ink);
      font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    body{
      padding:calc(16px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
    }

    .shell{
      max-width:var(--max);
      margin:0 auto;
      display:grid;
      gap:16px;
    }

    /* ============ TOPBAR ============ */
    .topbar{
      position:relative;
      overflow:hidden;
      background:
        linear-gradient(140deg, rgba(255,255,255,.98) 0%, rgba(248,251,255,.94) 52%, rgba(240,247,255,.92) 100%);
      backdrop-filter:blur(20px) saturate(1.2);
      -webkit-backdrop-filter:blur(20px) saturate(1.2);
      border:1px solid rgba(255,255,255,1);
      border-radius:30px;
      box-shadow:
        0 28px 72px rgba(15,23,42,.10),
        0 2px 0 rgba(255,255,255,.6),
        inset 0 1px 0 rgba(255,255,255,.95),
        inset 0 -1px 0 rgba(15,23,42,.04);
      padding:20px 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
      isolation:isolate;
    }

    .topbar::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(560px 200px at -4% 0%, rgba(28,111,230,.20), transparent 58%),
        radial-gradient(360px 200px at 102% 0%, rgba(34,197,94,.12), transparent 60%),
        linear-gradient(90deg, rgba(255,255,255,.30), rgba(255,255,255,0));
      pointer-events:none;
      z-index:0;
    }

    .topbar::after{
      content:"";
      position:absolute;
      left:18px;
      right:18px;
      top:0;
      height:1px;
      background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.95), rgba(255,255,255,0));
      pointer-events:none;
      z-index:0;
    }

    .brand{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      gap:18px;
      min-width:0;
      flex:1 1 auto;
    }

    .brand-icon{
      width:74px;
      height:74px;
      flex:0 0 74px;
      border-radius:22px;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 28% 22%, rgba(255,255,255,.92), rgba(255,255,255,0) 46%),
        linear-gradient(155deg, rgba(28,111,230,.22), rgba(28,111,230,.08) 58%, rgba(255,255,255,.75));
      border:1px solid rgba(28,111,230,.16);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.95),
        inset 0 -1px 2px rgba(28,111,230,.08),
        0 14px 32px rgba(28,111,230,.14),
        0 2px 6px rgba(28,111,230,.06);
      position:relative;
    }

    .brand-icon::after{
      content:"";
      position:absolute;
      inset:1px;
      border-radius:21px;
      background:linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,0) 38%);
      pointer-events:none;
    }

    .brand-icon svg{
      width:42px;
      height:42px;
      display:block;
      position:relative;
      z-index:1;
      filter:drop-shadow(0 1px 1px rgba(28,111,230,.18));
    }

    .brand-title{
      min-width:0;
      flex:1 1 auto;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-start;
    }

    .brand-headline{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:10px;
      min-width:0;
      width:100%;
    }

    h1{
      margin:0;
      font-size:clamp(22px, 3.4vw, 32px);
      line-height:1.04;
      letter-spacing:-.035em;
      text-wrap:balance;
      background:linear-gradient(180deg, #0b1220 0%, #1e293b 100%);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      font-weight:900;
    }

    /* ============ LIFETIME COUNTER (header) ============ */
    .header-metrics{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      max-width:100%;
    }

    .lifetime-counter{
      display:inline-flex;
      align-items:center;
      gap:10px;
      min-height:34px;
      padding:6px 14px 6px 6px;
      border-radius:999px;
      background:
        radial-gradient(circle at 18% 22%, rgba(255,255,255,.95), rgba(255,255,255,0) 54%),
        linear-gradient(135deg, rgba(28,111,230,.10), rgba(22,163,74,.07));
      border:1px solid rgba(28,111,230,.16);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.96),
        0 6px 16px rgba(28,111,230,.08),
        0 1px 2px rgba(15,23,42,.04);
      white-space:nowrap;
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .lifetime-counter-dot{
      width:24px;
      height:24px;
      flex:0 0 24px;
      border-radius:999px;
      display:grid;
      place-items:center;
      background:linear-gradient(145deg, #2f80ed, #1656b2);
      color:#fff;
      font-size:13px;
      font-weight:900;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.45),
        0 2px 6px rgba(28,111,230,.30);
      position:relative;
    }

    .lifetime-counter-dot::after{
      content:"";
      position:absolute;
      inset:-3px;
      border-radius:999px;
      background:rgba(28,111,230,.20);
      animation:pulse 2.4s ease-in-out infinite;
      z-index:-1;
    }

    @keyframes pulse{
      0%,100%{ opacity:.0; transform:scale(.85); }
      50%{ opacity:.6; transform:scale(1.15); }
    }

    .lifetime-counter-text{
      display:inline-flex;
      align-items:baseline;
      gap:7px;
      line-height:1;
      min-width:0;
    }

    .lifetime-counter-value{
      font-size:16px;
      font-weight:950;
      letter-spacing:-.025em;
      color:var(--ink);
      font-variant-numeric:tabular-nums;
      transition:color .2s ease;
    }

    .lifetime-counter-label{
      font-size:10px;
      font-weight:900;
      letter-spacing:.10em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .weekly-counter{
      background:
        radial-gradient(circle at 18% 22%, rgba(255,255,255,.95), rgba(255,255,255,0) 54%),
        linear-gradient(135deg, rgba(22,163,74,.11), rgba(28,111,230,.06));
      border-color:rgba(22,163,74,.18);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.96),
        0 6px 16px rgba(22,163,74,.08),
        0 1px 2px rgba(15,23,42,.04);
    }

    .weekly-counter .lifetime-counter-dot{
      background:linear-gradient(145deg, #22c55e, #15803d);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.45),
        0 2px 6px rgba(22,163,74,.30);
    }

    .weekly-counter .lifetime-counter-dot::after{
      background:rgba(22,163,74,.20);
    }

    .top-actions{
      position:relative;
      z-index:1;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    /* ============ BUTTONS ============ */
    .btn{
      appearance:none;
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      min-height:48px;
      padding:0 20px;
      border-radius:15px;
      font-size:14px;
      font-weight:900;
      letter-spacing:-.005em;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(15,23,42,.06), inset 0 1px 0 rgba(255,255,255,.9);
      transition:transform .14s ease, filter .14s ease, opacity .14s ease, background .14s ease, box-shadow .14s ease;
    }
    .btn:hover{ filter:brightness(1.02); transform:translateY(-1px); }
    .btn:active{ transform:scale(.985); }
    .btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; filter:saturate(.6); }

    .btn-primary{
      background:linear-gradient(145deg, #2f80ed 0%, #1656b2 100%);
      border-color:rgba(28,111,230,.50);
      color:#fff;
      box-shadow:
        0 14px 32px rgba(28,111,230,.28),
        0 2px 6px rgba(28,111,230,.16),
        inset 0 1px 0 rgba(255,255,255,.32),
        inset 0 -1px 0 rgba(15,23,42,.18);
    }
    .btn-primary:hover{
      box-shadow:
        0 18px 38px rgba(28,111,230,.34),
        0 3px 8px rgba(28,111,230,.20),
        inset 0 1px 0 rgba(255,255,255,.34),
        inset 0 -1px 0 rgba(15,23,42,.18);
    }

    .btn-secondary{
      background:#eef4ff;
      border-color:rgba(28,111,230,.18);
      color:var(--blue);
    }

    /* ============ SECTIONS ============ */
    .section{
      background:rgba(255,255,255,.92);
      backdrop-filter:blur(16px) saturate(1.15);
      -webkit-backdrop-filter:blur(16px) saturate(1.15);
      border:1px solid rgba(255,255,255,.95);
      border-radius:28px;
      box-shadow:
        var(--shadow),
        inset 0 1px 0 rgba(255,255,255,.96);
      padding:22px;
      display:grid;
      gap:16px;
    }

    .section-title{
      margin:0;
      font-size:12px;
      font-weight:900;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--muted);
      display:flex;
      align-items:center;
      gap:10px;
    }

    .section-title::before{
      content:"";
      width:6px;
      height:6px;
      border-radius:999px;
      background:linear-gradient(145deg, var(--blue), var(--blue-dark));
      box-shadow:0 0 0 3px rgba(28,111,230,.12);
      flex:0 0 6px;
    }

    /* ============ PRODUCE BUTTON ============ */
    .produce-wrap{
      display:grid;
      gap:12px;
    }

    .produce-btn{
      appearance:none;
      border:0;
      position:relative;
      overflow:hidden;
      background:
        radial-gradient(circle at 18% 14%, rgba(255,255,255,.34), rgba(255,255,255,0) 48%),
        radial-gradient(circle at 82% 110%, rgba(0,0,0,.12), rgba(0,0,0,0) 52%),
        linear-gradient(145deg, #2f80ed 0%, #1656b2 100%);
      color:#fff;
      width:100%;
      min-height:clamp(170px, 34vh, 270px);
      border-radius:28px;
      padding:20px;
      text-align:center;
      font-size:clamp(30px, 5vw, 54px);
      line-height:1.04;
      font-weight:900;
      letter-spacing:-.025em;
      cursor:pointer;
      box-shadow:
        0 24px 56px rgba(28,111,230,.34),
        0 4px 12px rgba(28,111,230,.20),
        inset 0 1px 0 rgba(255,255,255,.30),
        inset 0 -2px 0 rgba(15,23,42,.18);
      transition:transform .16s ease, filter .16s ease, opacity .16s ease, box-shadow .16s ease;
      text-shadow:0 2px 6px rgba(0,0,0,.20);
    }

    .produce-btn::before{
      content:"";
      position:absolute;
      top:0;
      left:-60%;
      width:50%;
      height:100%;
      background:linear-gradient(105deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.18) 50%, rgba(255,255,255,0) 100%);
      transform:skewX(-18deg);
      pointer-events:none;
      transition:left .9s ease;
    }

    .produce-btn:not(:disabled):hover::before{
      left:120%;
    }

    .produce-btn:not(:disabled):hover{
      filter:brightness(1.04);
      transform:translateY(-2px);
      box-shadow:
        0 30px 64px rgba(28,111,230,.40),
        0 6px 16px rgba(28,111,230,.24),
        inset 0 1px 0 rgba(255,255,255,.32),
        inset 0 -2px 0 rgba(15,23,42,.18);
    }
    .produce-btn:not(:disabled):active{ transform:scale(.992) translateY(0); }
    .produce-btn:disabled{ opacity:.55; cursor:not-allowed; filter:saturate(.5); }

    .current-user{
      min-height:42px;
      padding:11px 16px;
      border-radius:14px;
      background:linear-gradient(180deg, #f8fbff 0%, #f1f6fd 100%);
      border:1px solid rgba(28,111,230,.10);
      font-size:14px;
      font-weight:800;
      color:var(--muted);
      overflow-wrap:anywhere;
      display:flex;
      align-items:center;
      gap:9px;
    }

    .current-user::before{
      content:"";
      width:7px;
      height:7px;
      border-radius:999px;
      background:var(--muted-2);
      flex:0 0 7px;
      transition:background .25s ease, box-shadow .25s ease;
    }

    .current-user.is-online{
      color:var(--ink);
    }

    .current-user.is-online::before{
      background:var(--green);
      box-shadow:0 0 0 3px rgba(22,163,74,.18);
    }

    /* ============ STOCK BOX ============ */
    .stock-box{
      min-height:120px;
      border-radius:24px;
      padding:24px 26px;
      background:
        radial-gradient(circle at 14% 14%, rgba(255,255,255,.78), rgba(255,255,255,0) 42%),
        linear-gradient(145deg, rgba(28,111,230,.12), rgba(28,111,230,.04) 58%, rgba(255,255,255,.94));
      border:1px solid rgba(28,111,230,.14);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.96),
        inset 0 -1px 0 rgba(28,111,230,.06),
        0 12px 28px rgba(28,111,230,.08);
      display:grid;
      gap:8px;
      align-content:center;
      justify-items:start;
      position:relative;
      overflow:hidden;
    }

    .stock-box::after{
      content:"";
      position:absolute;
      top:-30px;
      right:-30px;
      width:160px;
      height:160px;
      border-radius:999px;
      background:radial-gradient(circle, rgba(28,111,230,.10), transparent 70%);
      pointer-events:none;
    }

    .stock-qty{
      font-size:clamp(40px, 7vw, 64px);
      line-height:1;
      font-weight:900;
      letter-spacing:-.04em;
      color:var(--ink);
      font-variant-numeric:tabular-nums;
      position:relative;
      z-index:1;
    }

    .stock-meta{
      font-size:12px;
      font-weight:900;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--muted);
      position:relative;
      z-index:1;
    }

    /* ============ MOVEMENTS ============ */
    .movements{
      display:grid;
      gap:10px;
    }

    .movement{
      background:linear-gradient(180deg, #ffffff 0%, #fbfcfe 100%);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px 16px 14px 18px;
      display:grid;
      gap:8px;
      box-shadow:var(--shadow-sm);
      position:relative;
      transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
    }

    .movement::before{
      content:"";
      position:absolute;
      left:0;
      top:14px;
      bottom:14px;
      width:3px;
      border-radius:0 3px 3px 0;
      background:linear-gradient(180deg, var(--blue), var(--blue-dark));
      opacity:.0;
      transition:opacity .14s ease;
    }

    .movement:hover{
      transform:translateY(-1px);
      border-color:rgba(28,111,230,.18);
      box-shadow:0 10px 24px rgba(15,23,42,.08);
    }
    .movement:hover::before{ opacity:1; }

    .movement-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
    }

    .movement-qty{
      font-size:20px;
      font-weight:900;
      letter-spacing:-.02em;
      font-variant-numeric:tabular-nums;
    }

    .movement-user{
      font-size:14px;
      font-weight:800;
      color:var(--ink);
      text-align:right;
      overflow-wrap:anywhere;
    }

    .movement-date{
      font-size:13px;
      font-weight:700;
      color:var(--muted);
    }

    .empty{
      padding:18px 4px;
      color:var(--muted);
      font-weight:700;
      text-align:center;
      font-size:14px;
    }

    /* ============ MODAL ============ */
    .modal{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.32);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:100;
      opacity:0;
      visibility:hidden;
      pointer-events:none;
      transition:opacity .18s ease, visibility .18s ease;
    }

    .modal.is-open{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }

    .modal-card{
      width:min(420px, 100%);
      background:linear-gradient(180deg, #ffffff 0%, #fafbfd 100%);
      border:1px solid rgba(255,255,255,.95);
      border-radius:24px;
      box-shadow:
        0 32px 80px rgba(15,23,42,.22),
        0 4px 12px rgba(15,23,42,.10),
        inset 0 1px 0 rgba(255,255,255,1);
      padding:22px;
      display:grid;
      gap:14px;
      transform:translateY(8px) scale(.98);
      opacity:0;
      transition:transform .22s cubic-bezier(.34,1.56,.64,1), opacity .22s ease;
    }

    .modal.is-open .modal-card{
      transform:translateY(0) scale(1);
      opacity:1;
    }

    .modal-card h2{
      margin:0;
      font-size:26px;
      line-height:1.08;
      letter-spacing:-.02em;
      font-weight:900;
    }

    .field{
      display:grid;
      gap:8px;
    }

    .field label{
      font-size:11px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .field input{
      width:100%;
      appearance:none;
      border:1px solid var(--line);
      border-radius:16px;
      min-height:58px;
      padding:0 16px;
      font-size:28px;
      font-weight:900;
      text-align:center;
      color:var(--ink);
      background:#fff;
      outline:none;
      font-variant-numeric:tabular-nums;
      transition:border-color .14s ease, box-shadow .14s ease;
    }

    .field input:focus{
      border-color:rgba(28,111,230,.55);
      box-shadow:0 0 0 4px rgba(28,111,230,.14);
    }

    .modal-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    /* ============ TOAST ============ */
    .toast{
      position:fixed;
      left:50%;
      bottom:calc(20px + var(--safe-bottom));
      transform:translateX(-50%) translateY(14px);
      opacity:0;
      pointer-events:none;
      z-index:120;
      background:rgba(15,23,42,.94);
      color:#fff;
      border-radius:14px;
      padding:13px 18px;
      font-size:14px;
      font-weight:800;
      box-shadow:0 22px 48px rgba(15,23,42,.24), inset 0 1px 0 rgba(255,255,255,.10);
      transition:opacity .20s ease, transform .20s ease;
      max-width:min(90vw, 520px);
      text-align:center;
      backdrop-filter:blur(8px);
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    .toast.ok{ background:rgba(22,163,74,.96); }
    .toast.err{ background:rgba(220,38,38,.96); }

    /* ============ MOBILE ============ */
    @media (max-width: 640px){
      body{
        padding-left:12px;
        padding-right:12px;
      }
      .topbar{
        padding:16px 16px;
        border-radius:26px;
      }
      .section{
        padding:16px;
        border-radius:24px;
      }
      .brand{
        gap:14px;
      }
      .brand-icon{
        width:60px;
        height:60px;
        flex-basis:60px;
        border-radius:18px;
      }
      .brand-icon svg{
        width:36px;
        height:36px;
      }
      .brand-headline{
        gap:8px;
      }
      .lifetime-counter{
        min-height:32px;
        padding:5px 12px 5px 5px;
      }
      .lifetime-counter-dot{
        width:22px;
        height:22px;
        flex-basis:22px;
        font-size:12px;
      }
      .lifetime-counter-value{
        font-size:15px;
      }
      .lifetime-counter-label{
        font-size:9px;
      }
      .produce-btn{
        min-height:210px;
        font-size:clamp(26px, 8vw, 42px);
      }
      .movement-top,
      .modal-actions{
        grid-template-columns:1fr;
      }
      .movement-user{
        text-align:left;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">

    function safeInt(value){
      const n = parseInt(String(value ?? "").replace(/[^\d-]/g, ""), 10);
      return Number.isFinite(n) ? n : 0;
    }

    function normalizeCodeKey(value){
      return String(value || "").trim().toLowerCase().replace(/[\s_-]+/g, "");
    }

    function isPrimaryCode(value){
      return normalizeCodeKey(value) === normalizeCodeKey(CODE);
    }

    function isLinkedFbl1000Code(value){
      const key = normalizeCodeKey(value);
      if (!key) return false;
      return LINKED_FBL1000_CODES.some(code => normalizeCodeKey(code) === key) || key.startsWith("fbl1000");
    }

    function isNeutralMovement(mv){
      return mv?.nonStockItem === true || mv?.inventoryNeutral === true || mv?.stockNeutral === true || mv?.alwaysAvailableItem === true;
    }

    function normalizeWarehouse(value){
      const s = String(value || "").trim().toLowerCase();
      if (!s) return WAREHOUSE;
      if (s === "cerea" || s.startsWith("cer") || s.includes("cerea")) return WAREHOUSE;
      return s;
    }

    function tsToDate(ts){
      try{
        if (!ts) return null;
        if (typeof ts.toDate === "function") return ts.toDate();
        if (ts instanceof Date) return ts;
        const d = new Date(ts);
        return Number.isNaN(d.getTime()) ? null : d;
      }catch(_){
        return null;
      }
    }

    function fmtDateTime(ts){
      const d = tsToDate(ts);
      if (!d) return "—";
      try{
        return d.toLocaleString("it-IT", { dateStyle: "short", timeStyle: "short" });
      }catch(_){
        return d.toLocaleString("it-IT");
      }
    }

    function todayYYYYMMDD(){
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: TZ,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());
      const map = Object.fromEntries(parts.map(p => [p.type, p.value]));
      return `${map.year}-${map.month}-${map.day}`;
    }

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function titleizeWords(value){
      return String(value || "")
        .split(/\s+/)
        .filter(Boolean)
        .map(part => part.charAt(0).toUpperCase() + part.slice(1).toLowerCase())
        .join(" ");
    }

    function prettifyUserLabel(value){
      const raw = String(value || "").trim();
      if (!raw) return "—";
      if (raw.includes("@")){
        const local = raw.split("@")[0].replace(/[._-]+/g, " ").trim();
        const pretty = titleizeWords(local);
        return pretty || raw;
      }
      if (!raw.includes(" ") && /[._-]/.test(raw)){
        const pretty = titleizeWords(raw.replace(/[._-]+/g, " ").trim());
        return pretty || raw;
      }
      return raw;
    }

    let toastTimer = null;

      for (const key of Object.keys(map)){
        if (code.includes(key)) return map[key];

    async function enqueueMatteoEmail(subject, textBody, htmlBody = ""){

        const safeText = String(textBody || "").trim() || "Evento registrato.";

    function buildProductionEmail({ qty, docNum, date, createdAt, movementId, userLabel, userEmail }){

      const textBody = [

        `Articolo: ${ITEM_NAME}`,

        `ID movimento: ${movementId || "—"}`,
        "",
        "Messaggio generato automaticamente dal pannello Estrusore Flaconi 1 LT."
      ].join("\n");
      const htmlBody = `
        <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;color:#111;line-height:1.5;">
          <div style="font-size:18px;font-weight:900;margin:0 0 10px;">Produzione registrata · Estrusore Flaconi 1 LT</div>
          <div style="margin:0 0 14px;color:#374151;">È stata registrata una nuova produzione sull'estrusore.</div>
          <div style="padding:14px 16px;border:1px solid #e5e7eb;border-radius:16px;background:#fafafa;">
            <div><strong>Articolo:</strong> ${escapeHtml(ITEM_NAME)}</div>
            <div><strong>Codice articolo:</strong> ${escapeHtml(CODE)}</div>
            <div><strong>Quantità prodotta:</strong> ${escapeHtml(qtyLabel)}</div>

            <div><strong>Data operazione:</strong> ${escapeHtml(date)}</div>

          <div style="margin-top:14px;font-size:12px;color:#6b7280;">Messaggio generato automaticamente dal pannello Estrusore Flaconi 1 LT.</div>

      return { subject, textBody, htmlBody };
    }

    function mapMovement(docSnap){
      const data = docSnap.data() || {};
      return {
        id: docSnap.id,
        type: String(data.type || "IN").trim(),
        code: String(data.code || "").trim(),
        qty: safeInt(data.qty),
        uom: String(data.uom || UOM).trim() || UOM,
        warehouse: String(data.warehouse || "").trim(),
        source: String(data.source || "").trim(),
        docType: String(data.docType || "").trim(),
        docNum: String(data.docNum || "").trim(),
        note: String(data.note || "").trim(),
        customer: String(data.customer || "").trim(),
        nonStockItem: data.nonStockItem === true,
        inventoryNeutral: data.inventoryNeutral === true,
        stockNeutral: data.stockNeutral === true,
        alwaysAvailableItem: data.alwaysAvailableItem === true,
        estrusoreSync: data.estrusoreSync === true,
        estrusoreLinkedMovementId: String(data.estrusoreLinkedMovementId || data.linkedMovementId || "").trim(),
        estrusoreMirrorFromCode: String(data.estrusoreMirrorFromCode || data.mirrorFromCode || "").trim(),
        linkedDdtId: String(data.linkedDdtId || data.estrusoreLinkedDdtId || "").trim(),
        linkedDdtNumber: String(data.linkedDdtNumber || data.estrusoreLinkedDdtNumber || "").trim(),
        createdAt: data.createdAt || data.date || null,
        createdByName: String(data.createdByName || data.userName || data.displayName || "").trim(),
        createdBy: String(data.createdBy || data.userEmail || data.user || data.author || "").trim()
      };
    }

    function resolveUserLabel(){
      if (!state.user) return "Non connesso";
      return prettifyUserLabel(state.user.displayName || state.user.email || state.user.uid || "Connesso");
    }

    function buildMirroredSourceMovementIds(){
      const ids = new Set();
      for (const mv of (state.codeMovements || [])){
        if (!mv || !isPrimaryCode(mv.code) || mv.estrusoreSync !== true) continue;
        const sourceId = String(mv.estrusoreLinkedMovementId || "").trim();
        if (sourceId) ids.add(sourceId);
      }
      return ids;
    }

    function extractCereaMovements(){
      const mirroredSourceIds = buildMirroredSourceMovementIds();
      return (state.codeMovements || []).filter(mv => {
        if (!mv || normalizeWarehouse(mv.warehouse) !== WAREHOUSE) return false;
        if (isNeutralMovement(mv)) return false;
        if (isPrimaryCode(mv.code)) return true;
        if (isLinkedFbl1000Code(mv.code)){
          // Storico: mostra anche gli scarichi FBL1000 già creati da Porta a Conca.
          // Futuro: se Inventario ha scritto il mirror ST0090B03BI01E, non contare due volte.
          return !mirroredSourceIds.has(String(mv.id || "").trim());
        }
        return false;
      });
    }

    function resolveUom(){
      const fromMov = extractCereaMovements()
        .map(mv => String(mv.uom || "").trim())
        .find(Boolean);

      return fromMov || UOM;
    }

    function computeStockTotal(){
      return extractCereaMovements().reduce((sum, mv) => {
        const qty = safeInt(mv.qty);
        return sum + (String(mv.type || "").toUpperCase() === "OUT" ? -qty : qty);
      }, 0);
    }

    function isEstrusoreProductionMovement(mv){
      if (!mv || !isPrimaryCode(mv.code)) return false;
      if (normalizeWarehouse(mv.warehouse) !== WAREHOUSE) return false;
      if (isNeutralMovement(mv)) return false;
      if (mv.estrusoreSync === true) return false;
      if (String(mv.estrusoreLinkedMovementId || "").trim()) return false;
      if (String(mv.estrusoreMirrorFromCode || "").trim()) return false;
      if (String(mv.type || "").toUpperCase() !== "IN") return false;

      const source = String(mv.source || "").trim().toLowerCase();
      const docNum = String(mv.docNum || "").trim().toUpperCase();

      // Contatore "prodotti da sempre": conta solo le produzioni dirette
      // create da questo pannello Estrusore, evitando carichi manuali,
      // rettifiche positive, movimenti generati da hub/DDT o codici collegati FBL1000.
      return source === SOURCE.toLowerCase() || docNum.startsWith("ESTR-");
    }

    function getEstrusoreProductionMovements(){
      const countedIds = new Set();
      return (state.codeMovements || []).filter(mv => {
        if (!isEstrusoreProductionMovement(mv)) return false;
        const key = String(mv.id || "").trim();
        if (!key) return true;
        if (countedIds.has(key)) return false;
        countedIds.add(key);
        return true;
      });
    }

    function computeLifetimeProduced(){
      return getEstrusoreProductionMovements().reduce((sum, mv) => {
        return sum + Math.max(0, safeInt(mv.qty));
      }, 0);
    }

    function computeWeeklyAverageProduced(){
      const list = getEstrusoreProductionMovements();
      if (!list.length) return 0;

      const total = list.reduce((sum, mv) => sum + Math.max(0, safeInt(mv.qty)), 0);
      if (total <= 0) return 0;

      const dates = list
        .map(mv => tsToDate(mv.createdAt))
        .filter(date => date && Number.isFinite(date.getTime()))
        .map(date => date.getTime());

      // Media da sempre: dalla prima produzione valida registrata a oggi.
      // Usa almeno 1 settimana per evitare valori gonfiati quando le prime registrazioni sono recenti.
      if (!dates.length) return Math.round(total);

      const firstProductionAt = Math.min(...dates);
      const weekMs = 7 * 24 * 60 * 60 * 1000;
      const elapsedWeeks = Math.max(1, (Date.now() - firstProductionAt) / weekMs);
      return Math.round(total / elapsedWeeks);
    }

    function renderMovements(){
      if (!state.user){
        els.movements.innerHTML = '<div class="empty">Accedi per vedere i movimenti.</div>';
        return;
      }

      const list = extractCereaMovements().slice()
        .sort((a, b) => {
          const at = tsToDate(a.createdAt)?.getTime() || 0;
          const bt = tsToDate(b.createdAt)?.getTime() || 0;
          return bt - at;
        })
        .slice(0, 30);

      if (!list.length){
        els.movements.innerHTML = '<div class="empty">Nessun movimento trovato.</div>';
        return;
      }

      els.movements.innerHTML = list.map(mv => {
        const sign = String(mv.type || "IN").toUpperCase() === "OUT" ? "-" : "+";
        const who = prettifyUserLabel(mv.createdByName || mv.createdBy);
        return `
          <div class="movement">
            <div class="movement-top">
              <div class="movement-qty">${escapeHtml(sign + " " + mv.qty.toLocaleString("it-IT") + " " + (mv.uom || UOM))}</div>
              <div class="movement-user">${escapeHtml(who)}</div>
            </div>
            <div class="movement-date">${escapeHtml(fmtDateTime(mv.createdAt))}</div>
          </div>
        `;
      }).join("");
    }

    function animateNumber(element, targetValue, duration = 900){
      if (!element) return;
      const prev = parseInt(element.dataset.currentValue ?? "0", 10);
      const target = Number.isFinite(targetValue) ? targetValue : 0;

      // First paint or no change: write directly, no animation.
      if (element.dataset.currentValue === undefined || prev === target){
        element.textContent = target.toLocaleString("it-IT");
        element.dataset.currentValue = String(target);
        return;
      }

      // Cancel any in-flight animation on this element.
      if (element._numAnimRaf){
        cancelAnimationFrame(element._numAnimRaf);
        element._numAnimRaf = null;
      }

      const start = performance.now();
      const diff = target - prev;

      function step(now){
        const elapsed = now - start;
        const t = Math.min(elapsed / duration, 1);
        // ease-out cubic
        const eased = 1 - Math.pow(1 - t, 3);
        const current = Math.round(prev + diff * eased);
        element.textContent = current.toLocaleString("it-IT");
        if (t < 1){
          element._numAnimRaf = requestAnimationFrame(step);
        }else{
          element.dataset.currentValue = String(target);
          element._numAnimRaf = null;
        }
      }

      element._numAnimRaf = requestAnimationFrame(step);
    }

    function setNumericDisplay(element, value){
      if (!element) return;
      if (value === null || value === undefined){
        element.textContent = "—";
        delete element.dataset.currentValue;
        if (element._numAnimRaf){
          cancelAnimationFrame(element._numAnimRaf);
          element._numAnimRaf = null;
        }
        return;
      }
      animateNumber(element, value);
    }

    function render(){
      els.currentUser.textContent = resolveUserLabel();
      els.currentUser.classList.toggle("is-online", !!state.user);

      setNumericDisplay(els.stockQty, state.user ? computeStockTotal() : null);

      if (els.stockMeta){
        els.stockMeta.textContent = resolveUom();
      }

      setNumericDisplay(els.lifetimeProduced, state.user ? computeLifetimeProduced() : null);
      setNumericDisplay(els.weeklyAverageProduced, state.user ? computeWeeklyAverageProduced() : null);

      els.btnLogin.hidden = !!state.user;
      els.btnProduce.disabled = !(state.user && state.db) || state.busy;
      renderMovements();
    }

    function focusQtyInput(syncUserGesture = false){
      const input = els.qtyInput;
      try{
        input.focus({ preventScroll: true });
      }catch(_){
        try{ input.focus(); }catch(__){ }
      }
      try{ input.click(); }catch(_){ }
      try{ input.setSelectionRange(0, input.value.length); }catch(_){
        try{ input.select(); }catch(__){ }
      }

      if (syncUserGesture){
        requestAnimationFrame(() => {
          if (document.activeElement !== input){
            try{
              input.focus({ preventScroll: true });
            }catch(_){
              try{ input.focus(); }catch(__){ }
            }
            try{ input.click(); }catch(_){ }
            try{ input.setSelectionRange(0, input.value.length); }catch(_){
              try{ input.select(); }catch(__){ }
            }
          }
        });
      }
    }

    function openModal(syncUserGesture = false){
      els.produceModal.classList.add("is-open");
      els.produceModal.setAttribute("aria-hidden", "false");
      els.qtyInput.value = "1";
      if (syncUserGesture){
        focusQtyInput(true);
        return;
      }
      requestAnimationFrame(() => focusQtyInput(false));
    }

    function closeModal(){
      els.produceModal.classList.remove("is-open");
      els.produceModal.setAttribute("aria-hidden", "true");
    }

    function subscribeCodeMovements(){
      if (state.unsubMovements){
        try{ state.unsubMovements(); }catch(_){ }
        state.unsubMovements = null;
      }

      state.codeMovements = [];

      if (!(state.user && state.db)){
        render();
        return;
      }

      const q = query(orgCol("inventoryMovements"), where("code", "in", TRACKED_CODES));
      state.unsubMovements = onSnapshot(q, (snap) => {
        const byId = new Map();
        for (const movement of snap.docs.map(mapMovement)){
          if (!movement?.id) continue;
          byId.set(movement.id, movement);
        }
        state.codeMovements = Array.from(byId.values());
        render();
      }, (err) => {
        console.error("inventoryMovements listener failed", err);
        showToast(humanAuthErr(err), "err");
      });
    }

    async function signIn(){
      try{
        await signInWithPopup(state.auth, provider);
      }catch(err){
        console.warn("signIn popup failed", err);
        if (String(err?.code || "").includes("popup-blocked") || String(err?.code || "").includes("operation-not-supported-in-this-environment")){
          try{
            await signInWithRedirect(state.auth, provider);
            return;
          }catch(err2){
            console.warn("signIn redirect failed", err2);
            showToast(humanAuthErr(err2), "err");
            return;
          }
        }
        showToast(humanAuthErr(err), "err");
      }
    }

    async function produceNow(){
      if (state.busy) return;
      if (!(state.user && state.db)){
        showToast("Accedi per produrre", "err");
        return;
      }

      const qty = safeInt(els.qtyInput.value);
      if (!Number.isFinite(qty) || qty <= 0){
        showToast("Inserisci una quantità valida", "err");
        els.qtyInput.focus();
        els.qtyInput.select();
        return;
      }

      state.busy = true;
      render();

      const date = todayYYYYMMDD();
      const docNum = `ESTR-${date}-${Math.random().toString(36).slice(2, 8).toUpperCase()}`;
      const userLabel = state.user.displayName || state.user.email || state.user.uid || "";
      const userEmail = state.user.email || "";

      const payload = {
        type: "IN",
        customer: "Produzione",
        code: CODE,
        item: ITEM_NAME,
        uom: UOM,
        qtyRaw: `${qty} ${UOM}`,
        qty,
        date,
        note: NOTE,
        source: SOURCE,
        rawText: "",
        warehouse: WAREHOUSE,
        docType: "PRODUZIONE",
        docNum,
        docDateRaw: date,
        createdAt: serverTimestamp(),
        createdBy: userLabel,
        createdByName: state.user.displayName || "",
        createdByEmail: userEmail,
        createdByUid: state.user.uid || ""
      };

      try{
        const movementRef = await addDoc(orgCol("inventoryMovements"), payload);
        try{
          const emailData = buildProductionEmail({
            qty,
            docNum,
            date,
            createdAt: new Date(),
            movementId: movementRef?.id || "",
            userLabel,
            userEmail
          });
          await enqueueMatteoEmail(emailData.subject, emailData.textBody, emailData.htmlBody);
        }catch(mailErr){
          console.warn("production email failed", mailErr);
        }
        closeModal();
        showToast(`Caricati ${qty.toLocaleString("it-IT")} ${UOM}`, "ok");
      }catch(err){
        console.error("produceNow failed", err);
        showToast(humanAuthErr(err), "err");
      }finally{
        state.busy = false;
        render();
      }
    }

    async function init(){
      try{
        state.app = initializeApp(FIREBASE_CONFIG);
        state.auth = getAuth(state.app);
        await setPersistence(state.auth, browserLocalPersistence);
        state.db = initializeFirestore(state.app, {
          experimentalAutoDetectLongPolling: true,
          useFetchStreams: false
        });

        try{
          await getRedirectResult(state.auth);
        }catch(err){
          console.warn("getRedirectResult failed", err);
        }

        onAuthStateChanged(state.auth, (user) => {
          state.user = user || null;
          if (state.user){
            subscribeCodeMovements();
          }else{
            if (state.unsubMovements){
              try{ state.unsubMovements(); }catch(_){ }
              state.unsubMovements = null;
            }
            state.codeMovements = [];
            render();
          }
          render();
        });
      }catch(err){
        console.error("init failed", err);
        showToast(humanAuthErr(err), "err");
      }

      render();
    }

    els.btnLogin.addEventListener("click", signIn);

    els.btnProduce.addEventListener("click", () => {
      if (!(state.user && state.db)){
        showToast("Accedi per produrre", "err");
        return;
      }
      openModal(true);
    });

    els.btnCancel.addEventListener("click", closeModal);
    els.btnConfirm.addEventListener("click", produceNow);

    els.produceModal.addEventListener("click", (event) => {
      if (event.target === els.produceModal) closeModal();
    });

    els.qtyInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter"){
        event.preventDefault();
        produceNow();
      }
      if (event.key === "Escape"){
        event.preventDefault();
        closeModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && els.produceModal.classList.contains("is-open")){
        closeModal();
      }
    });

    init();
  </script>
</body>
</html>
