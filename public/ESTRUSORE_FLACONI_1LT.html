<!doctype html>
<html lang="it" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>ESTRUSORE BOTTIGLIA AGRO 1 LT</title>
  <style>
    :root{
      --bg:#f4f7fc;
      --card:rgba(255,255,255,.9);
      --card-solid:#ffffff;
      --ink:#0f172a;
      --muted:#64748b;
      --line:rgba(15,23,42,.08);
      --blue:#1c6fe6;
      --blue-dark:#174fa8;
      --green:#14b85c;
      --shadow:0 20px 46px rgba(15,23,42,.09);
      --safe-top:env(safe-area-inset-top);
      --safe-bottom:env(safe-area-inset-bottom);
      --max:920px;
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      min-height:100%;
      background:
        radial-gradient(900px 420px at 10% -12%, rgba(28,111,230,.18), transparent 62%),
        radial-gradient(720px 360px at 100% 0%, rgba(20,184,92,.10), transparent 60%),
        linear-gradient(180deg, #f9fbff 0%, #f4f7fc 100%);
      color:var(--ink);
      font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    body{
      padding:calc(16px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
    }

    .shell{
      max-width:var(--max);
      margin:0 auto;
      display:grid;
      gap:16px;
    }

    .hero{
      position:relative;
      overflow:hidden;
      isolation:isolate;
      background:
        linear-gradient(140deg, rgba(255,255,255,.98) 0%, rgba(244,249,255,.94) 55%, rgba(240,247,255,.92) 100%);
      border:1px solid rgba(255,255,255,.95);
      border-radius:34px;
      box-shadow:
        0 28px 70px rgba(15,23,42,.11),
        inset 0 1px 0 rgba(255,255,255,.96),
        inset 0 -1px 0 rgba(15,23,42,.03);
      padding:24px;
      display:grid;
      grid-template-columns:minmax(0,1.35fr) auto;
      gap:20px;
      align-items:center;
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    .hero::before{
      content:"";
      position:absolute;
      inset:-10% -10% auto auto;
      width:360px;
      height:360px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(28,111,230,.14), rgba(28,111,230,0) 68%);
      pointer-events:none;
      z-index:0;
    }

    .hero::after{
      content:"";
      position:absolute;
      inset:auto auto -90px -80px;
      width:280px;
      height:220px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(20,184,92,.10), rgba(20,184,92,0) 72%);
      pointer-events:none;
      z-index:0;
    }

    .hero-copy,
    .hero-side{
      position:relative;
      z-index:1;
    }

    .hero-kicker{
      display:inline-flex;
      align-items:center;
      gap:10px;
      min-height:36px;
      padding:0 14px;
      border-radius:999px;
      background:rgba(15,23,42,.05);
      border:1px solid rgba(15,23,42,.05);
      color:#17325f;
      font-size:12px;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.88);
    }

    .hero-kicker::before{
      content:"";
      width:8px;
      height:8px;
      border-radius:50%;
      background:linear-gradient(180deg, #2d86ff 0%, #1656b2 100%);
      box-shadow:0 0 0 7px rgba(28,111,230,.10);
      flex:0 0 8px;
    }

    .hero h1{
      margin:16px 0 0;
      font-size:clamp(34px, 6vw, 62px);
      line-height:.94;
      letter-spacing:-.055em;
      text-wrap:balance;
    }

    .hero h1 .heavy{
      display:block;
      font-weight:950;
      color:#0b1220;
      text-shadow:0 1px 0 rgba(255,255,255,.65);
    }

    .hero h1 .lite{
      display:block;
      font-weight:820;
      color:#1a56b8;
      filter:drop-shadow(0 14px 22px rgba(28,111,230,.10));
    }

    .hero-meta{
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-top:16px;
    }

    .chip{
      min-height:40px;
      padding:0 14px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      gap:10px;
      background:rgba(255,255,255,.76);
      border:1px solid rgba(15,23,42,.07);
      color:#25406d;
      font-size:13px;
      font-weight:850;
      box-shadow:0 10px 24px rgba(15,23,42,.05);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }

    .chip .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--blue);
      box-shadow:0 0 0 7px rgba(28,111,230,.10);
      flex:0 0 8px;
    }

    .hero-side{
      display:grid;
      justify-items:end;
      gap:14px;
    }

    .hero-machine{
      width:min(220px, 46vw);
      aspect-ratio:1;
      border-radius:30px;
      padding:14px;
      background:
        radial-gradient(circle at 28% 20%, rgba(255,255,255,.94), rgba(255,255,255,.18) 42%, rgba(255,255,255,0) 60%),
        linear-gradient(160deg, rgba(28,111,230,.12) 0%, rgba(255,255,255,.68) 42%, rgba(20,184,92,.08) 100%);
      border:1px solid rgba(255,255,255,.94);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.92),
        0 20px 42px rgba(28,111,230,.12);
      display:grid;
      place-items:center;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }

    .hero-machine svg{
      width:100%;
      height:100%;
      display:block;
      overflow:visible;
      filter:drop-shadow(0 18px 24px rgba(28,111,230,.10));
      animation:floatIcon 5.8s ease-in-out infinite;
    }

    .hero-machine .head{ animation:headPulse 2.7s ease-in-out infinite; transform-origin:108px 56px; }
    .hero-machine .flow-a{ animation:flowDropA 1.2s ease-in-out infinite; transform-origin:108px 92px; }
    .hero-machine .flow-b{ animation:flowDropB 1.2s ease-in-out infinite .2s; transform-origin:108px 108px; }
    .hero-machine .bottle{ animation:bottleLift 2.4s ease-in-out infinite; transform-origin:110px 148px; }
    .hero-machine .glow-ring{ animation:glowPulse 2.8s ease-in-out infinite; transform-origin:110px 110px; }

    @keyframes floatIcon{
      0%,100%{ transform:translateY(0px); }
      50%{ transform:translateY(-6px); }
    }
    @keyframes headPulse{
      0%,100%{ transform:translateY(0) scale(1); }
      50%{ transform:translateY(-2px) scale(1.015); }
    }
    @keyframes bottleLift{
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-3px); }
    }
    @keyframes flowDropA{
      0%{ opacity:.25; transform:translateY(-4px) scaleY(.7); }
      45%{ opacity:1; transform:translateY(6px) scaleY(1.15); }
      100%{ opacity:.15; transform:translateY(16px) scaleY(.8); }
    }
    @keyframes flowDropB{
      0%{ opacity:.10; transform:translateY(-6px) scaleY(.6); }
      45%{ opacity:.95; transform:translateY(8px) scaleY(1.18); }
      100%{ opacity:.10; transform:translateY(18px) scaleY(.78); }
    }
    @keyframes glowPulse{
      0%,100%{ opacity:.52; transform:scale(1); }
      50%{ opacity:.95; transform:scale(1.03); }
    }

    .btn{
      appearance:none;
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      min-height:50px;
      padding:0 18px;
      border-radius:16px;
      font-size:14px;
      font-weight:900;
      letter-spacing:-.01em;
      cursor:pointer;
      box-shadow:0 12px 22px rgba(15,23,42,.06);
      transition:transform .12s ease, filter .12s ease, opacity .12s ease, background .12s ease;
    }
    .btn:hover{ filter:brightness(1.01); }
    .btn:active{ transform:scale(.985); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; }
    .btn-primary{
      background:linear-gradient(145deg, var(--blue) 0%, var(--blue-dark) 100%);
      border-color:rgba(28,111,230,.32);
      color:#fff;
      box-shadow:0 16px 28px rgba(28,111,230,.20);
    }

    .section{
      background:var(--card);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      border:1px solid rgba(255,255,255,.88);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:20px;
      display:grid;
      gap:16px;
    }

    .section-title{
      margin:0;
      font-size:14px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .stock-card{
      display:flex;
      align-items:flex-end;
      gap:10px;
      min-height:112px;
      padding:18px 20px;
      border-radius:24px;
      background:
        radial-gradient(circle at 16% 18%, rgba(255,255,255,.34), rgba(255,255,255,0) 42%),
        linear-gradient(145deg, var(--blue) 0%, var(--blue-dark) 100%);
      color:#fff;
      box-shadow:0 16px 34px rgba(28,111,230,.18);
    }

    .stock-qty{
      font-size:clamp(40px, 8vw, 62px);
      line-height:.9;
      font-weight:950;
      letter-spacing:-.05em;
    }

    .stock-uom{
      padding-bottom:8px;
      font-size:18px;
      font-weight:900;
      letter-spacing:.04em;
      text-transform:uppercase;
      opacity:.92;
    }

    .produce-wrap{
      display:grid;
      gap:12px;
    }

    .produce-btn{
      appearance:none;
      border:0;
      background:
        radial-gradient(circle at 16% 14%, rgba(255,255,255,.30), rgba(255,255,255,0) 45%),
        linear-gradient(145deg, var(--blue) 0%, var(--blue-dark) 100%);
      color:#fff;
      width:100%;
      min-height:clamp(180px, 34vh, 280px);
      border-radius:28px;
      padding:20px;
      text-align:center;
      font-size:clamp(30px, 5vw, 54px);
      line-height:1.02;
      font-weight:950;
      letter-spacing:-.04em;
      cursor:pointer;
      box-shadow:0 20px 38px rgba(28,111,230,.18);
      transition:transform .14s ease, filter .14s ease, opacity .14s ease;
    }
    .produce-btn:hover{ filter:brightness(1.02); }
    .produce-btn:active{ transform:scale(.992); }
    .produce-btn:disabled{ opacity:.55; cursor:not-allowed; }

    .current-user{
      min-height:46px;
      padding:12px 14px;
      border-radius:16px;
      background:#f8fbff;
      border:1px solid rgba(28,111,230,.10);
      font-size:14px;
      font-weight:850;
      color:#385378;
      overflow-wrap:anywhere;
    }

    .movements{
      display:grid;
      gap:10px;
    }

    .movement{
      background:var(--card-solid);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px 16px;
      display:grid;
      gap:8px;
      box-shadow:0 8px 20px rgba(15,23,42,.04);
    }

    .movement-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
    }

    .movement-qty{
      font-size:20px;
      font-weight:900;
      letter-spacing:-.02em;
    }

    .movement-user{
      font-size:14px;
      font-weight:850;
      color:var(--ink);
      text-align:right;
      overflow-wrap:anywhere;
    }

    .movement-date{
      font-size:13px;
      font-weight:700;
      color:var(--muted);
    }

    .empty{
      padding:14px 0;
      color:var(--muted);
      font-weight:700;
    }

    .modal[hidden]{ display:none !important; }
    .modal{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.28);
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:100;
    }

    .modal-card{
      width:min(420px, 100%);
      background:#fff;
      border:1px solid rgba(255,255,255,.9);
      border-radius:24px;
      box-shadow:0 24px 64px rgba(15,23,42,.18);
      padding:20px;
      display:grid;
      gap:14px;
    }

    .modal-card h2{
      margin:0;
      font-size:26px;
      line-height:1.08;
      letter-spacing:-.02em;
    }

    .field{
      display:grid;
      gap:8px;
    }

    .field label{
      font-size:12px;
      font-weight:800;
      letter-spacing:.05em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .field input{
      width:100%;
      appearance:none;
      border:1px solid var(--line);
      border-radius:16px;
      min-height:58px;
      padding:0 16px;
      font-size:28px;
      font-weight:900;
      text-align:center;
      color:var(--ink);
      background:#fff;
      outline:none;
    }

    .field input:focus{
      border-color:rgba(28,111,230,.55);
      box-shadow:0 0 0 4px rgba(28,111,230,.12);
    }

    .modal-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(18px + var(--safe-bottom));
      transform:translateX(-50%) translateY(12px);
      opacity:0;
      pointer-events:none;
      z-index:120;
      background:rgba(15,23,42,.92);
      color:#fff;
      border-radius:14px;
      padding:12px 16px;
      font-size:14px;
      font-weight:800;
      box-shadow:0 18px 40px rgba(15,23,42,.18);
      transition:opacity .18s ease, transform .18s ease;
      max-width:min(90vw, 520px);
      text-align:center;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    .toast.ok{ background:rgba(22,163,74,.96); }
    .toast.err{ background:rgba(220,38,38,.96); }

    @media (max-width: 760px){
      .hero{
        grid-template-columns:1fr;
        padding:20px;
      }
      .hero-side{
        justify-items:start;
      }
      .hero-machine{
        width:min(170px, 52vw);
      }
    }

    @media (max-width: 640px){
      body{
        padding-left:12px;
        padding-right:12px;
      }
      .section{
        padding:16px;
        border-radius:24px;
      }
      .hero{
        border-radius:28px;
      }
      .hero h1{
        font-size:clamp(32px, 10.5vw, 50px);
      }
      .produce-btn{
        min-height:210px;
        font-size:clamp(26px, 8vw, 42px);
      }
      .movement-user{
        text-align:left;
      }
      .modal-actions{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">

      </div>
    </header>

    <section class="section">
      <h2 class="section-title">Stock attuale Cerea</h2>
      <div class="stock-card">

    <section class="section">
      <h2 class="section-title">Produci</h2>
      <div class="produce-wrap">
        <button id="btnProduce" class="produce-btn" type="button" disabled>PRODUCI</button>
        <div id="currentUser" class="current-user">Non connesso</div>

      <h2 class="section-title">Movimenti</h2>

      </div>

  </div>

  <div id="produceModal" class="modal" hidden aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Produci</h2>
      <div class="field">
        <label for="qtyInput">Quantità</label>
        <input id="qtyInput" type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" value="1" />

        <button id="btnCancel" class="btn" type="button">Annulla</button>
        <button id="btnConfirm" class="btn btn-primary" type="button">Conferma</button>

  <script type="module">

    function safeInt(value){
      const n = parseInt(String(value ?? "").replace(/[^\d-]/g, ""), 10);

    }

    function normalizeWarehouse(value){
      const s = String(value || "").trim().toLowerCase();
      if (!s) return WAREHOUSE;
      if (s === "cerea" || s.startsWith("cer") || s.includes("cerea")) return WAREHOUSE;
      return s;
    }

    function tsToDate(ts){
      try{
        if (!ts) return null;
        if (typeof ts.toDate === "function") return ts.toDate();
        if (ts instanceof Date) return ts;
        const d = new Date(ts);
        return Number.isNaN(d.getTime()) ? null : d;
      }catch(_){
        return null;
      }
    }

    function fmtDateTime(ts){
      const d = tsToDate(ts);
      if (!d) return "—";
      try{
        return d.toLocaleString("it-IT", { dateStyle: "short", timeStyle: "short" });
      }catch(_){
        return d.toLocaleString("it-IT");
      }
    }

    function todayYYYYMMDD(){
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: TZ,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());
      const map = Object.fromEntries(parts.map(p => [p.type, p.value]));
      return `${map.year}-${map.month}-${map.day}`;
    }

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function titleCaseWords(value){
      return String(value || "")
        .split(/\s+/)
        .filter(Boolean)
        .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
        .join(" ");
    }

    function prettifyEmail(value){
      const raw = String(value || "").trim();
      if (!raw.includes("@")) return raw;
      const local = raw.split("@")[0].replace(/[._-]+/g, " ").trim();
      return local ? titleCaseWords(local) : raw;
    }

    function resolveUserLabel(){
      if (!state.user) return "Non connesso";
      return state.user.displayName || prettifyEmail(state.user.email) || state.user.email || state.user.uid || "Connesso";
    }

    function resolveActorLabel(raw){
      const value = String(raw || "").trim();
      if (!value){
        return state.user?.displayName || prettifyEmail(state.user?.email) || "—";
      }

      const meEmail = String(state.user?.email || "").trim().toLowerCase();
      const meUid = String(state.user?.uid || "").trim().toLowerCase();
      const meName = String(state.user?.displayName || "").trim().toLowerCase();
      const rawLc = value.toLowerCase();

      if ((meEmail && rawLc === meEmail) || (meUid && rawLc === meUid) || (meName && rawLc === meName)){
        return resolveUserLabel();
      }

      return prettifyEmail(value) || value;
    }

    function computeStockTotal(){
      return (state.codeMovements || [])
        .filter(mv => normalizeWarehouse(mv.warehouse) === WAREHOUSE)
        .reduce((sum, mv) => {
          const qty = safeInt(mv.qty);
          return sum + (String(mv.type || "IN").toUpperCase() === "OUT" ? -qty : qty);
        }, 0);
    }

    let toastTimer = null;
    function showToast(message, kind = ""){
      const el = els.toast;
      el.textContent = String(message || "");
      el.className = `toast${kind ? " " + kind : ""} show`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.className = "toast";
      }, 2600);
    }

    function humanAuthErr(err){
      const code = String(err?.code || err?.message || "").toLowerCase();
      const map = {
        "auth/unauthorized-domain": "Dominio non autorizzato in Firebase Auth.",
        "auth/operation-not-allowed": "Provider Google non abilitato in Firebase.",
        "auth/popup-blocked": "Popup bloccato dal browser: provo il redirect.",
        "auth/popup-closed-by-user": "Popup chiuso: riprova.",
        "auth/cancelled-popup-request": "Richiesta annullata: riprova.",
        "auth/network-request-failed": "Connessione instabile: riprova.",
        "auth/invalid-api-key": "Config Firebase non valida.",
        "permission-denied": "Permessi Firestore insufficienti."
      };
      for (const key of Object.keys(map)){
        if (code.includes(key)) return map[key];
      }
      return "Operazione non riuscita.";
    }

    function mapMovement(docSnap){
      const data = docSnap.data() || {};
      return {
        id: docSnap.id,
        type: String(data.type || "IN").trim(),
        code: String(data.code || "").trim(),
        qty: safeInt(data.qty),
        uom: String(data.uom || UOM).trim() || UOM,
        warehouse: String(data.warehouse || "").trim(),
        createdAt: data.createdAt || data.date || null,
        createdBy: String(data.createdByName || data.createdBy || data.userEmail || data.user || data.author || "").trim()
      };
    }

    function renderMovements(){
      if (!state.user){
        els.movements.innerHTML = '<div class="empty">Accedi per vedere i movimenti.</div>';
        return;
      }

      const list = (state.codeMovements || [])
        .filter(mv => normalizeWarehouse(mv.warehouse) === WAREHOUSE)
        .slice()
        .sort((a, b) => {
          const at = tsToDate(a.createdAt)?.getTime() || 0;
          const bt = tsToDate(b.createdAt)?.getTime() || 0;
          return bt - at;
        })
        .slice(0, 30);

      if (!list.length){
        els.movements.innerHTML = '<div class="empty">Nessun movimento trovato.</div>';
        return;
      }

      els.movements.innerHTML = list.map(mv => {
        const sign = String(mv.type || "IN").toUpperCase() === "OUT" ? "-" : "+";
        const who = resolveActorLabel(mv.createdBy);
        return `
          <div class="movement">
            <div class="movement-top">
              <div class="movement-qty">${escapeHtml(sign + " " + mv.qty.toLocaleString("it-IT") + " " + (mv.uom || UOM))}</div>
              <div class="movement-user">${escapeHtml(who)}</div>
            </div>
            <div class="movement-date">${escapeHtml(fmtDateTime(mv.createdAt))}</div>
          </div>
        `;
      }).join("");
    }

    function render(){
      els.currentUser.textContent = resolveUserLabel();
      els.stockQty.textContent = state.user ? computeStockTotal().toLocaleString("it-IT") : "—";
      els.stockUom.textContent = UOM;
      els.btnLogin.hidden = !!state.user;
      els.btnProduce.disabled = !(state.user && state.db) || state.busy;
      renderMovements();
    }

    function focusQtyInput(){
      const runFocus = () => {
        try{ els.qtyInput.focus({ preventScroll: true }); }catch(_){ try{ els.qtyInput.focus(); }catch(__){} }
        try{ els.qtyInput.click(); }catch(_){ }
        try{ els.qtyInput.select(); }catch(_){ }
        try{ els.qtyInput.setSelectionRange(0, String(els.qtyInput.value || "").length); }catch(_){ }
      };

      runFocus();
      requestAnimationFrame(runFocus);
      setTimeout(runFocus, 120);
    }

    function openModal(){
      els.produceModal.hidden = false;
      els.produceModal.setAttribute("aria-hidden", "false");
      els.qtyInput.value = "1";
      focusQtyInput();
    }

    function closeModal(){
      els.produceModal.hidden = true;
      els.produceModal.setAttribute("aria-hidden", "true");
    }

    function subscribeCodeMovements(){
      if (state.unsubMovements){
        try{ state.unsubMovements(); }catch(_){ }
        state.unsubMovements = null;
      }

      state.codeMovements = [];

      if (!(state.user && state.db)){
        render();
        return;
      }

      const q = query(orgCol("inventoryMovements"), where("code", "==", CODE));
      state.unsubMovements = onSnapshot(q, (snap) => {
        state.codeMovements = snap.docs.map(mapMovement);
        render();
      }, (err) => {
        console.error("inventoryMovements listener failed", err);
        showToast(humanAuthErr(err), "err");
      });
    }

    async function signIn(){
      try{
        await signInWithPopup(state.auth, provider);
      }catch(err){
        console.warn("signIn popup failed", err);
        if (String(err?.code || "").includes("popup-blocked") || String(err?.code || "").includes("operation-not-supported-in-this-environment")){
          try{
            await signInWithRedirect(state.auth, provider);
            return;
          }catch(err2){
            console.warn("signIn redirect failed", err2);
            showToast(humanAuthErr(err2), "err");
            return;
          }
        }
        showToast(humanAuthErr(err), "err");
      }
    }

    async function produceNow(){
      if (state.busy) return;
      if (!(state.user && state.db)){
        showToast("Accedi per produrre", "err");
        return;
      }

      const qty = safeInt(els.qtyInput.value);
      if (!Number.isFinite(qty) || qty <= 0){
        showToast("Inserisci una quantità valida", "err");
        els.qtyInput.focus();
        els.qtyInput.select();
        return;
      }

      state.busy = true;
      render();

      const date = todayYYYYMMDD();
      const docNum = `ESTR-${date}-${Math.random().toString(36).slice(2, 8).toUpperCase()}`;
      const userLabel = state.user.displayName || prettifyEmail(state.user.email) || state.user.email || state.user.uid || "";

      const payload = {
        type: "IN",
        customer: "Produzione",
        code: CODE,
        item: ITEM_NAME,
        uom: UOM,
        qtyRaw: `${qty} ${UOM}`,
        qty,
        date,
        note: NOTE,
        source: SOURCE,
        rawText: "",
        warehouse: WAREHOUSE,
        docType: "PRODUZIONE",
        docNum,
        docDateRaw: date,
        createdAt: serverTimestamp(),
        createdBy: userLabel,
        createdByName: userLabel
      };

      try{
        await addDoc(orgCol("inventoryMovements"), payload);
        closeModal();
        showToast(`Caricati ${qty.toLocaleString("it-IT")} ${UOM}`, "ok");
      }catch(err){
        console.error("produceNow failed", err);
        showToast(humanAuthErr(err), "err");
      }finally{
        state.busy = false;
        render();
      }
    }

    async function init(){
      try{
        state.app = initializeApp(FIREBASE_CONFIG);
        state.auth = getAuth(state.app);
        await setPersistence(state.auth, browserLocalPersistence);
        state.db = initializeFirestore(state.app, {
          experimentalAutoDetectLongPolling: true,
          useFetchStreams: false
        });

        try{
          await getRedirectResult(state.auth);
        }catch(err){
          console.warn("getRedirectResult failed", err);
        }

        onAuthStateChanged(state.auth, (user) => {
          state.user = user || null;
          if (state.user){
            subscribeCodeMovements();
          }else{
            if (state.unsubMovements){
              try{ state.unsubMovements(); }catch(_){ }
              state.unsubMovements = null;
            }
            state.codeMovements = [];
            render();
          }
          render();
        });
      }catch(err){
        console.error("init failed", err);
        showToast(humanAuthErr(err), "err");
      }

      render();
    }

    els.btnLogin.addEventListener("click", signIn);

    els.btnProduce.addEventListener("click", () => {
      if (!(state.user && state.db)){
        showToast("Accedi per produrre", "err");
        return;
      }
      openModal();
      focusQtyInput();
    });

    els.btnCancel.addEventListener("click", closeModal);
    els.btnConfirm.addEventListener("click", produceNow);

    els.produceModal.addEventListener("click", (event) => {
      if (event.target === els.produceModal) closeModal();
    });

    els.qtyInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter"){
        event.preventDefault();
        produceNow();
      }
      if (event.key === "Escape"){
        event.preventDefault();
        closeModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !els.produceModal.hidden){
        closeModal();
      }
    });

    init();
  </script>
</body>
</html>
