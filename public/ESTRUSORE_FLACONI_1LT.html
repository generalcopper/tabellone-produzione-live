<html lang="it" translate="no">
<head>

  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --ink:#0f172a;
      --muted:#64748b;
      --line:rgba(15,23,42,.10);
      --blue:#1c6fe6;
      --blue-dark:#1656b2;
      --shadow:0 16px 44px rgba(15,23,42,.08);
      --radius:24px;
      --safe-top:env(safe-area-inset-top);
      --safe-bottom:env(safe-area-inset-bottom);
      --max:860px;
    }

    *{ box-sizing:border-box; }
    html,body{
      margin:0;
      min-height:100%;
      background:
        radial-gradient(1000px 420px at 10% -10%, rgba(28,111,230,.18), transparent 60%),
        radial-gradient(900px 460px at 100% 0%, rgba(22,163,74,.10), transparent 58%),
        var(--bg);
      color:var(--ink);
      font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    body{
      padding:calc(16px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
    }

    .shell{
      max-width:var(--max);
      margin:0 auto;
      display:grid;
      gap:16px;
    }

    .topbar{
      position:relative;
      overflow:hidden;
      background:
        linear-gradient(140deg, rgba(255,255,255,.96) 0%, rgba(248,251,255,.92) 52%, rgba(240,247,255,.90) 100%);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border:1px solid rgba(255,255,255,.98);
      border-radius:30px;
      box-shadow:
        0 24px 64px rgba(15,23,42,.10),
        inset 0 1px 0 rgba(255,255,255,.95),
        inset 0 -1px 0 rgba(15,23,42,.03);
      padding:18px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
      isolation:isolate;
    }

    .topbar::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(520px 180px at -4% 0%, rgba(28,111,230,.18), transparent 58%),
        radial-gradient(340px 180px at 102% 0%, rgba(34,197,94,.10), transparent 60%),
        linear-gradient(90deg, rgba(255,255,255,.26), rgba(255,255,255,0));
      pointer-events:none;
      z-index:0;
    }

    .topbar::after{
      content:"";
      position:absolute;
      left:18px;
      right:18px;
      top:0;
      height:1px;
      background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.92), rgba(255,255,255,0));
      pointer-events:none;
      z-index:0;
    }

    .brand{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      gap:16px;
      min-width:0;
      flex:1 1 auto;
    }

    .brand-icon{
      width:72px;
      height:72px;
      flex:0 0 72px;
      border-radius:22px;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 28% 24%, rgba(255,255,255,.86), rgba(255,255,255,0) 44%),
        linear-gradient(155deg, rgba(28,111,230,.18), rgba(28,111,230,.07) 58%, rgba(255,255,255,.7));
      border:1px solid rgba(28,111,230,.12);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.88),
        0 12px 30px rgba(28,111,230,.10);
    }

    .brand-icon svg{
      width:42px;
      height:42px;
      display:block;
    }

    .brand-title{
      min-width:0;
    }

    h1{
      margin:0;
      font-size:clamp(22px, 3.4vw, 34px);
      line-height:1.02;
      letter-spacing:-.03em;
      text-wrap:balance;
    }

    .top-actions{
      position:relative;
      z-index:1;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      appearance:none;
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      min-height:48px;
      padding:0 18px;
      border-radius:15px;
      font-size:14px;
      font-weight:900;
      letter-spacing:-.01em;
      cursor:pointer;
      box-shadow:0 10px 22px rgba(15,23,42,.06);
      transition:transform .12s ease, filter .12s ease, opacity .12s ease, background .12s ease, box-shadow .12s ease;
    }
    .btn:hover{ filter:brightness(1.01); }
    .btn:active{ transform:scale(.985); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; }
    .btn-primary{
      background:linear-gradient(145deg, var(--blue) 0%, var(--blue-dark) 100%);
      border-color:rgba(28,111,230,.42);

      box-shadow:0 14px 28px rgba(28,111,230,.22);
    }
    .btn-secondary{
      background:#eef4ff;
      border-color:rgba(28,111,230,.18);
      color:var(--blue);
    }

    .section{
      background:rgba(255,255,255,.86);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      border:1px solid rgba(255,255,255,.9);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:20px;
      display:grid;
      gap:16px;
    }

    .section-title{
      margin:0;
      font-size:14px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .produce-wrap{
      display:grid;
      gap:12px;
    }

    .produce-btn{

      border:0;
      background:
        radial-gradient(circle at 16% 14%, rgba(255,255,255,.30), rgba(255,255,255,0) 45%),

      width:100%;
      min-height:clamp(170px, 34vh, 270px);
      border-radius:28px;
      padding:20px;
      text-align:center;
      font-size:clamp(30px, 5vw, 54px);
      line-height:1.04;
      font-weight:900;
      letter-spacing:-.03em;
      cursor:pointer;
      transition:transform .14s ease, filter .14s ease, opacity .14s ease;
    }
    .produce-btn:hover{ filter:brightness(1.02); }
    .produce-btn:active{ transform:scale(.992); }
    .produce-btn:disabled{ opacity:.55; cursor:not-allowed; }

    .current-user{
      min-height:42px;
      padding:10px 14px;
      border-radius:14px;
      background:#f8fbff;
      border:1px solid rgba(28,111,230,.10);
      font-size:14px;
      font-weight:800;
      color:var(--muted);
      overflow-wrap:anywhere;
    }


    .stock-box{
      min-height:120px;
      border-radius:24px;
      padding:22px 24px;
      background:
        radial-gradient(circle at 16% 14%, rgba(255,255,255,.72), rgba(255,255,255,0) 40%),
        linear-gradient(145deg, rgba(28,111,230,.10), rgba(28,111,230,.03) 58%, rgba(255,255,255,.92));
      border:1px solid rgba(28,111,230,.12);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.96),
        0 10px 24px rgba(28,111,230,.06);
      display:grid;
      gap:8px;
      align-content:center;
      justify-items:start;
    }

    .stock-qty{
      font-size:clamp(40px, 7vw, 64px);
      line-height:1;
      font-weight:900;
      letter-spacing:-.04em;
      color:var(--ink);
    }

    .stock-meta{
      font-size:13px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .movements{
      display:grid;
      gap:10px;
    }

    .movement{
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px 16px;
      display:grid;
      gap:8px;
    }

    .movement-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
    }

    .movement-qty{
      font-size:20px;
      font-weight:900;
      letter-spacing:-.02em;
    }

    .movement-user{
      font-size:14px;
      font-weight:800;
      color:var(--ink);
      text-align:right;
      overflow-wrap:anywhere;
    }

    .movement-date{
      font-size:13px;
      font-weight:700;
      color:var(--muted);
    }

    .empty{
      padding:14px 0;
      color:var(--muted);
      font-weight:700;
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.28);
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:100;
      opacity:0;
      visibility:hidden;
      pointer-events:none;
      transition:opacity .16s ease, visibility .16s ease;
    }

    .modal.is-open{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }

    .modal-card{
      width:min(420px, 100%);
      background:#fff;
      border:1px solid rgba(255,255,255,.9);
      border-radius:24px;
      box-shadow:0 24px 64px rgba(15,23,42,.18);
      padding:20px;
      display:grid;
      gap:14px;
    }

    .modal-card h2{
      margin:0;
      font-size:26px;
      line-height:1.08;
      letter-spacing:-.02em;
    }

    .field{
      display:grid;
      gap:8px;
    }

    .field label{
      font-size:12px;
      font-weight:800;
      letter-spacing:.05em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .field input{
      width:100%;
      appearance:none;
      border:1px solid var(--line);
      border-radius:16px;
      min-height:58px;
      padding:0 16px;
      font-size:28px;
      font-weight:900;
      text-align:center;
      color:var(--ink);
      background:#fff;
      outline:none;
    }

    .field input:focus{
      border-color:rgba(28,111,230,.55);
      box-shadow:0 0 0 4px rgba(28,111,230,.12);
    }

    .modal-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(18px + var(--safe-bottom));
      transform:translateX(-50%) translateY(12px);
      opacity:0;
      pointer-events:none;
      z-index:120;
      background:rgba(15,23,42,.92);
      color:#fff;
      border-radius:14px;
      padding:12px 16px;
      font-size:14px;
      font-weight:800;
      box-shadow:0 18px 40px rgba(15,23,42,.18);
      transition:opacity .18s ease, transform .18s ease;
      max-width:min(90vw, 520px);
      text-align:center;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    .toast.ok{ background:rgba(22,163,74,.96); }
    .toast.err{ background:rgba(220,38,38,.96); }

    @media (max-width: 640px){
      body{
        padding-left:12px;
        padding-right:12px;
      }
      .section{
        padding:16px;
        border-radius:24px;
      }
      .brand{
        gap:12px;
      }
      .brand-icon{
        width:60px;
        height:60px;
        flex-basis:60px;
        border-radius:18px;
      }
      .brand-icon svg{
        width:36px;
        height:36px;
      }
      .produce-btn{
        min-height:210px;
        font-size:clamp(26px, 8vw, 42px);
      }
      .movement-top,
      .modal-actions{
        grid-template-columns:1fr;
      }
      .movement-user{
        text-align:left;
      }
    }
  </style>
</head>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      signOut,
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
    import {
      initializeFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      where,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyBiyB4pilnPpVj8vImD4PI6LF2_RtyDnv4",
      authDomain: "tabellone-produzione-liv-e313e.firebaseapp.com",
      projectId: "tabellone-produzione-liv-e313e",
      storageBucket: "tabellone-produzione-liv-e313e.firebasestorage.app",
      messagingSenderId: "537555699968",
      appId: "1:537555699968:web:4d04cb9596b67bfb0e4be5"
    };

    const ORG_ID = "generalcopper";
    const CODE = "ST0090B03BI01E";
    const ITEM_NAME = "Bottiglia agro 1 lt";
    const UOM = "pz";
    const WAREHOUSE = "cerea";
    const SOURCE = "Estrusore HTML";
    const NOTE = "Estrusore bottiglia agro 1 lt";
    const TZ = "Europe/Rome";

    const els = {
      btnLogin: document.getElementById("btnLogin"),
      btnProduce: document.getElementById("btnProduce"),
      currentUser: document.getElementById("currentUser"),
      stockQty: document.getElementById("stockQty"),
      stockMeta: document.getElementById("stockMeta"),
      movements: document.getElementById("movements"),
      produceModal: document.getElementById("produceModal"),
      qtyInput: document.getElementById("qtyInput"),
      btnCancel: document.getElementById("btnCancel"),
      btnConfirm: document.getElementById("btnConfirm"),
      toast: document.getElementById("toast")
    };

    const state = {
      app: null,
      auth: null,
      db: null,
      user: null,
      busy: false,
      codeMovements: [],
      unsubMovements: null
    };

    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    function orgCol(name){
      return collection(state.db, "orgs", ORG_ID, name);
    }

    function safeInt(value){
      const n = parseInt(String(value ?? "").replace(/[^\d-]/g, ""), 10);
      return Number.isFinite(n) ? n : 0;
    }

    function normalizeWarehouse(value){
      const s = String(value || "").trim().toLowerCase();
      if (!s) return WAREHOUSE;
      if (s === "cerea" || s.startsWith("cer") || s.includes("cerea")) return WAREHOUSE;
      return s;
    }

    function tsToDate(ts){
      try{
        if (!ts) return null;
        if (typeof ts.toDate === "function") return ts.toDate();
        if (ts instanceof Date) return ts;
        const d = new Date(ts);
        return Number.isNaN(d.getTime()) ? null : d;
      }catch(_){
        return null;
      }
    }

    function fmtDateTime(ts){
      const d = tsToDate(ts);
      if (!d) return "—";
      try{
        return d.toLocaleString("it-IT", { dateStyle: "short", timeStyle: "short" });
      }catch(_){
        return d.toLocaleString("it-IT");
      }
    }

    function todayYYYYMMDD(){
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: TZ,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());
      const map = Object.fromEntries(parts.map(p => [p.type, p.value]));
      return `${map.year}-${map.month}-${map.day}`;
    }

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function titleizeWords(value){
      return String(value || "")
        .split(/\s+/)
        .filter(Boolean)
        .map(part => part.charAt(0).toUpperCase() + part.slice(1).toLowerCase())
        .join(" ");
    }

    function prettifyUserLabel(value){
      const raw = String(value || "").trim();
      if (!raw) return "—";
      if (raw.includes("@")){
        const local = raw.split("@")[0].replace(/[._-]+/g, " ").trim();
        const pretty = titleizeWords(local);
        return pretty || raw;
      }
      if (!raw.includes(" ") && /[._-]/.test(raw)){
        const pretty = titleizeWords(raw.replace(/[._-]+/g, " ").trim());
        return pretty || raw;
      }
      return raw;
    }

    let toastTimer = null;
    function showToast(message, kind = ""){
      const el = els.toast;
      el.textContent = String(message || "");
      el.className = `toast${kind ? " " + kind : ""} show`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.className = "toast";
      }, 2600);
    }

    function humanAuthErr(err){
      const code = String(err?.code || err?.message || "").toLowerCase();
      const map = {
        "auth/unauthorized-domain": "Dominio non autorizzato in Firebase Auth.",
        "auth/operation-not-allowed": "Provider Google non abilitato in Firebase.",
        "auth/popup-blocked": "Popup bloccato dal browser: provo il redirect.",
        "auth/popup-closed-by-user": "Popup chiuso: riprova.",
        "auth/cancelled-popup-request": "Richiesta annullata: riprova.",
        "auth/network-request-failed": "Connessione instabile: riprova.",
        "auth/invalid-api-key": "Config Firebase non valida.",
        "permission-denied": "Permessi Firestore insufficienti."
      };
      for (const key of Object.keys(map)){
        if (code.includes(key)) return map[key];
      }
      return "Operazione non riuscita.";
    }

    function mapMovement(docSnap){
      const data = docSnap.data() || {};
      return {
        id: docSnap.id,
        type: String(data.type || "IN").trim(),
        code: String(data.code || "").trim(),
        qty: safeInt(data.qty),
        uom: String(data.uom || UOM).trim() || UOM,
        warehouse: String(data.warehouse || "").trim(),
        createdAt: data.createdAt || data.date || null,
        createdByName: String(data.createdByName || data.userName || data.displayName || "").trim(),
        createdBy: String(data.createdBy || data.userEmail || data.user || data.author || "").trim()
      };
    }

    function resolveUserLabel(){
      if (!state.user) return "Non connesso";
      return prettifyUserLabel(state.user.displayName || state.user.email || state.user.uid || "Connesso");
    }

    function extractCereaMovements(){
      return (state.codeMovements || []).filter(mv => normalizeWarehouse(mv.warehouse) === WAREHOUSE);
    }

    function resolveUom(){
      const fromMov = extractCereaMovements()
        .map(mv => String(mv.uom || "").trim())
        .find(Boolean);

      return fromMov || UOM;
    }

    function computeStockTotal(){
      return extractCereaMovements().reduce((sum, mv) => {
        const qty = safeInt(mv.qty);
        return sum + (String(mv.type || "").toUpperCase() === "OUT" ? -qty : qty);
      }, 0);
    }

    function renderMovements(){
      if (!state.user){
        els.movements.innerHTML = '<div class="empty">Accedi per vedere i movimenti.</div>';
        return;
      }

      const list = extractCereaMovements().slice()
        .sort((a, b) => {
          const at = tsToDate(a.createdAt)?.getTime() || 0;
          const bt = tsToDate(b.createdAt)?.getTime() || 0;
          return bt - at;
        })
        .slice(0, 30);

      if (!list.length){
        els.movements.innerHTML = '<div class="empty">Nessun movimento trovato.</div>';
        return;
      }

      els.movements.innerHTML = list.map(mv => {
        const sign = String(mv.type || "IN").toUpperCase() === "OUT" ? "-" : "+";
        const who = prettifyUserLabel(mv.createdByName || mv.createdBy);
        return `
          <div class="movement">
            <div class="movement-top">
              <div class="movement-qty">${escapeHtml(sign + " " + mv.qty.toLocaleString("it-IT") + " " + (mv.uom || UOM))}</div>
              <div class="movement-user">${escapeHtml(who)}</div>
            </div>
            <div class="movement-date">${escapeHtml(fmtDateTime(mv.createdAt))}</div>
          </div>
        `;
      }).join("");
    }

    function render(){
      els.currentUser.textContent = resolveUserLabel();
      if (els.stockQty){
        els.stockQty.textContent = state.user ? computeStockTotal().toLocaleString("it-IT") : "—";
      }
      if (els.stockMeta){
        els.stockMeta.textContent = resolveUom();
      }
      els.btnLogin.hidden = !!state.user;
      els.btnProduce.disabled = !(state.user && state.db) || state.busy;
      renderMovements();
    }

    function focusQtyInput(syncUserGesture = false){
      const input = els.qtyInput;
      try{
        input.focus({ preventScroll: true });
      }catch(_){
        try{ input.focus(); }catch(__){ }
      }
      try{ input.click(); }catch(_){ }
      try{ input.setSelectionRange(0, input.value.length); }catch(_){
        try{ input.select(); }catch(__){ }
      }

      if (syncUserGesture){
        requestAnimationFrame(() => {
          if (document.activeElement !== input){
            try{
              input.focus({ preventScroll: true });
            }catch(_){
              try{ input.focus(); }catch(__){ }
            }
            try{ input.click(); }catch(_){ }
            try{ input.setSelectionRange(0, input.value.length); }catch(_){
              try{ input.select(); }catch(__){ }
            }
          }
        });
      }
    }

    function openModal(syncUserGesture = false){
      els.produceModal.classList.add("is-open");
      els.produceModal.setAttribute("aria-hidden", "false");
      els.qtyInput.value = "1";
      if (syncUserGesture){
        focusQtyInput(true);
        return;
      }
      requestAnimationFrame(() => focusQtyInput(false));
    }

    function closeModal(){
      els.produceModal.classList.remove("is-open");
      els.produceModal.setAttribute("aria-hidden", "true");
    }

    function subscribeCodeMovements(){
      if (state.unsubMovements){
        try{ state.unsubMovements(); }catch(_){ }
        state.unsubMovements = null;
      }

      state.codeMovements = [];

      if (!(state.user && state.db)){
        render();
        return;
      }

      const q = query(orgCol("inventoryMovements"), where("code", "==", CODE));
      state.unsubMovements = onSnapshot(q, (snap) => {
        state.codeMovements = snap.docs.map(mapMovement);
        render();
      }, (err) => {
        console.error("inventoryMovements listener failed", err);
        showToast(humanAuthErr(err), "err");
      });
    }

    async function signIn(){
      try{
        await signInWithPopup(state.auth, provider);
      }catch(err){
        console.warn("signIn popup failed", err);
        if (String(err?.code || "").includes("popup-blocked") || String(err?.code || "").includes("operation-not-supported-in-this-environment")){
          try{
            await signInWithRedirect(state.auth, provider);
            return;
          }catch(err2){
            console.warn("signIn redirect failed", err2);
            showToast(humanAuthErr(err2), "err");
            return;
          }
        }
        showToast(humanAuthErr(err), "err");
      }
    }

    async function produceNow(){
      if (state.busy) return;
      if (!(state.user && state.db)){
        showToast("Accedi per produrre", "err");
        return;
      }

      const qty = safeInt(els.qtyInput.value);
      if (!Number.isFinite(qty) || qty <= 0){
        showToast("Inserisci una quantità valida", "err");
        els.qtyInput.focus();
        els.qtyInput.select();
        return;
      }

      state.busy = true;
      render();

      const date = todayYYYYMMDD();
      const docNum = `ESTR-${date}-${Math.random().toString(36).slice(2, 8).toUpperCase()}`;
      const userLabel = state.user.displayName || state.user.email || state.user.uid || "";
      const userEmail = state.user.email || "";

      const payload = {
        type: "IN",
        customer: "Produzione",
        code: CODE,
        item: ITEM_NAME,
        uom: UOM,
        qtyRaw: `${qty} ${UOM}`,
        qty,
        date,
        note: NOTE,
        source: SOURCE,
        rawText: "",
        warehouse: WAREHOUSE,
        docType: "PRODUZIONE",
        docNum,
        docDateRaw: date,
        createdAt: serverTimestamp(),
        createdBy: userLabel,
        createdByName: state.user.displayName || "",
        createdByEmail: userEmail,
        createdByUid: state.user.uid || ""
      };

      try{
        await addDoc(orgCol("inventoryMovements"), payload);
        closeModal();
        showToast(`Caricati ${qty.toLocaleString("it-IT")} ${UOM}`, "ok");
      }catch(err){
        console.error("produceNow failed", err);
        showToast(humanAuthErr(err), "err");
      }finally{
        state.busy = false;
        render();
      }
    }

    async function init(){
      try{
        state.app = initializeApp(FIREBASE_CONFIG);
        state.auth = getAuth(state.app);
        await setPersistence(state.auth, browserLocalPersistence);
        state.db = initializeFirestore(state.app, {
          experimentalAutoDetectLongPolling: true,
          useFetchStreams: false
        });

        try{
          await getRedirectResult(state.auth);
        }catch(err){
          console.warn("getRedirectResult failed", err);
        }

        onAuthStateChanged(state.auth, (user) => {
          state.user = user || null;
          if (state.user){
            subscribeCodeMovements();
          }else{
            if (state.unsubMovements){
              try{ state.unsubMovements(); }catch(_){ }
              state.unsubMovements = null;
            }
            state.codeMovements = [];
            render();
          }
          render();
        });
      }catch(err){
        console.error("init failed", err);
        showToast(humanAuthErr(err), "err");
      }

      render();
    }

    els.btnLogin.addEventListener("click", signIn);

    els.btnProduce.addEventListener("click", () => {
      if (!(state.user && state.db)){
        showToast("Accedi per produrre", "err");
        return;
      }
      openModal(true);
    });

    els.btnCancel.addEventListener("click", closeModal);
    els.btnConfirm.addEventListener("click", produceNow);

    els.produceModal.addEventListener("click", (event) => {
      if (event.target === els.produceModal) closeModal();
    });

    els.qtyInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter"){
        event.preventDefault();
        produceNow();
      }
      if (event.key === "Escape"){
        event.preventDefault();
        closeModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && els.produceModal.classList.contains("is-open")){
        closeModal();
      }
    });

    init();
  </script>
</body>
</html>
