<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Capannone 3D — Vista</title>

<!-- Stesso importmap del padre: serve PRIMA che il module valuti import 'three'.
     Se nel padre cambia la versione di three, aggiorna questa riga. -->
<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js" }}
</script>

<style>
  html,body{margin:0;height:100%;background:#070a0f;overflow:hidden}
  #app{position:fixed;inset:0}
  html.viewOnly .kioskGear,
  html.viewOnly #voiceToggle,
  html.viewOnly .panel,
  html.viewOnly #cockpit,
  html.viewOnly .hint,
  html.viewOnly #incomingAlert{ display:none !important; }
  html.viewOnly, html.viewOnly body{ touch-action:none; -webkit-user-select:none; user-select:none; }
  #liteErr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    color:#93a4bd;font:600 13px/1.5 Inter,system-ui,sans-serif;padding:24px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="liteErr">Impossibile caricare la vista 3D.<br>Riprova.</div>

<script type="module">
/* ============================================================
   GUSCIO LITE — figlio di capannone_3d.html (file padre UNICO e INVARIATO).
   Carica a runtime lo script del padre, lo alleggerisce in memoria
   (niente linea produzione, operatori, ombre, Firebase, gesture) e lo esegue.
   Geometria/misure/scaffalature arrivano SEMPRE dal padre aggiornato.
   ============================================================ */
(async function(){
  const Q = new URLSearchParams(location.search);
  const VIEW_CODE = Q.get('view') || '';
  const PARENT_URL = 'capannone_3d.html';

  function fail(msg){
    console.error('[lite]', msg);
    const e=document.getElementById('liteErr'); if(e) e.style.display='flex';
  }

  document.documentElement.classList.add('viewOnly');

  let html;
  try{
    const res = await fetch(PARENT_URL, { cache:'no-cache' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    html = await res.text();
  }catch(err){ return fail('fetch padre: '+err.message); }

  const m = html.match(/<script\s+type="module"\s*>([\s\S]*?)<\/script>/i);
  if(!m){ return fail('script module non trovato nel padre'); }
  let code = m[1];

  /* === PATCH RUNTIME (solo in memoria; il file padre NON viene toccato) === */

  const header = `
/* --- iniettato dal guscio lite --- */
const LITE = true;
const VIEW_ONLY = true;
const VIEW_CODE = ${JSON.stringify(VIEW_CODE)};
try{ document.documentElement.classList.add('viewOnly'); }catch(_e){}
`;
  code = header + code;

  // renderer più leggero
  code = code.replace(
    /const renderer=new THREE\.WebGLRenderer\(\{antialias:true,/,
    'const renderer=new THREE.WebGLRenderer({antialias:false,'
  );
  code = code.replace(
    /renderer\.setPixelRatio\(Math\.min\(devicePixelRatio,\s*2\)\);/,
    'renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));'
  );
  code = code.replace(
    /renderer\.shadowMap\.enabled=true;/,
    'renderer.shadowMap.enabled=false;'
  );

  // salta LINEA PRODUZIONE + OPERATORI
  code = code.replace(
    /(\/\* ===== AREA LINEA LIQUIDI[\s\S]*?\*\/\s*)\(function\(\)\{/,
    '$1if(!LITE)(function(){'
  );

  // cockpit off
  code = code.replace(
    /function updateCockpit\(now\)\{/,
    'function updateCockpit(now){ if(LITE) return;'
  );
  code = code.replace(
    /function _showCockpitAtStartup\(\)\{/,
    'function _showCockpitAtStartup(){ if(LITE) return;'
  );

  // gesture off (5 listener)
  code = code.replace(
    /renderer\.domElement\.addEventListener\('pointerdown',e=>downXY=\[e\.clientX,e\.clientY\]\);/,
    "renderer.domElement.addEventListener('pointerdown',e=>{ if(VIEW_ONLY) return; downXY=[e.clientX,e.clientY]; });"
  );
  code = code.replace(
    /el\.addEventListener\('pointerdown',e=>\{el\.setPointerCapture\(e\.pointerId\);/,
    "el.addEventListener('pointerdown',e=>{ if(VIEW_ONLY) return; el.setPointerCapture(e.pointerId);"
  );
  code = code.replace(
    /el\.addEventListener\('pointermove',e=>\{\s*\n\s*if\(!dragging&&!panning\)return;/,
    "el.addEventListener('pointermove',e=>{ if(VIEW_ONLY) return;\n  if(!dragging&&!panning)return;"
  );
  code = code.replace(
    /el\.addEventListener\('wheel',e=>\{e\.preventDefault\(\);/,
    "el.addEventListener('wheel',e=>{ if(VIEW_ONLY){ e.preventDefault(); return; } e.preventDefault();"
  );
  code = code.replace(
    /el\.addEventListener\('touchmove',e=>\{if\(e\.touches\.length===2\)\{/,
    "el.addEventListener('touchmove',e=>{ if(VIEW_ONLY) return; if(e.touches.length===2){"
  );

  // Firebase off + focus diretto
  code = code.replace(
    /\(async function connectCloud\(\)\{\s*\n\s*setCloudStatus\('Autenticazione…',\s*'#f59e0b'\);/,
    "(async function connectCloud(){\n" +
    "  if(LITE){\n" +
    "    if(VIEW_CODE){\n" +
    "      let _t=0; const go=()=>{ _t++; let ok=false;\n" +
    "        try{ ok=findAndHighlightRackCode(VIEW_CODE,{fromCloud:true}); }catch(_e){ ok=false; }\n" +
    "        if(!ok && _t<14) setTimeout(go,200);\n" +
    "      }; setTimeout(go,300);\n" +
    "    }\n" +
    "    return;\n" +
    "  }\n" +
    "  setCloudStatus('Autenticazione…', '#f59e0b');"
  );

  // 7) VOCE/ANNUNCI off in vista (niente TTS, niente chiamate cloud function).
  code = code.replace(
    /const Voce = \(function\(\)\{\s*\n\s*let abilitata = true;/,
    "const Voce = (function(){\n  let abilitata = false;"
  );
  code = code.replace(
    /const Annunci = \(\(\)=>\{/,
    "const Annunci = LITE ? { onOrders(){}, onCarico(){}, onTick(){}, prime(){}, say(){} } : (()=>{"
  );

  try{
    const blob = new Blob([code], { type:'text/javascript' });
    const url = URL.createObjectURL(blob);
    await import(url);
    setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(_e){} }, 5000);
  }catch(err){
    fail('exec module: '+(err && err.message || err));
  }
})();
</script>
</body>
</html>
