<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Capannone 3D — Vista</title>

<!-- Stesso importmap del padre: serve PRIMA che il module valuti import 'three'.
     Se nel padre cambia la versione di three, aggiorna questa riga. -->
<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js" }}
</script>

<style>
  html,body{margin:0;height:100%;background:#070a0f;overflow:hidden}
  #app{position:fixed;inset:0}
  html.viewOnly .kioskGear,
  html.viewOnly #voiceToggle,
  html.viewOnly .panel,
  html.viewOnly #cockpit,
  html.viewOnly .hint,
  html.viewOnly #incomingAlert{ display:none !important; }
  html.viewOnly, html.viewOnly body{ touch-action:none; -webkit-user-select:none; user-select:none; }
  #liteErr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    color:#93a4bd;font:600 13px/1.5 Inter,system-ui,sans-serif;padding:24px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="liteErr">Impossibile caricare la vista 3D.<br>Riprova.</div>

<script type="module">
/* ============================================================
   GUSCIO LITE — figlio di capannone_3d.html (file padre UNICO e INVARIATO).
   Carica a runtime lo script del padre, lo alleggerisce in memoria
   (niente linea produzione, operatori, ombre, Firebase, gesture) e lo esegue.
   Geometria/misure/scaffalature arrivano SEMPRE dal padre aggiornato.
   ============================================================ */
(async function(){
  const Q = new URLSearchParams(location.search);
  const VIEW_CODE = Q.get('view') || '';

  // Candidati per il padre: assoluto dalla root, relativo alla lite, e nome semplice.
  // Il primo che risponde 200 viene usato. Robusto a sottocartelle/redirect.
  const PARENT_CANDIDATES = [
    new URL('capannone_3d.html', location.href).href,   // relativo alla posizione della lite
    location.origin + '/capannone_3d.html',             // assoluto dalla root del dominio
    'capannone_3d.html'                                  // nudo
  ];

  function showErr(msg){
    const e=document.getElementById('liteErr');
    if(e){
      e.innerHTML = 'Impossibile caricare la vista 3D.<br><span style="opacity:.6;font-size:11px">'+
                    String(msg).replace(/</g,'&lt;')+'</span>';
      e.style.display='flex';
    }
    console.error('[lite]', msg);
  }

  document.documentElement.classList.add('viewOnly');

  // --- fetch del padre, provando i candidati in ordine ---
  let html=null, usedUrl='', lastErr='';
  for(const u of PARENT_CANDIDATES){
    try{
      const res = await fetch(u, { cache:'no-cache', credentials:'same-origin' });
      if(!res.ok){ lastErr='HTTP '+res.status+' su '+u; continue; }
      const t = await res.text();
      if(t && /type="module"/.test(t)){ html=t; usedUrl=u; break; }
      lastErr='contenuto inatteso da '+u;
    }catch(err){ lastErr=(err&&err.message||err)+' su '+u; }
  }
  if(!html){ return showErr('fetch padre fallito • '+lastErr); }

  // --- estrai il blocco <script type="module"> del motore (NON l'importmap) ---
  // prende l'ULTIMO script type=module (l'importmap è type=importmap, non match)
  const re = /<script[^>]*type=["']module["'][^>]*>([\s\S]*?)<\/script>/gi;
  let m, last=null;
  while((m = re.exec(html)) !== null){ last = m; }
  if(!last){ return showErr('script module non trovato nel padre ('+usedUrl+')'); }
  let code = last[1];

  /* === PATCH RUNTIME (solo in memoria; il file padre NON viene toccato) === */

  // 0) Neutralizza eventuali dichiarazioni di LITE/VIEW_ONLY/VIEW_CODE già presenti
  //    nel padre (alcune versioni del file le contengono) per evitare la doppia
  //    dichiarazione "already declared". Copre const/let/var.
  //    NB: non tocchiamo eventuali helper come _Q (resterebbe inutilizzato, innocuo).
  code = code.replace(/(?:const|let|var)\s+(?:LITE|VIEW_ONLY|VIEW_CODE)\s*=[^;\n]*;?/g, '');

  // 1) Inietta i flag (var: tollerante anche se restasse un riferimento)
  const header = `
/* --- iniettato dal guscio lite --- */
var LITE = true;
var VIEW_ONLY = true;
var VIEW_CODE = ${JSON.stringify(VIEW_CODE)};
try{ document.documentElement.classList.add('viewOnly'); }catch(_e){}
`;
  code = header + code;

  // renderer più leggero
  code = code.replace(
    /const renderer=new THREE\.WebGLRenderer\(\{antialias:true,/,
    'const renderer=new THREE.WebGLRenderer({antialias:false,'
  );
  code = code.replace(
    /renderer\.setPixelRatio\(Math\.min\(devicePixelRatio,\s*2\)\);/,
    'renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));'
  );
  code = code.replace(
    /renderer\.shadowMap\.enabled=true;/,
    'renderer.shadowMap.enabled=false;'
  );

  // salta LINEA PRODUZIONE + OPERATORI
  code = code.replace(
    /(\/\* ===== AREA LINEA LIQUIDI[\s\S]*?\*\/\s*)\(function\(\)\{/,
    '$1if(!LITE)(function(){'
  );

  // cockpit off
  code = code.replace(
    /function updateCockpit\(now\)\{/,
    'function updateCockpit(now){ if(LITE) return;'
  );
  code = code.replace(
    /function _showCockpitAtStartup\(\)\{/,
    'function _showCockpitAtStartup(){ if(LITE) return;'
  );

  // gesture off (5 listener)
  code = code.replace(
    /renderer\.domElement\.addEventListener\('pointerdown',e=>downXY=\[e\.clientX,e\.clientY\]\);/,
    "renderer.domElement.addEventListener('pointerdown',e=>{ if(VIEW_ONLY) return; downXY=[e.clientX,e.clientY]; });"
  );
  code = code.replace(
    /el\.addEventListener\('pointerdown',e=>\{el\.setPointerCapture\(e\.pointerId\);/,
    "el.addEventListener('pointerdown',e=>{ if(VIEW_ONLY) return; el.setPointerCapture(e.pointerId);"
  );
  code = code.replace(
    /el\.addEventListener\('pointermove',e=>\{\s*\n\s*if\(!dragging&&!panning\)return;/,
    "el.addEventListener('pointermove',e=>{ if(VIEW_ONLY) return;\n  if(!dragging&&!panning)return;"
  );
  code = code.replace(
    /el\.addEventListener\('wheel',e=>\{e\.preventDefault\(\);/,
    "el.addEventListener('wheel',e=>{ if(VIEW_ONLY){ e.preventDefault(); return; } e.preventDefault();"
  );
  code = code.replace(
    /el\.addEventListener\('touchmove',e=>\{if\(e\.touches\.length===2\)\{/,
    "el.addEventListener('touchmove',e=>{ if(VIEW_ONLY) return; if(e.touches.length===2){"
  );

  // Firebase off + focus diretto
  code = code.replace(
    /\(async function connectCloud\(\)\{\s*\n\s*setCloudStatus\('Autenticazione…',\s*'#f59e0b'\);/,
    "(async function connectCloud(){\n" +
    "  if(LITE){\n" +
    "    if(VIEW_CODE){\n" +
    "      let _t=0; const go=()=>{ _t++; let ok=false;\n" +
    "        try{ ok=findAndHighlightRackCode(VIEW_CODE,{fromCloud:true}); }catch(_e){ ok=false; }\n" +
    "        if(!ok && _t<14) setTimeout(go,200);\n" +
    "      }; setTimeout(go,300);\n" +
    "    }\n" +
    "    return;\n" +
    "  }\n" +
    "  setCloudStatus('Autenticazione…', '#f59e0b');"
  );

  // 7) VOCE/ANNUNCI off in vista (niente TTS, niente chiamate cloud function).
  code = code.replace(
    /const Voce = \(function\(\)\{\s*\n\s*let abilitata = true;/,
    "const Voce = (function(){\n  let abilitata = false;"
  );
  code = code.replace(
    /const Annunci = \(\(\)=>\{/,
    "const Annunci = LITE ? { onOrders(){}, onCarico(){}, onTick(){}, prime(){}, say(){} } : (()=>{"
  );

  // 8) IMPORT 'three' → URL assoluto. Un modulo eseguito da Blob URL non eredita
  //    l'importmap della pagina, quindi il bare specifier 'three' fallirebbe.
  //    Ricavo l'URL reale dall'importmap del PADRE (così segue la versione del padre);
  //    in mancanza, uso il CDN di default.
  let threeUrl = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';
  try{
    const im = html.match(/<script[^>]*type=["']importmap["'][^>]*>([\s\S]*?)<\/script>/i);
    if(im){
      const map = JSON.parse(im[1]);
      if(map && map.imports && map.imports.three) threeUrl = map.imports.three;
    }
  }catch(_e){}
  // sostituisci tutte le forme di import di 'three'
  code = code.replace(/from\s*['"]three['"]/g, `from ${JSON.stringify(threeUrl)}`);
  code = code.replace(/import\s*\(\s*['"]three['"]\s*\)/g, `import(${JSON.stringify(threeUrl)})`);

  try{
    const blob = new Blob([code], { type:'text/javascript' });
    const url = URL.createObjectURL(blob);
    await import(url);
    setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(_e){} }, 5000);
  }catch(err){
    showErr('exec module: '+(err && err.message || err));
  }
})();
</script>
</body>
</html>
