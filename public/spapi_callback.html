<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SP-API Callback</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 24px; }
    pre { background: #f6f8fa; padding: 16px; border-radius: 10px; overflow: auto; }
    .btn { padding: 10px 14px; border: 1px solid #ccc; border-radius: 10px; cursor: pointer; background: white; }
  </style>
</head>
<body>
  <h1>Amazon SP-API Callback</h1>
  <p>Qui sotto trovi il codice. Copialo e usalo per ottenere il refresh token.</p>

  <pre id="out">Caricamento…</pre>
  <button class="btn" id="copy">Copia spapi_oauth_code</button>

  <script>
    const p = new URLSearchParams(location.search);

    // Amazon può usare spapi_oauth_code; a volte può comparire anche code
    const spapiCode = p.get('spapi_oauth_code') || p.get('code') || '';
    const sellerId  = p.get('selling_partner_id') || '';
    const state     = p.get('state') || '';

    const payload = {
      spapi_oauth_code: spapiCode,
      selling_partner_id: sellerId,
      state,
      full_query: Object.fromEntries(p.entries())
    };

    document.getElementById('out').textContent = JSON.stringify(payload, null, 2);

    document.getElementById('copy').onclick = async () => {
      if (!spapiCode) return alert('Nessun codice trovato nella URL.');
      await navigator.clipboard.writeText(spapiCode);
      alert('Codice copiato negli appunti.');
    };
  </script>
</body>
</html>
