<!doctype html>
<html lang="it" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>Ubicazione</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <style>
    :root{
      --bg:#f6f7f9;
      --surface:#ffffff;
      --surfaceAlt:#fafbfc;
      --ink:#0f172a;
      --muted:#64748b;
      --muted2:#94a3b8;
      --line:#e6e8ec;
      --line2:#eef0f3;
      --shadow:0 1px 2px rgba(15,23,42,.04), 0 1px 1px rgba(15,23,42,.03);
      --shadowMd:0 1px 3px rgba(15,23,42,.06), 0 4px 12px rgba(15,23,42,.05);
      --accent:#f97316;
      --accentHover:#ea580c;
      --accentSoft:#fff7ed;
      --accentSoft2:#ffedd5;
      --ok:#15803d;
      --okBg:#f0fdf4;
      --okLine:#bbf7d0;
      --warn:#b45309;
      --warnBg:#fffbeb;
      --warnLine:#fde68a;
      --bad:#b91c1c;
      --badBg:#fef2f2;
      --badLine:#fecaca;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --app-height: 100vh;
    }
    *{ box-sizing:border-box; }
    html,body{ min-height:100%; }
    html{ -webkit-text-size-adjust:100%; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      font-size:14px;
      line-height:1.5;
      letter-spacing:-0.005em;
    }
    *{ scrollbar-width:thin; scrollbar-color:#c9cdd3 transparent; }
    *::-webkit-scrollbar{ width:10px; height:10px; }
    *::-webkit-scrollbar-track{ background:transparent; }
    *::-webkit-scrollbar-thumb{ background:#c9cdd3; border-radius:999px; border:2px solid transparent; background-clip:padding-box; }
    button,select,input{ font-family:inherit; font-size:16px; }
    .wrap{
      min-height:var(--app-height);
      padding:calc(12px + var(--safe-top)) calc(14px + var(--safe-right)) calc(18px + var(--safe-bot)) calc(14px + var(--safe-left));
      max-width:1280px;
      margin:0 auto;
    }
    .topbar{
      position:sticky;
      top:calc(0px + var(--safe-top));
      z-index:20;
      background:rgba(255,255,255,.85);
      backdrop-filter:saturate(180%) blur(14px);
      -webkit-backdrop-filter:saturate(180%) blur(14px);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:var(--shadow);
      padding:10px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .brand{ display:flex; align-items:center; gap:12px; min-width:0; }
    .brandMark{
      width:38px; height:38px; border-radius:10px;
      display:grid; place-items:center;
      background:linear-gradient(135deg,var(--accent) 0%,var(--accentHover) 100%);
      box-shadow:0 1px 2px rgba(249,115,22,.25),0 4px 10px rgba(249,115,22,.18);
      flex:0 0 auto;
    }
    .brandMark svg{ width:20px; height:20px; }
    .brandTitle{ font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .brandSub{ margin-top:1px; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .hdrActions{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--surfaceAlt);
      max-width:min(420px,50vw);
    }
    .dot{ width:8px; height:8px; border-radius:999px; background:#ef4444; box-shadow:0 0 0 3px rgba(239,68,68,.15); flex:0 0 auto; }
    .dot.ok{ background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.18); }
    .pillText{ min-width:0; font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .btn{
      border:1px solid var(--line);
      border-radius:10px;
      padding:9px 14px;
      font-weight:500;
      font-size:13px;
      cursor:pointer;
      background:var(--surface);
      color:var(--ink);
      box-shadow:var(--shadow);
      transition:background .15s ease,border-color .15s ease,transform .1s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .btn:hover{ background:var(--surfaceAlt); border-color:#d8dce2; }
    .btn:active{ transform:translateY(1px); }
    .btn.amazon{ background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 1px 2px rgba(249,115,22,.20),0 2px 8px rgba(249,115,22,.18); }
    .btn.amazon:hover{ background:var(--accentHover); border-color:var(--accentHover); }
    .layout{ margin-top:14px; display:grid; grid-template-columns:220px minmax(0,1fr); gap:14px; align-items:start; }
    .side,.card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
    .side{ padding:8px; position:sticky; top:78px; }
    .navBtn{
      width:100%;
      border:0;
      background:transparent;
      color:var(--ink);
      text-align:left;
      padding:12px 14px;
      border-radius:10px;
      cursor:pointer;
      font-size:14px;
      font-weight:600;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      -webkit-tap-highlight-color:transparent;
    }
    .navBtn:hover{ background:var(--surfaceAlt); }
    .navBtn.active{ background:var(--accentSoft); color:var(--accentHover); }
    .count{ color:var(--muted); font-weight:700; font-size:12px; }
    .navBtn.active .count{ color:var(--accentHover); }
    .list{ display:flex; flex-direction:column; }
    .itemRow{
      display:grid;
      grid-template-columns:minmax(0,1fr) 140px 230px;
      gap:14px;
      align-items:center;
      padding:13px 16px;
      border-bottom:1px solid var(--line2);
      background:var(--surface);
    }
    .itemRow:nth-child(even){ background:var(--surfaceAlt); }
    .itemRow:last-child{ border-bottom:none; }
    .prodName{
      min-width:0;
      font-weight:600;
      font-size:14px;
      line-height:1.35;
      overflow-wrap:anywhere;
      word-break:break-word;
    }
    .sideData{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      min-width:0;
    }
    .dataLabel{ font-size:12px; color:var(--muted); font-weight:600; white-space:nowrap; }
    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:42px;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid var(--okLine);
      background:var(--okBg);
      color:var(--ok);
      font-size:12px;
      font-weight:700;
      white-space:nowrap;
    }
    .badge.warn{ border-color:var(--warnLine); background:var(--warnBg); color:var(--warn); }
    .badge.bad{ border-color:var(--badLine); background:var(--badBg); color:var(--bad); }
    .selectWrap{ display:flex; align-items:center; gap:8px; min-width:0; }
    .locationSelect{
      width:100%;
      min-width:0;
      border:1px solid var(--line);
      border-radius:10px;
      padding:9px 10px;
      background:var(--surface);
      color:var(--ink);
      outline:none;
      font-size:14px;
      font-weight:600;
    }
    .locationSelect:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(249,115,22,.15); }
    .locationSelect[multiple]{ min-height:112px; }
    .locationSelect:disabled{ opacity:.55; cursor:not-allowed; }
    .empty{ padding:28px 16px; color:var(--muted); text-align:center; }
    .authOverlay{
      position:fixed; inset:0;
      background:rgba(15,17,17,.45);
      backdrop-filter:blur(8px) saturate(150%);
      -webkit-backdrop-filter:blur(8px) saturate(150%);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:9998;
      opacity:0;
      pointer-events:none;
      transition:opacity .22s ease;
    }
    .authOverlay.show{ opacity:1; pointer-events:auto; }
    .authBox{
      width:min(440px,94vw);
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:0 8px 28px rgba(0,0,0,.20);
      padding:18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }
    .authTitle{ font-weight:700; }
    .toast{
      position:fixed;
      left:50%;
      bottom:calc(18px + var(--safe-bot));
      transform:translateX(-50%) translateY(14px);
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease,transform .2s ease;
      z-index:9999;
      width:min(520px,92vw);
      border:1px solid var(--line);
      background:var(--surface);
      border-radius:12px;
      box-shadow:0 4px 14px rgba(15,17,17,.18),0 1px 3px rgba(15,17,17,.10);
      padding:12px 14px;
    }
    .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
    .toastTitle{ font-weight:700; font-size:13px; }
    .toastBody{ margin-top:3px; font-size:12px; color:var(--muted); }
    @media(max-width:820px){
      .layout{ grid-template-columns:1fr; }
      .side{ position:static; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
      .navBtn{ justify-content:center; text-align:center; }
      .itemRow{ grid-template-columns:1fr; gap:8px; }
      .sideData{ justify-content:flex-start; }
      .selectWrap{ width:100%; }
      .pill{ display:none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="brandMark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 8.2c3.1 2.5 6.2 3.7 8.8 3.7 2.7 0 5-1.2 7.2-3.7" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            <path d="M6.3 16.4c2.1 1.6 4.3 2.4 6.3 2.4 2.2 0 4.4-.8 6.8-2.4" stroke="rgba(255,255,255,.55)" stroke-width="2" stroke-linecap="round"/>
            <path d="M4.3 12.4h15.4" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div style="min-width:0">
          <div class="brandTitle">Ubicazione</div>
          <div class="brandSub" id="brandSub">Accesso richiesto</div>
        </div>
      </div>
      <div class="hdrActions">
        <div class="pill"><span class="dot" id="dotAuth"></span><span class="pillText" id="authStatus">Accesso non attivo</span></div>
        <button class="btn amazon" id="btnLogin" type="button">Accedi</button>
      </div>
    </div>

    <div class="layout">
      <aside class="side">
        <button class="navBtn active" type="button" data-section="without">Senza ubicazione <span class="count" id="countWithout">—</span></button>
        <button class="navBtn" type="button" data-section="with">Con ubicazione <span class="count" id="countWith">—</span></button>
      </aside>
      <main class="card">
        <div class="list" id="productList"></div>
      </main>
    </div>
  </div>

  <div class="authOverlay" id="authOverlay" aria-hidden="true">
    <div class="authBox">
      <div class="authTitle">Accesso richiesto</div>
      <button class="btn amazon" id="btnLoginOverlay" type="button">Accedi</button>
    </div>
  </div>

  <div class="toast" id="toast">
    <div class="toastTitle" id="toastTitle">Info</div>
    <div class="toastBody" id="toastBody"></div>
  </div>

<script type="module">
  const firebaseConfig = {
    apiKey: "AIzaSyBiyB4pilnPpVj8vImD4PI6LF2_RtyDnv4",
    authDomain: "tabellone-produzione-liv-e313e.firebaseapp.com",
    projectId: "tabellone-produzione-liv-e313e",
    storageBucket: "tabellone-produzione-liv-e313e.firebasestorage.app",
    messagingSenderId: "537555699968",
    appId: "1:537555699968:web:4d04cb9596b67bfb0e4be5"
  };

  const COL_ROOT = "amzInventory";
  const SUB_ITEMS = "items";
  const COL_PRODUCTS = "amzInventoryProducts";
  const DISPLAY_LOC = "concamarise";
  const WATCH_LOCS = ["concamarise", "cerea"];
  const ADMIN_EMAILS = ["ludovico@generalcoppersrl.com"];
  const RACK_PALLET_CAPACITY = 480;

  const state = {
    firebase:{ ok:false, app:null, auth:null, db:null, api:null, authApi:null },
    user:null,
    section:"without",
    itemsByLoc:{ concamarise:[], cerea:[] },
    unsubByLoc:{ concamarise:null, cerea:null },
    savingSku:null
  };

  const $ = (id)=>document.getElementById(id);
  const escapeHtml = (s)=>String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
  const squashWhitespace = (s)=>String(s||"").replace(/\s+/g," ").trim();
  const toSkuId = (s)=>String(s||"").trim().replace(/\s+/g," ").toUpperCase();
  const normalizeText = (s)=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
  const sameList = (a,b)=>JSON.stringify(normalizeRackLocationsList(a))===JSON.stringify(normalizeRackLocationsList(b));

  function updateAppHeight(){
    const h = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0);
    if(h) document.documentElement.style.setProperty("--app-height", `${h}px`);
  }
  window.addEventListener("resize", updateAppHeight, { passive:true });
  window.addEventListener("orientationchange", ()=>setTimeout(updateAppHeight,160), { passive:true });
  updateAppHeight();

  let toastTimer = null;
  function toast(title, body="", ms=2200){
    const el = $("toast");
    if(!el) return;
    if(toastTimer) clearTimeout(toastTimer);
    $("toastTitle").textContent = title || "Info";
    $("toastBody").textContent = body || "";
    el.classList.add("show");
    toastTimer = setTimeout(()=>el.classList.remove("show"), ms);
  }

  function cleanProductMainName(s){
    let t = squashWhitespace(s || "");
    t = t.replace(/^\s*Dettagli\s+SKU\s+Informazioni\/azione\s+Quantit[aà]\s+da\s+inviare\s*/i, "");
    t = t.replace(/^\s*(?:Dettagli\s+SKU\s+)?Informazioni\/azione\s+Quantit[aà]\s+da\s+inviare\s*/i, "");
    t = t.replace(/^\s*Dettagli\s+SKU\s*/i, "");
    t = t.replace(/^\s*Informazioni\/azione\s*/i, "");
    t = t.replace(/^\s*Quantit[aà]\s+da\s+inviare\s*/i, "");
    t = t.replace(/^\s*(?:Pacchi|Unit[aà]|Unita)\s*:\s*\d+\s*/i, "");
    t = t.replace(/^\s*Unit[aà]\s+per\s+pacco\s*:\s*\d+\s*/i, "");
    t = t.replace(/\bPreparazione\s+non\s+richiesta\b/ig, "");
    t = t.replace(/\bCodice\s+a\s+barre\s+del\s+produttore\b/ig, "");
    t = t.replace(/\bPronto\s+per\s+la\s+spedizione\b/ig, "");
    t = t.replace(/^[\|\-–•·]+\s*/g, "").replace(/[\|\-–•·]+\s*$/g, "");
    return squashWhitespace(t);
  }

  function parseTitleMeta(rawTitle){
    const t = squashWhitespace(rawTitle || "");
    if(!t) return { main:"" };
    let cut = t.length;
    for(const re of [/\bSKU\s*:/i, /\bASIN\s*:/i, /Tipo\s+di\s+stoccaggio/i]){
      const i = t.search(re);
      if(i > 0) cut = Math.min(cut, i);
    }
    const main = cleanProductMainName(t.slice(0, cut).trim()) || t;
    return { main };
  }

  function buildRackLocationOptions(){
    const out = [];
    const addBay = (rack, bay, pallets)=>{
      const b = String(bay).padStart(2, "0");
      for(let l=1; l<=3; l++){
        for(let p=1; p<=pallets; p++) out.push(`${rack}${b}-L${l}-P${p}`);
      }
    };
    for(let bay=1; bay<=4; bay++) addBay("A", bay, bay===4 ? 2 : 3);
    for(let bay=1; bay<=4; bay++) addBay("B", bay, 3);
    for(let bay=1; bay<=4; bay++) addBay("C", bay, bay===1 ? 2 : 3);
    for(let bay=1; bay<=4; bay++) addBay("D", bay, bay===4 ? 2 : 3);
    for(let bay=1; bay<=2; bay++) addBay("E", bay, 3);
    for(let bay=1; bay<=2; bay++) addBay("F", bay, 3);
    return out;
  }

  const RACK_LOCATION_OPTIONS = buildRackLocationOptions();
  const RACK_LOCATION_SET = new Set(RACK_LOCATION_OPTIONS);

  function normalizeRackLocation(v){
    return String(v || "").trim().toUpperCase().replace(/\s+/g, "");
  }

  function normalizeRackLocationsList(value){
    const raw = Array.isArray(value) ? value : String(value || "").split(/[;,\n]+/g);
    const out = [];
    const seen = new Set();
    for(const x of raw){
      const code = normalizeRackLocation(x);
      if(!code || seen.has(code)) continue;
      seen.add(code);
      out.push(code);
    }
    return out;
  }

  function isPositiveStockDoc(d){
    const q = Number(d && d.qty);
    return Number.isFinite(q) && q > 0;
  }

  function readRackLocationsFromDoc(d){
    if(d && !isPositiveStockDoc(d)) return [];
    const raw = (d && Object.prototype.hasOwnProperty.call(d, "rackLocations"))
      ? d.rackLocations
      : (d?.rackLocation || d?.shelfLocation || d?.storageSlot || d?.warehouseSlot || d?.ubicazione || "");
    return normalizeRackLocationsList(raw);
  }

  function rackLocationsLabel(value){
    const list = normalizeRackLocationsList(value);
    return list.length ? list.join(", ") : "—";
  }

  function sanitizeRackLocationsForQty(value, qty){
    const list = normalizeRackLocationsList(value);
    const q = Number(qty);
    if(Number.isFinite(q) && q <= 0) return [];
    if(Number.isFinite(q) && Math.abs(q) <= RACK_PALLET_CAPACITY) return list.slice(0, 1);
    return list;
  }

  function rackLocationOccupantInfo(code, currentSku="", currentLoc=""){
    const target = normalizeRackLocation(code);
    if(!target) return null;
    const curSku = toSkuId(currentSku || "");
    const curLoc = currentLoc || DISPLAY_LOC;
    for(const loc of WATCH_LOCS){
      for(const it of (state.itemsByLoc[loc] || [])){
        if(!isPositiveStockDoc(it)) continue;
        const values = readRackLocationsFromDoc(it);
        if(!values.includes(target)) continue;
        const itemSku = toSkuId(it.sku || it.id || "");
        if(itemSku === curSku && loc === curLoc) continue;
        return { sku:itemSku, loc, title:it.title || "" };
      }
    }
    return null;
  }

  function isRackLocationAvailableForItem(code, currentSku="", currentLoc=""){
    const s = normalizeRackLocation(code);
    if(!s) return true;
    if(!RACK_LOCATION_SET.has(s)) return false;
    return !rackLocationOccupantInfo(s, currentSku, currentLoc);
  }

  function areRackLocationsAvailableForItem(value, currentSku="", currentLoc=""){
    return normalizeRackLocationsList(value).every(code => isRackLocationAvailableForItem(code, currentSku, currentLoc));
  }

  function shouldAllowMultipleRackLocations(qty, selected=""){
    const list = normalizeRackLocationsList(selected);
    const q = Number(qty);
    return list.length > 1 || (Number.isFinite(q) && Math.abs(q) > RACK_PALLET_CAPACITY);
  }

  function rackLocationSelectOptions(selected, currentSku="", currentLoc=DISPLAY_LOC, multiple=false){
    const selectedSet = new Set(normalizeRackLocationsList(selected));
    const groups = ["A","B","C","D","E","F"];
    const out = multiple ? [] : [`<option value=""${selectedSet.size ? "" : " selected"}>—</option>`];
    let visible = 0;

    for(const g of groups){
      const codes = RACK_LOCATION_OPTIONS
        .filter(x=>x.startsWith(g))
        .filter(code => selectedSet.has(code) || isRackLocationAvailableForItem(code, currentSku, currentLoc));
      if(!codes.length) continue;
      out.push(`<optgroup label="Scaffalatura ${escapeHtml(g)}">`);
      for(const code of codes){
        visible++;
        out.push(`<option value="${escapeHtml(code)}"${selectedSet.has(code) ? " selected" : ""}>${escapeHtml(code)}</option>`);
      }
      out.push(`</optgroup>`);
    }

    const invalidSelected = Array.from(selectedSet).filter(code => !RACK_LOCATION_SET.has(code));
    if(invalidSelected.length){
      out.push(`<optgroup label="Attuale non in lista">`);
      for(const code of invalidSelected) out.push(`<option value="${escapeHtml(code)}" selected>${escapeHtml(code)}</option>`);
      out.push(`</optgroup>`);
    }else if(!visible){
      out.push(`<option value="" disabled>Nessuna libera</option>`);
    }
    return out.join("");
  }

  function syncAuthUi(){
    const ok = !!state.user?.isWhitelisted;
    $("dotAuth")?.classList.toggle("ok", ok);
    if($("authStatus")) $("authStatus").textContent = ok ? (state.user.displayName || state.user.email || "Utente") : "Accesso non attivo";
    if($("brandSub")) $("brandSub").textContent = ok ? (state.user.displayName || state.user.email || "Utente") : "Accesso richiesto";
    if($("btnLogin")) $("btnLogin").style.display = ok ? "none" : "";
    $("authOverlay")?.classList.toggle("show", !ok);
    $("authOverlay")?.setAttribute("aria-hidden", ok ? "true" : "false");
  }

  function displayItems(){
    return (state.itemsByLoc[DISPLAY_LOC] || [])
      .filter(it => Number(it.qty) > 0)
      .sort((a,b)=>String(a.title || a.sku || "").localeCompare(String(b.title || b.sku || ""), "it"));
  }

  function renderCounts(){
    const items = displayItems();
    const withLoc = items.filter(it=>readRackLocationsFromDoc(it).length).length;
    const withoutLoc = items.length - withLoc;
    if($("countWith")) $("countWith").textContent = String(withLoc);
    if($("countWithout")) $("countWithout").textContent = String(withoutLoc);
  }

  function render(){
    renderCounts();
    const list = $("productList");
    if(!list) return;
    if(!state.user?.isWhitelisted){
      list.innerHTML = `<div class="empty">—</div>`;
      return;
    }

    let items = displayItems();
    if(state.section === "with") items = items.filter(it=>readRackLocationsFromDoc(it).length);
    else items = items.filter(it=>!readRackLocationsFromDoc(it).length);

    if(!items.length){
      list.innerHTML = `<div class="empty">—</div>`;
      return;
    }

    list.innerHTML = items.map(it=>{
      const sku = toSkuId(it.sku || it.id || "");
      const title = parseTitleMeta(it.title || sku).main || sku;
      const qty = Number.isFinite(Number(it.qty)) ? Math.round(Number(it.qty)) : 0;
      const locs = readRackLocationsFromDoc(it);
      const allowMulti = shouldAllowMultipleRackLocations(qty, locs);
      const badgeClass = qty <= 0 ? "bad" : (qty <= RACK_PALLET_CAPACITY ? "" : "warn");
      const saving = state.savingSku === sku;
      const selectHtml = allowMulti
        ? `<select class="locationSelect" data-sku="${escapeHtml(sku)}" multiple size="4" ${saving ? "disabled" : ""}>${rackLocationSelectOptions(locs, sku, DISPLAY_LOC, true)}</select>`
        : `<select class="locationSelect" data-sku="${escapeHtml(sku)}" ${saving ? "disabled" : ""}>${rackLocationSelectOptions(locs, sku, DISPLAY_LOC, false)}</select>`;
      return `
        <div class="itemRow" data-sku="${escapeHtml(sku)}">
          <div class="prodName">${escapeHtml(title)}</div>
          <div class="sideData"><span class="dataLabel">Disponibilità</span><span class="badge ${badgeClass}">${escapeHtml(String(qty))}</span></div>
          <div class="selectWrap"><span class="dataLabel">Ubicazione</span>${selectHtml}</div>
        </div>`;
    }).join("");
  }

  function getItemBySku(sku){
    const s = toSkuId(sku || "");
    return (state.itemsByLoc[DISPLAY_LOC] || []).find(it=>toSkuId(it.sku || it.id || "") === s) || null;
  }

  function selectedFromSelect(select){
    if(select.multiple) return Array.from(select.selectedOptions || []).map(opt=>opt.value);
    return select.value ? [select.value] : [];
  }

  async function saveLocation(sku, selected){
    const item = getItemBySku(sku);
    if(!item) return;
    const s = toSkuId(item.sku || item.id || sku);
    const qty = Number(item.qty || 0);
    const current = readRackLocationsFromDoc(item);
    const next = sanitizeRackLocationsForQty(selected, qty);

    if(sameList(current, next)){
      render();
      return;
    }

    if(!next.every(code => RACK_LOCATION_SET.has(code))){
      toast("Ubicazione non valida");
      render();
      return;
    }
    if(qty <= RACK_PALLET_CAPACITY && next.length > 1){
      toast("Ubicazione", `Più posti solo sopra ${RACK_PALLET_CAPACITY} pz.`);
      render();
      return;
    }
    if(!areRackLocationsAvailableForItem(next, s, DISPLAY_LOC)){
      const occ = next.map(code=>rackLocationOccupantInfo(code, s, DISPLAY_LOC)).find(Boolean);
      toast("Ubicazione occupata", occ ? `${occ.sku}` : "Scegli un posto libero.");
      render();
      return;
    }

    const ok = confirm(`Confermi modifica ubicazione?\n\n${s}\nUbicazione: ${rackLocationsLabel(next)}`);
    if(!ok){
      render();
      return;
    }

    const api = state.firebase.api;
    const db = state.firebase.db;
    if(!api || !db) return;

    state.savingSku = s;
    render();
    try{
      const nowClient = Date.now();
      const itemRef = api.doc(db, COL_ROOT, DISPLAY_LOC, SUB_ITEMS, item.id || s);
      const productRef = api.doc(db, COL_PRODUCTS, s);
      const data = {
        rackLocation: next[0] || "",
        rackLocations: next,
        updatedAt: api.serverTimestamp(),
        updatedAtClient: nowClient,
        updatedBy: state.user?.email || state.user?.uid || ""
      };
      const batch = api.writeBatch(db);
      batch.set(itemRef, data, { merge:true });
      batch.set(productRef, { sku:s, ...data, lastSeenAt: api.serverTimestamp(), lastSeenAtClient: nowClient, lastSeenLocation: DISPLAY_LOC, lastSeenKind:"ubicazione" }, { merge:true });
      await batch.commit();
      toast("Salvato", "Cloud aggiornato.");
    }catch(err){
      console.error(err);
      toast("Errore", String(err?.message || err).slice(0,180));
    }finally{
      state.savingSku = null;
      render();
    }
  }

  function stopWatchers(){
    for(const loc of WATCH_LOCS){
      try{ state.unsubByLoc[loc]?.(); }catch(_e){}
      state.unsubByLoc[loc] = null;
      state.itemsByLoc[loc] = [];
    }
  }

  function startWatchers(){
    if(!state.firebase.ok || !state.user?.isWhitelisted) return;
    const api = state.firebase.api;
    const db = state.firebase.db;
    for(const loc of WATCH_LOCS){
      if(state.unsubByLoc[loc]) continue;
      const col = api.collection(db, COL_ROOT, loc, SUB_ITEMS);
      const q = api.query(col, api.orderBy("sku"), api.limit(4000));
      state.unsubByLoc[loc] = api.onSnapshot(q, (snap)=>{
        const arr = [];
        snap.forEach(docSnap=>{
          const d = docSnap.data() || {};
          const sku = d.sku || docSnap.id;
          const title = d.title || d.name || sku;
          const qty = Number.isFinite(Number(d.qty)) ? Number(d.qty) : 0;
          arr.push({
            id: docSnap.id,
            sku,
            title,
            titleNorm: d.titleNorm || normalizeText(title || sku),
            qty,
            rackLocation: d.rackLocation || "",
            rackLocations: readRackLocationsFromDoc({ ...d, qty }),
            updatedAt:d.updatedAt || null,
            updatedAtClient:d.updatedAtClient || null
          });
        });
        state.itemsByLoc[loc] = arr;
        render();
      }, (err)=>{
        console.error(err);
        toast("Errore", String(err?.message || err).slice(0,180));
      });
    }
  }

  async function resolveUserRole(authUser){
    const api = state.firebase.api;
    const db = state.firebase.db;
    const emailLower = (authUser?.email || "").toLowerCase();
    let isAdmin = !!(emailLower && ADMIN_EMAILS.includes(emailLower));
    let isWhitelisted = false;

    for(const col of ["amzInventoryDirectory", "payrollDirectory"]){
      if(!emailLower) continue;
      try{
        const snap = await api.getDoc(api.doc(db, col, emailLower));
        if(snap.exists()){
          const d = snap.data() || {};
          isWhitelisted = d.enabled !== false;
          if(isWhitelisted) break;
        }
      }catch(_e){}
    }

    for(const id of [authUser?.uid, emailLower].filter(Boolean)){
      try{
        const snap = await api.getDoc(api.doc(db, "powderUsers", id));
        if(snap.exists()){
          const d = snap.data() || {};
          if(d.isAdmin === true || d.admin === true || d.role === "admin" || (Array.isArray(d.roles) && d.roles.includes("admin"))) isAdmin = true;
        }
      }catch(_e){}
    }

    state.user = {
      uid: authUser.uid,
      email: authUser.email || "",
      displayName: authUser.displayName || authUser.email || "Utente",
      isAdmin,
      isWhitelisted: isWhitelisted || isAdmin
    };
  }

  async function initFirebase(){
    try{
      const [{ initializeApp }, authMod, fsMod] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js"),
        import("https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js")
      ]);

      const app = initializeApp(firebaseConfig);
      const auth = authMod.getAuth(app);
      const db = fsMod.getFirestore(app);
      try{ await authMod.setPersistence(auth, authMod.browserLocalPersistence); }catch(_e){}

      state.firebase = {
        ok:true,
        app,
        auth,
        db,
        authApi:authMod,
        api:{
          collection:fsMod.collection,
          doc:fsMod.doc,
          getDoc:fsMod.getDoc,
          setDoc:fsMod.setDoc,
          writeBatch:fsMod.writeBatch,
          serverTimestamp:fsMod.serverTimestamp,
          query:fsMod.query,
          orderBy:fsMod.orderBy,
          limit:fsMod.limit,
          onSnapshot:fsMod.onSnapshot
        }
      };

      const provider = new authMod.GoogleAuthProvider();
      provider.setCustomParameters({ prompt:"select_account" });

      async function login(){
        try{
          const ua = navigator.userAgent || "";
          const appleMobile = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
          const standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
          if(appleMobile || standalone) await authMod.signInWithRedirect(auth, provider);
          else await authMod.signInWithPopup(auth, provider);
        }catch(err){
          const code = String(err?.code || "");
          if(code.includes("popup")) await authMod.signInWithRedirect(auth, provider);
          else toast("Accesso non riuscito", String(err?.message || err).slice(0,180));
        }
      }

      $("btnLogin")?.addEventListener("click", login);
      $("btnLoginOverlay")?.addEventListener("click", login);
      try{ await authMod.getRedirectResult(auth); }catch(_e){}

      authMod.onAuthStateChanged(auth, async (user)=>{
        if(user){
          await resolveUserRole(user);
          syncAuthUi();
          if(state.user?.isWhitelisted) startWatchers();
          else { stopWatchers(); toast("Account non abilitato"); }
          render();
        }else{
          state.user = null;
          stopWatchers();
          syncAuthUi();
          render();
        }
      });
    }catch(err){
      console.error(err);
      toast("Errore Firebase", String(err?.message || err).slice(0,180));
    }
  }

  document.querySelectorAll(".navBtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.section = btn.getAttribute("data-section") === "with" ? "with" : "without";
      document.querySelectorAll(".navBtn").forEach(b=>b.classList.toggle("active", b === btn));
      render();
    });
  });

  $("productList")?.addEventListener("change", (e)=>{
    const select = e.target?.closest?.(".locationSelect");
    if(!select) return;
    const sku = select.getAttribute("data-sku") || "";
    saveLocation(sku, selectedFromSelect(select));
  });

  syncAuthUi();
  render();
  initFirebase();
</script>
</body>
</html>
