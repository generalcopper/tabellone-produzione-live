name: Verify ordered warehouse interface
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/minimal-originale/**'
      - 'functions/picking-notifications/**'
      - 'scripts/*ordered-warehouse.mjs'
      - 'scripts/costs-api-copy.mjs'
      - 'scripts/*vehicles*.mjs'
      - 'scripts/*security*.mjs'
      - 'scripts/check-warehouse-webapp.mjs'
      - '.github/workflows/*'
      - 'public/picking*'
      - 'tests/*.test.cjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: node scripts/check-ordered-warehouse.mjs
      - name: Verify Picking inventory and locations
        run: node --test tests/picking-home.test.cjs tests/shared-stock-owner.test.cjs tests/location-assignment.test.cjs tests/picking-bionee.test.cjs tests/located-quantity.test.cjs tests/cerea-contract.test.cjs
      - name: Verify warehouse reads and legacy coverage
        run: node --test functions/picking-notifications/warehouse-monitor.test.js
