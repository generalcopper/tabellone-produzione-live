name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TABELLONE_PRODUZIONE_LIV_E313E }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.20.0

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project tabellone-produzione-liv-e313e --non-interactive
